name: Patch detail decouple and updater

on:
  push:
    paths:
      - 'tools/patch_detail_decouple_updater.py'
      - '.github/workflows/patch-detail-decouple-updater.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/patch_detail_decouple_updater.py
      - name: Commit patch
        run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt app/src/main/AndroidManifest.xml app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: decouple match detail and wire in-app updater"
            git push
          fi
