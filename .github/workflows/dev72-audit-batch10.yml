name: dev72 tournament selection audit batch10

on:
  workflow_dispatch:
  push:
    branches: [ dev72-audit-batch10 ]
    paths:
      - 'tools/apply_dev72_audit_batch10.py'
      - '.github/workflows/dev72-audit-batch10.yml'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-audit-batch10
          fetch-depth: 0
      - name: Apply tournament/source repairs
        run: python3 tools/apply_dev72_audit_batch10.py
      - name: Audit assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'if (leagueMatched.isEmpty()) return null' app/src/main/java/com/riftlab/app/data/ComprehensiveDataCenter.kt
          grep -q 'dated.maxByOrNull { it.startDate }' app/src/main/java/com/riftlab/app/data/ComprehensiveDataCenter.kt
          grep -q 'filter { ref -> containsDate(ref, date) }' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          grep -q '当前可信数据源尚未提供淘汰赛 / Bracket 数据' app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          grep -q '当前可信 Provider 未提供 Standings / Bracket，保持未知' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt \
                  app/src/main/java/com/riftlab/app/data/QualificationCenter.kt \
                  app/src/main/java/com/riftlab/app/data/MatchDetailRepository.kt \
                  app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt \
                  app/src/main/java/com/riftlab/app/data/ComprehensiveDataCenter.kt \
                  app/src/main/java/com/riftlab/app/data/StandingsCenterStore.kt \
                  app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: fix tournament binding and provider empty states"
          git push origin HEAD:dev72-audit-batch10
