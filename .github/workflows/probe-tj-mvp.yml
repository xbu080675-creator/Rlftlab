name: Probe TJStats MVP

on:
  push:
    paths:
      - 'tools/probe_tj_mvp.py'
      - '.github/workflows/probe-tj-mvp.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Swagger and known completed LPL match
        run: python3 tools/probe_tj_mvp.py
