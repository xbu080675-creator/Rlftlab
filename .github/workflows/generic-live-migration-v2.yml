name: Generic Live Migration V2

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/generic_live_migration.py
      - run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: generalize live engine for all LPL matches"
          git push origin HEAD:main
