name: Generic Live Architecture Migration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'ci: apply generic live architecture migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply generic live architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # 1) MatchSessionStore: remove all match-specific roster/slug fallbacks and publish target globally.
          p = root / 'app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt'
          s = p.read_text(encoding='utf-8')

          marker = '    // Match-specific fallback is intentionally limited to lineups separately verified before the match.\n'
          start = s.find(marker)
          end = s.find('    private val emptyPreMatch', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]

          s = s.replace(
              '        _targetMatch.value = match\n        _scheduleCenter.value = _scheduleCenter.value.copy(selectedMatch = match)',
              '        _targetMatch.value = match\n        LiveMatchTargetRegistry.update(match)\n        _scheduleCenter.value = _scheduleCenter.value.copy(selectedMatch = match)'
          )
          s = s.replace(
              '            _targetMatch.value = selected\n            _scheduleStatus.value = center.statusMessage',
              '            _targetMatch.value = selected\n            LiveMatchTargetRegistry.update(selected)\n            _scheduleStatus.value = center.statusMessage'
          )
          s = s.replace(
              '        _targetMatch.value = liveMatch\n        _scheduleStatus.value = _scheduleCenter.value.statusMessage',
              '        _targetMatch.value = liveMatch\n        LiveMatchTargetRegistry.update(liveMatch)\n        _scheduleStatus.value = _scheduleCenter.value.statusMessage'
          )

          s = s.replace(
              '        if (status.eventId.isBlank()) return\n        if (status.phase != LiveSourcePhase.LIVE && status.phase != LiveSourcePhase.BETWEEN_GAMES) return\n\n        val center = _scheduleCenter.value\n        val liveMatch = center.matches.firstOrNull {\n            it.eventId == status.eventId || it.matchId == status.eventId\n        } ?: return',
              '        val resolvedEventId = status.eventId.ifBlank { LiveMatchTargetRegistry.snapshot()?.eventId.orEmpty() }\n        if (resolvedEventId.isBlank()) return\n        if (status.phase != LiveSourcePhase.LIVE && status.phase != LiveSourcePhase.BETWEEN_GAMES) return\n\n        val center = _scheduleCenter.value\n        val liveMatch = center.matches.firstOrNull {\n            it.eventId == resolvedEventId || it.matchId == resolvedEventId\n        } ?: return'
          )

          s = s.replace(
              '        val leftFallback = fallbackRoster(left.code)\n        val rightFallback = fallbackRoster(right.code)\n        val leftRoster = leftUniqueFive ?: leftFallback\n        val rightRoster = rightUniqueFive ?: rightFallback',
              '        val leftRoster = leftUniqueFive ?: emptyList()\n        val rightRoster = rightUniqueFive ?: emptyList()'
          )
          s = s.replace(
              '                    "两队 Riot team roster 已连接；存在替补或位置歧义时不会冒充本场首发。只有单独核实过的阵容才允许走缓存。"',
              '                    "两队 Riot team roster 已连接；存在替补或位置歧义时保持空缺，不使用任何场次专属缓存。"'
          )
          s = s.replace(
              '                    "一侧 Riot roster 已连接；另一侧若没有单独核实的首发则保持空缺，不伪造。Rank 暂未接入。"',
              '                    "一侧 Riot roster 已连接；另一侧保持空缺，不使用战队或场次硬编码。Rank 暂未接入。"'
          )

          slug_block = '''        val verified = when (team.code.uppercase()) {
            "LGD" -> "lgd-gaming"
            "IG" -> "invictus-gaming"
            else -> null
        }
        if (verified != null) return verified

'''
          s = s.replace(slug_block, '')
          s = re.sub(
              r'\n    private fun fallbackRoster\(code: String\): List<PlayerCard> = when \(code\.uppercase\(\)\) \{.*?\n    \}\n',
              '\n', s, flags=re.S
          )
          s = s.replace('source = "LPL Official · current-game only"', 'source = "Live Provider Router"')
          p.write_text(s, encoding='utf-8')

          # 2) Riot data source: use the same generic target registry instead of a private one.
          p = root / 'app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt'
          s = p.read_text(encoding='utf-8')
          start = s.find('/**\n * Keeps the schedule-selected live-watch target inside the data layer.')
          end = s.find('internal class LolEsportsScheduleDataSource', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          s = s.replace('LiveScheduleTargetRegistry', 'LiveMatchTargetRegistry')
          p.write_text(s, encoding='utf-8')

          # 3) LPL provider: resolve whatever match the schedule selected; no bmid/team hardcoding.
          p = root / 'app/src/main/java/com/riftlab/app/data/LplCurrentGameLiveDataSource.kt'
          s = p.read_text(encoding='utf-8')
          s = s.replace('ref = fetchCurrentMatch()', 'ref = fetchCurrentMatch(matchId)')

          old_start = s.find('    private suspend fun fetchCurrentMatch(): MatchRef? {')
          old_end = s.find('    private fun parseRef(chunk: String): MatchRef?', old_start)
          if old_start < 0 or old_end < 0:
              raise RuntimeError('fetchCurrentMatch block not found')

          replacement = '''    private suspend fun fetchCurrentMatch(requestedMatchId: String): MatchRef? {
        val text = getText(LIVE_FEED, auth = false)
        val candidates = Regex("bMatchId", RegexOption.IGNORE_CASE).findAll(text).mapNotNull { hit ->
            val start = (hit.range.first - 2400).coerceAtLeast(0)
            val end = (hit.range.first + 3600).coerceAtMost(text.length)
            parseRef(text.substring(start, end))
        }.distinctBy { it.bmid }.toList()
        if (candidates.isEmpty()) return null

        // Some callers may already know a Tencent bMatchId. Prefer an exact match when present.
        requestedMatchId.trim().takeIf { it.isNotBlank() }?.let { requested ->
            candidates.firstOrNull { it.bmid == requested }?.let { return it }
        }

        // Normal path: map Riot schedule metadata to the Tencent/LPL live feed by both teams.
        // This works for every series and avoids any team-name or match-id special case.
        val target = LiveMatchTargetRegistry.snapshot()
        if (target != null && target.teams.size >= 2) {
            val ranked = candidates
                .map { it to matchScore(it, target) }
                .sortedByDescending { it.second }
            val best = ranked.firstOrNull()
            if (best != null && best.second > 0) return best.first
        }

        // A single active candidate is unambiguous. If the upstream ever exposes several
        // concurrent LPL series and none matches our schedule target, refuse to guess.
        return candidates.singleOrNull()
    }

    private fun matchScore(ref: MatchRef, target: ScheduledEsportsMatch): Int {
        val left = target.teams.getOrNull(0) ?: return 0
        val right = target.teams.getOrNull(1) ?: return 0
        val directA = teamMatches(ref.teamAName, left)
        val directB = teamMatches(ref.teamBName, right)
        val swapA = teamMatches(ref.teamAName, right)
        val swapB = teamMatches(ref.teamBName, left)

        return when {
            directA && directB -> 100
            swapA && swapB -> 95
            directA || directB -> 30
            swapA || swapB -> 25
            else -> 0
        }
    }

    private fun teamMatches(upstreamName: String, team: EsportsTeamRef): Boolean {
        val upstream = teamKey(upstreamName)
        if (upstream.isBlank()) return false
        val candidates = listOf(team.code, team.name, team.slug)
            .map(::teamKey)
            .filter { it.isNotBlank() }
        return candidates.any { token ->
            upstream == token ||
                (token.length >= 4 && upstream.contains(token)) ||
                (upstream.length >= 4 && token.contains(upstream))
        }
    }

    private fun teamKey(value: String): String =
        value.uppercase().replace(Regex("[^A-Z0-9]+"), "")

'''
          s = s[:old_start] + replacement + s[old_end:]
          p.write_text(s, encoding='utf-8')

          # 4) Version bump: this is the first generic live-engine build, not another match patch.
          p = root / 'app/build.gradle.kts'
          s = p.read_text(encoding='utf-8')
          s = s.replace('versionCode = 6', 'versionCode = 7')
          s = s.replace('versionName = "1.0.0-dev.6"', 'versionName = "1.0.0-dev.7"')
          p.write_text(s, encoding='utf-8')

          # 5) Remove one-off match probes from normal CI. Diagnostics belong outside the runtime path.
          for name in [
              'live-event-probe.yml',
              'lpl-source-probe.yml',
              'qq-legacy-live-probe.yml',
              'tjstats-swagger-probe.yml',
              'generic-live-migration.yml',
          ]:
              f = root / '.github/workflows' / name
              if f.exists():
                  f.unlink()

      - name: Commit migration
        run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: generalize live engine for all LPL matches"
          git push origin HEAD:main
