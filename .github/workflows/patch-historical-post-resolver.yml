name: Patch historical post resolver

on:
  push:
    paths:
      - 'tools/patch_historical_post_resolver.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply historical post resolver patch
        run: python3 tools/patch_historical_post_resolver.py
      - name: Commit patch
        run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: resolve completed LPL matches from historical BMatch lists"
            git push
          fi
