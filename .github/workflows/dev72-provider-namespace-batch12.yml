name: dev72 provider namespace safety batch12

on:
  workflow_dispatch:
  push:
    branches: [ dev72-provider-namespace-batch12 ]
    paths:
      - 'tools/apply_dev72_provider_namespace_batch12.py'
      - '.github/workflows/dev72-provider-namespace-batch12.yml'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-provider-namespace-batch12
          fetch-depth: 0
      - name: Apply provider namespace repairs
        run: python3 tools/apply_dev72_provider_namespace_batch12.py
      - name: Audit namespace contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt
          grep -q 'externalProviderTarget = isExternalProviderTarget(target)' "$FILE"
          grep -q 'Provider team id 不会冒充 Riot team id' "$FILE"
          grep -q 'ROSTER · PROVIDER TEAM NAMESPACE · CROSSWALK PENDING' "$FILE"
          grep -q 'listOf(candidate.slug, candidate.code, candidate.name)' "$FILE"
          grep -q 'if (team.slug.isNotBlank()) return team.slug' "$FILE"
          grep -q 'recent = "Verified team source"' "$FILE"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Commit verified namespace repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: isolate external provider team namespace"
          git push origin HEAD:dev72-provider-namespace-batch12
