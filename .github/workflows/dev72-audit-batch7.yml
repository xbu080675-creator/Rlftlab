name: dev72 source-truth audit batch7

on:
  workflow_dispatch:
  push:
    branches: [ dev72-audit-batch7 ]
    paths:
      - 'tools/apply_dev72_audit_batch7.py'
      - 'tools/run_dev72_audit_batch7.py'
      - '.github/workflows/dev72-audit-batch7.yml'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-audit-batch7
          fetch-depth: 0
      - name: Apply source-truth repairs
        run: python3 tools/run_dev72_audit_batch7.py
      - name: Source-truth assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'WSCI("WSCI")' app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          grep -q 'identity.contains("wsci") -> "WSCI"' app/src/main/java/com/riftlab/app/data/ComprehensiveData.kt
          grep -q 'RFT.gg public event mirror' app/src/main/java/com/riftlab/app/data/ComprehensiveData.kt
          grep -q '当前赛事使用非 Riot Event ID' app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt
          grep -q 'INTERNATIONAL_PARTICIPATION_FAMILIES' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'Provider mirror 档案已载入' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          if grep -Fq 'wsc[il]' app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt; then
            echo 'WSCI is still collapsed into WSCL in ScheduleCenterUi'
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_dev72_audit_batch7.py \
                  app/src/main/java/com/riftlab/app/data/ComprehensiveData.kt \
                  app/src/main/java/com/riftlab/app/data/TournamentResearch.kt \
                  app/src/main/java/com/riftlab/app/data/TournamentGovernance.kt \
                  app/src/main/java/com/riftlab/app/data/StandingsCenterStore.kt \
                  app/src/main/java/com/riftlab/app/data/QualificationCenter.kt \
                  app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt \
                  app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt \
                  app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt \
                  app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: fix WSCI identity and mixed-source provenance"
          git push origin HEAD:dev72-audit-batch7
