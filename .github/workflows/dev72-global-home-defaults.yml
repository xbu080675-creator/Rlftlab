name: dev72 global homepage defaults

on:
  push:
    branches:
      - dev72-global-home-defaults
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global homepage defaults
        run: python3 tools/apply_dev72_global_home_defaults.py

      - name: Audit global defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LeagueSubscriptionOption("GLOBAL", "全球赛事")' app/src/main/java/com/riftlab/app/ui/LeagueSubscriptionUi.kt
          grep -q 'MutableStateFlow(setOf("GLOBAL"))' app/src/main/java/com/riftlab/app/ui/LeagueSubscriptionUi.kt
          grep -q 'stored.ifEmpty { setOf("GLOBAL") }' app/src/main/java/com/riftlab/app/ui/LeagueSubscriptionUi.kt
          grep -q 'subscribedLeagueKeys: Set<String> = setOf("GLOBAL")' app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt
          grep -q 'if ("GLOBAL" in subscribedLeagueKeys) return true' app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Clean compile Android
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Commit verified global homepage defaults
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riftlab/app/ui/LeagueSubscriptionUi.kt \
                  app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'dev72: make global schedule the default homepage scope'
          git push
