name: dev77 readability pass

on:
  push:
    branches: [ dev77-readability-pass ]

permissions:
  contents: write

jobs:
  patch-build-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev77-readability-pass
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Apply readability pass
        run: python3 tools/dev77_readability_pass.py

      - name: Verify typography contracts
        shell: bash
        run: |
          set -euo pipefail
          THEME="app/src/main/java/com/riftlab/app/ui/RiftTheme.kt"
          VISUAL="app/src/main/java/com/riftlab/app/ui/RiftVisualSystem.kt"
          UI="app/src/main/java/com/riftlab/app/ui"

          grep -q 'typography = RiftTypography' "$THEME"
          ! grep -q 'RIFT_MIN_FONT_SCALE' "$THEME"
          ! grep -q 'LocalDensity provides' "$THEME"
          grep -q 'fontSize = 13.sp' "$VISUAL"
          grep -q 'fontSize = 11.sp' "$VISUAL"

          ! grep -R -E 'fontSize = (8|9|10)\.sp' "$UI" --include='*.kt'
          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-dev.77"' app/build.gradle.kts
          grep -q 'dev.77' DEV_CURRENT_CHANGELOG.txt
          git diff --check

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Clean Android build
        run: gradle clean :app:assembleDebug

      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"

      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev77-readability-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit verified readability pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-readability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add DEV_CURRENT_CHANGELOG.txt app/build.gradle.kts app/src/main/java/com/riftlab/app/ui
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(dev77): finish app-wide readability hierarchy"
          git push origin HEAD:dev77-readability-pass
