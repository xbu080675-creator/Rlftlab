name: dev72 data sync batch2

on:
  workflow_dispatch:
  push:
    branches: [ dev72-data-sync-batch2 ]
    paths:
      - 'tools/apply_dev72_data_sync_batch2.py'
      - '.github/workflows/dev72-data-sync-batch2.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-data-sync-batch2
          fetch-depth: 0
      - name: Apply tournament and qualification repairs
        run: python3 tools/apply_dev72_data_sync_batch2.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt \
                  app/src/main/java/com/riftlab/app/data/OfficialHandbookGovernance2026.kt \
                  app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt \
                  app/src/main/java/com/riftlab/app/data/QualificationCenter.kt \
                  app/src/main/java/com/riftlab/app/data/TournamentResearch.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: restore tournament directory and official qualification state"
          git push origin HEAD:dev72-data-sync-batch2
