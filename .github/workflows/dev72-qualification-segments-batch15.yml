name: dev72 qualification segments batch15

on:
  push:
    branches:
      - dev72-qualification-segments-batch15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply qualification segment split
        run: python3 tools/apply_dev72_qualification_segments_batch15.py

      - name: Audit segment contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enum class QualificationSegmentType' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'QualificationSegmentType.DIRECT_QUALIFICATION' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'QualificationSegmentType.CHAMPIONSHIP_POINTS' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'QualificationSegmentType.REGIONAL_QUALIFIER' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'MECHANISM SEGMENTS / 资格机制拆分' app/src/main/java/com/riftlab/app/ui/QualificationPathUi.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Compile Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit verified qualification segments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riftlab/app/data/QualificationCenter.kt \
                  app/src/main/java/com/riftlab/app/ui/QualificationPathUi.kt
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'dev72: split qualification mechanisms into explicit segments'
          git push
