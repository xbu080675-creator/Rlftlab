name: dev72 stable timeline identity batch18

on:
  push:
    branches:
      - dev72-stable-timeline-identity-batch18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stable timeline identity
        run: python3 tools/apply_dev72_stable_timeline_identity_batch18.py

      - name: Audit timeline identity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'return "schedule:$targetKey:G${snapshot.game}"' app/src/main/java/com/riftlab/app/data/MatchTimelineStore.kt
          grep -q 'val existing = find(snapshot) ?: return' app/src/main/java/com/riftlab/app/data/MatchTimelineStore.kt
          grep -q 'val switchedTarget' app/src/main/java/com/riftlab/app/data/MatchTimelineCapture.kt
          if grep -n 'previous.gameId.isNotBlank() && snapshot.gameId.isNotBlank() && previous.gameId != snapshot.gameId' app/src/main/java/com/riftlab/app/data/MatchTimelineCapture.kt; then
            echo 'Provider-local gameId still closes the timeline' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Compile Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit verified timeline identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riftlab/app/data/MatchTimelineStore.kt \
                  app/src/main/java/com/riftlab/app/data/MatchTimelineCapture.kt
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'dev72: keep one timeline across live provider failover'
          git push
