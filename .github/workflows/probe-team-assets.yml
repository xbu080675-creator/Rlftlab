name: Probe Team Assets
on:
  push:
    paths:
      - '.github/workflows/probe-team-assets.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Riot getSchedule/getTeams and OP.GG
        shell: python
        run: |
          import json, re, urllib.request, urllib.parse, sys
          from pathlib import Path
          sys.stdout = open('team-assets-probe.txt', 'w', buffering=1)

          src = Path('app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt').read_text()
          key = re.search(r'API_KEY = "([^"]+)"', src).group(1)
          league = re.search(r'LPL_LEAGUE_ID = "([^"]+)"', src).group(1)

          def get_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          headers={'x-api-key': key, 'Accept':'application/json', 'User-Agent':'RiftLab-asset-probe'}
          schedule = get_json(f'https://esports-api.lolesports.com/persisted/gw/getSchedule?hl=en-US&leagueId={league}', headers)
          events = schedule.get('data',{}).get('schedule',{}).get('events',[])
          seen = {}
          for e in events:
              if e.get('type') != 'match': continue
              for t in e.get('match',{}).get('teams',[]):
                  code=t.get('code') or t.get('name') or '?'
                  seen.setdefault(code, t)
          print('RIOT_SCHEDULE_TEAMS')
          for code,t in list(seen.items())[:20]:
              print(code, 'id=',t.get('id'), 'schedule.image=',repr(t.get('image')), 'slug=',t.get('slug'))

          print('RIOT_GETTEAMS')
          for code in ['BLG','AL','IG','LGD','NIP','JDG','TES','WE']:
              t=seen.get(code)
              if not t: continue
              tid=str(t.get('id') or '')
              url='https://esports-api.lolesports.com/persisted/gw/getTeams?hl=en-US&id='+urllib.parse.quote(tid)
              root=get_json(url, headers)
              arr=root.get('data',{}).get('teams',[])
              obj=arr[0] if arr else {}
              image=obj.get('image') or obj.get('imageUrl') or obj.get('imageUrlDarkMode') or obj.get('imageUrlLightMode')
              status='NONE'; ctype=''
              if image:
                  try:
                      req=urllib.request.Request(image,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          status=str(r.status); ctype=r.headers.get('content-type','')
                  except Exception as ex: status='ERR:'+type(ex).__name__
              print(code, 'count=',len(arr), 'image=',repr(image), 'http=',status, ctype)

          query='''query ListPagedAllMatches($status: String!, $leagueId: ID, $teamId: ID, $page: Int, $year: Int, $month: Int, $limit: Int) { pagedAllMatches(status: $status, leagueId: $leagueId, teamId: $teamId, page: $page, year: $year, month: $month, limit: $limit) { id homeTeam { name acronym imageUrl imageUrlDarkMode imageUrlLightMode } awayTeam { name acronym imageUrl imageUrlDarkMode imageUrlLightMode } } }'''
          payload=json.dumps({'operationName':'ListPagedAllMatches','query':query,'variables':{'status':'finished','leagueId':None,'teamId':None,'page':0,'year':2026,'month':9,'limit':500}}).encode()
          req=urllib.request.Request('https://esports.op.gg/matches/graphql',data=payload,headers={'Content-Type':'application/json','Accept':'application/json','Origin':'https://esports.op.gg','Referer':'https://esports.op.gg/','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=25) as r: opgg=json.load(r)
          rows=opgg.get('data',{}).get('pagedAllMatches',[])
          print('OPGG_TEAMS')
          printed=set()
          for row in rows:
              for obj in [row.get('homeTeam') or {}, row.get('awayTeam') or {}]:
                  code=obj.get('acronym') or ''
                  if code not in {'BLG','AL','IG','LGD','NIP','JDG','TES','WE'} or code in printed: continue
                  printed.add(code)
                  image=obj.get('imageUrlDarkMode') or obj.get('imageUrl') or obj.get('imageUrlLightMode')
                  status='NONE'; ctype=''
                  if image:
                      try:
                          ireq=urllib.request.Request(image,headers={'User-Agent':'Mozilla/5.0'})
                          with urllib.request.urlopen(ireq,timeout=20) as ir:
                              status=str(ir.status); ctype=ir.headers.get('content-type','')
                      except Exception as ex: status='ERR:'+type(ex).__name__
                  print(code, 'image=',repr(image), 'http=',status, ctype)
          sys.stdout.close()
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: team-assets-probe
          path: team-assets-probe.txt
