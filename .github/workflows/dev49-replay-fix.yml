name: Apply RiftLab dev.49 replay fixes

on:
  push:
    paths:
      - '.github/workflows/dev49-replay-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dev.49
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Match detail header: compact cards can keep team codes, but detail must reveal the full official team name.
          path = 'app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt'
          replace(path,
              'title = selectedDetailMatch?.let(::matchLabel)',
              'title = selectedDetailMatch?.let(::matchFullLabel)')
          replace(path,
              'private fun matchLabel(match: ScheduledEsportsMatch): String =\n    match.teams.take(2).joinToString(" vs ") { teamCode(it) }',
              'private fun matchFullLabel(match: ScheduledEsportsMatch): String =\n    match.teams.take(2).joinToString(" vs ") { team -> team.name.ifBlank { teamCode(team) } }\n\nprivate fun matchLabel(match: ScheduledEsportsMatch): String =\n    match.teams.take(2).joinToString(" vs ") { teamCode(it) }')

          # 2) Global completed series must show Riot schedule score even when there is no LPL terminal-series object.
          path = 'app/src/main/java/com/riftlab/app/ui/MatchDetailUi.kt'
          replace(path,
              'item { MatchHeroPanel(match, series?.scoreA, series?.scoreB, phase) }',
              'item {\n            MatchHeroPanel(\n                match = match,\n                scoreA = series?.scoreA ?: left?.gameWins?.takeIf { phase == ScheduleMatchPhase.COMPLETED },\n                scoreB = series?.scoreB ?: right?.gameWins?.takeIf { phase == ScheduleMatchPhase.COMPLETED },\n                phase = phase\n            )\n        }')

          # 3) Never touch Bilibili from an overseas/global match timeline.
          path = 'app/src/main/java/com/riftlab/app/ui/MatchTimelineContent.kt'
          replace(path,
              '    val match = state.match\n    val vodKey = match?.let(BilibiliVodRepository::keyFor).orEmpty()\n\n    LaunchedEffect(vodKey) {\n        if (match != null && vodKey.isNotBlank()) BilibiliVodRepository.open(match)\n    }\n\n    val vod = vodState.vod.takeIf { vodState.matchKey == vodKey }',
              '    val match = state.match\n    val lplReplay = match?.let(::isLplReplayMatch) == true\n    val vodKey = if (lplReplay) match?.let(BilibiliVodRepository::keyFor).orEmpty() else ""\n\n    LaunchedEffect(vodKey, lplReplay) {\n        if (lplReplay && match != null && vodKey.isNotBlank()) BilibiliVodRepository.open(match)\n    }\n\n    val vod = vodState.vod.takeIf { lplReplay && vodState.matchKey == vodKey }')
          replace(path,
              '                    "实时阶段优先保存约 10 秒状态快照；历史比赛没有本机快照时，自动解析 B站英雄联盟赛事官方录像的分P与章节锚点补回时间轴。两种来源都会明确标记，不从终局比分伪造中间过程。",',
              '                    if (lplReplay) {\n                        "实时阶段优先保存约 10 秒状态快照；LPL 历史比赛没有本机快照时，可使用 B站英雄联盟赛事官方录像的分P与章节锚点补回时间轴。来源会明确标记，不从终局比分伪造中间过程。"\n                    } else {\n                        "实时阶段优先保存约 10 秒状态快照；海外赛区与国际赛事只使用 RiftLab 本机归档、Riot/官方可核实事件数据，不请求、不解析 Bilibili，也不从终局比分伪造中间过程。"\n                    },')
          text = Path(path).read_text()
          text = text.replace('if (vodState.matchKey == vodKey && vodState.loading)', 'if (lplReplay && vodState.matchKey == vodKey && vodState.loading)')
          text = text.replace('else if (vodState.matchKey == vodKey && !vodState.loading)', 'else if (lplReplay && vodState.matchKey == vodKey && !vodState.loading)')
          text = text.replace('vodState.matchKey == vodKey && vodState.loading ->', 'lplReplay && vodState.matchKey == vodKey && vodState.loading ->')
          Path(path).write_text(text)

          # 4) Riot VOD provider names are not guaranteed to be exactly "youtube". Detect provider variants robustly.
          path = 'app/src/main/java/com/riftlab/app/data/RiotVodRepository.kt'
          replace(path,
              '        get() = provider.equals("youtube", ignoreCase = true) ||\n            parameter.contains("youtube.com", ignoreCase = true) ||\n            parameter.contains("youtu.be", ignoreCase = true)',
              '        get() = provider.contains("youtube", ignoreCase = true) ||\n            provider.equals("yt", ignoreCase = true) ||\n            parameter.contains("youtube.com", ignoreCase = true) ||\n            parameter.contains("youtube-nocookie.com", ignoreCase = true) ||\n            parameter.contains("youtu.be", ignoreCase = true)')
          replace(path,
              '            ?.let { "https://www.youtube.com/embed/$it?playsinline=1&rel=0" }',
              '            ?.let { "https://www.youtube.com/embed/$it?playsinline=1&rel=0&enablejsapi=1&origin=https%3A%2F%2Flolesports.com" }')

          # 5) Improve embedded official player reliability and do not pretend a whole Riot webpage is a video player.
          path = 'app/src/main/java/com/riftlab/app/ui/GlobalReplayContent.kt'
          replace(path,
              '    val sourceUrl = when {\n        embed.isNotBlank() -> embed\n        !link?.sourceUrl.isNullOrBlank() -> link!!.sourceUrl\n        else -> RiotVodRepository.riotVodPage(match, game)\n    }\n    val youtubeEmbed = embed.isNotBlank()',
              '    val sourceUrl = embed\n    val youtubeEmbed = embed.isNotBlank()')
          replace(path,
              '        OfficialWebVideoPlayer(sourceUrl, youtubeEmbed)\n        if (link == null) {\n            Text(\n                "该局 EventDetails 暂无可嵌入参数，当前在 RiftLab 内加载 LoL Esports 官方 VOD 页面。",\n                color = RiftMuted, fontSize = 8.sp, lineHeight = 13.sp,\n                modifier = Modifier.padding(top = 5.dp, horizontal = 2.dp)\n            )\n        }',
              '        if (youtubeEmbed) {\n            OfficialWebVideoPlayer(sourceUrl, true)\n        } else {\n            val shape = CutCornerShape(topEnd = 8.dp, bottomStart = 8.dp)\n            Column(\n                Modifier.fillMaxWidth().aspectRatio(16f / 9f)\n                    .background(Color.Black, shape)\n                    .border(1.dp, RiftLine, shape)\n                    .padding(16.dp),\n                verticalArrangement = Arrangement.Center,\n                horizontalAlignment = Alignment.CenterHorizontally\n            ) {\n                Text("该局官方 VOD 暂无可嵌入视频源", color = RiftText, fontSize = 11.sp, fontWeight = FontWeight.Bold)\n                Text(\n                    "Riot EventDetails 当前没有返回可直接嵌入的 YouTube 参数。RiftLab 不再把整个 LoL Esports 网页伪装成播放器，也不会改用 Bilibili。",\n                    color = RiftMuted, fontSize = 8.sp, lineHeight = 13.sp, textAlign = TextAlign.Center,\n                    modifier = Modifier.padding(top = 6.dp)\n                )\n            }\n        }')
          replace(path,
              '            settings.mediaPlaybackRequiresUserGesture = true',
              '            settings.mediaPlaybackRequiresUserGesture = false')
          replace(path,
              '            settings.setSupportMultipleWindows(false)\n            webViewClient = WebViewClient()',
              '            settings.setSupportMultipleWindows(false)\n            settings.userAgentString = "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36"\n            webViewClient = WebViewClient()')
          replace(path,
              '            webView.loadDataWithBaseURL("https://www.youtube.com/", html, "text/html", "UTF-8", null)',
              '            webView.loadDataWithBaseURL("https://lolesports.com/", html, "text/html", "UTF-8", null)')

          # Bump DEV version.
          path = 'app/build.gradle.kts'
          replace(path, 'versionCode = 48', 'versionCode = 49')
          replace(path, 'versionName = "1.0.0-dev.48"', 'versionName = "1.0.0-dev.49"')
          p = Path(path)
          p.write_text(p.read_text() + '\n// dev.49: clarify academy team names, restore global series score, isolate overseas timeline from Bilibili, and harden in-app official YouTube VOD playback.\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt \
                  app/src/main/java/com/riftlab/app/ui/MatchDetailUi.kt \
                  app/src/main/java/com/riftlab/app/ui/MatchTimelineContent.kt \
                  app/src/main/java/com/riftlab/app/data/RiotVodRepository.kt \
                  app/src/main/java/com/riftlab/app/ui/GlobalReplayContent.kt \
                  app/build.gradle.kts
          git commit -m 'fix: repair global replay and academy labels dev49'
          git push
