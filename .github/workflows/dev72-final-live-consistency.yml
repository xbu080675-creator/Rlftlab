name: dev72 final global live consistency

on:
  push:
    branches:
      - dev72-final-live-consistency
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final global live consistency fixes
        run: python3 tools/apply_dev72_final_live_consistency.py

      - name: Audit global live invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'val targetKey: String = ""' app/src/main/java/com/riftlab/app/data/Models.kt
          grep -q 'val teamId: String = ""' app/src/main/java/com/riftlab/app/data/Models.kt
          grep -q 'targetKey = LiveMatchTargetRegistry.key' app/src/main/java/com/riftlab/app/data/LplOfficialLiveDataSource.kt
          grep -q 'previous.targetKey != snapshot.targetKey' app/src/main/java/com/riftlab/app/data/MatchTimelineCapture.kt
          grep -q '"CAPTURE START"' app/src/main/java/com/riftlab/app/data/MatchTimelineStore.kt
          grep -q 'snapshot.targetKey.trim()' app/src/main/java/com/riftlab/app/data/MatchTimelineStore.kt
          grep -q 'parsePlayers(blueMeta, blue, blueTeamId, "BLUE")' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          grep -q 'parsePlayers(redMeta, red, redTeamId, "RED")' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          grep -q 'return discovered$' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          ! grep -q 'discovered.ifEmpty' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          grep -q 'teamId = firstString(p, "teamId", "team_id", "esportsTeamId")' app/src/main/java/com/riftlab/app/data/CitoDataPlane.kt
          grep -q 'private fun playerTeamId(player: LivePlayerSnapshot): Int = player.teamId.toIntOrNull()' app/src/main/java/com/riftlab/app/data/LplCommRealtimeDataSource.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Clean compile Android
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Commit verified global live consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riftlab/app/data/Models.kt \
                  app/src/main/java/com/riftlab/app/data/LplOfficialLiveDataSource.kt \
                  app/src/main/java/com/riftlab/app/data/MatchTimelineCapture.kt \
                  app/src/main/java/com/riftlab/app/data/MatchTimelineStore.kt \
                  app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt \
                  app/src/main/java/com/riftlab/app/data/CitoDataPlane.kt \
                  app/src/main/java/com/riftlab/app/data/LplCommRealtimeDataSource.kt
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'dev72: unify global live timeline identity and player sides'
          git push
