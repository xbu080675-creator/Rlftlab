name: Apply dev44 Tachio API key settings
on:
  push:
    paths:
      - '.github/workflows/dev44-tachio-key-settings-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings entry and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt')
          s = p.read_text()

          s = s.replace(
              'import androidx.compose.material.icons.filled.SportsEsports\n',
              'import androidx.compose.material.icons.filled.SportsEsports\nimport androidx.compose.material.icons.filled.Settings\n',
              1
          )

          s = s.replace(
              '        var updateCenterOpen by remember { androidx.compose.runtime.mutableStateOf(false) }\n',
              '        var updateCenterOpen by remember { androidx.compose.runtime.mutableStateOf(false) }\n        var sourceSettingsOpen by remember { androidx.compose.runtime.mutableStateOf(false) }\n',
              1
          )

          old = '''                Header(onVersionClick = { updateCenterOpen = true })\n                if (updateCenterOpen) UpdateCenterDialog(onClose = { updateCenterOpen = false })\n'''
          new = '''                Header(\n                    onVersionClick = { updateCenterOpen = true },\n                    onSourceSettingsClick = { sourceSettingsOpen = true }\n                )\n                if (updateCenterOpen) UpdateCenterDialog(onClose = { updateCenterOpen = false })\n                if (sourceSettingsOpen) RealtimeSourceSettingsDialog(onClose = { sourceSettingsOpen = false })\n'''
          if old not in s:
              raise SystemExit('Header call pattern not found')
          s = s.replace(old, new, 1)

          old = '@Composable\nprivate fun Header(onVersionClick: () -> Unit) {'
          new = '@Composable\nprivate fun Header(onVersionClick: () -> Unit, onSourceSettingsClick: () -> Unit) {'
          if old not in s:
              raise SystemExit('Header signature pattern not found')
          s = s.replace(old, new, 1)

          marker = '''        Text(\n            BuildConfig.VERSION_NAME.replace("1.0.0-", "1.0 ").uppercase(),\n'''
          insert = '''        Box(\n            Modifier.size(34.dp).clickable(onClick = onSourceSettingsClick),\n            contentAlignment = Alignment.Center\n        ) {\n            Icon(\n                Icons.Default.Settings,\n                contentDescription = "实时数据源设置",\n                tint = RiftMuted,\n                modifier = Modifier.size(18.dp)\n            )\n        }\n        Spacer(Modifier.width(4.dp))\n'''
          if marker not in s:
              raise SystemExit('Version marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = '''        versionCode = 43\n        versionName = "1.0.0-dev.43"\n'''
          new = '''        versionCode = 44\n        versionName = "1.0.0-dev.44"\n'''
          if old not in s:
              raise SystemExit('version pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '// dev.43: event/game lifecycle state machine + 20s watchdog escalation; no endless parsing state.',
              '// dev.44: encrypted provider credentials + Tachio Sports API key settings entry.'
          )
          p.write_text(s)
          PY
      - name: Commit and push source changes
        run: |
          git config user.name 'riftlab-dev-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat: add Tachio API key settings entry'
          git push
