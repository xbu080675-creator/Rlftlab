name: dev72 WSCI structure inspector

on:
  workflow_dispatch:
  push:
    branches: [ dev72-integration-batch6 ]
    paths:
      - '.github/workflows/dev72-wsci-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-integration-batch6
          fetch-depth: 0
      - name: Inspect server-rendered WSCI data structure
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --connect-timeout 12 --max-time 30 -A 'RiftLab-DataSync/1.0' 'https://rft.gg/event/wsci-2026' -o /tmp/wsci.html
          curl -L --fail --connect-timeout 12 --max-time 30 -A 'RiftLab-DataSync/1.0' 'https://rft.gg/event/wsci-2026/matches' -o /tmp/wsci-matches.html
          python3 - <<'PY'
          from pathlib import Path
          import re, html, json

          overview = Path('/tmp/wsci.html').read_text(errors='replace')
          matches = Path('/tmp/wsci-matches.html').read_text(errors='replace')
          out = []
          out.append(f'overview_bytes={len(overview.encode())}')
          out.append(f'matches_bytes={len(matches.encode())}')

          def inspect_page(label, raw):
              out.append(f'\n===== {label} =====')
              out.append('ISO_TIMESTAMPS')
              iso = sorted(set(re.findall(r'20\d\d-[01]\d-[0-3]\d(?:T[0-2]\d:[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|[+-][0-2]\d:[0-5]\d)?)?', raw)))
              out.extend(iso[:200])

              out.append('MATCH_LINKS')
              links = []
              for href, body in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', raw, re.I | re.S):
                  if '/match/' not in href:
                      continue
                  plain = re.sub(r'<[^>]+>', ' ', html.unescape(body))
                  plain = re.sub(r'\s+', ' ', plain).strip()
                  links.append((href, plain))
                  out.append(f'{href} => {plain[:500]}')
              out.append(f'match_link_count={len(links)}')

              out.append('MATCH_CONTEXTS')
              seen = set()
              for href, _ in links[:20]:
                  if href in seen: continue
                  seen.add(href)
                  pos = raw.find(href)
                  if pos < 0: continue
                  snippet = html.unescape(raw[max(0, pos-1000):pos+6000])
                  snippet = re.sub(r'\s+', ' ', snippet)
                  out.append(f'--- {href} ---')
                  out.append(snippet[:7000])

              out.append('RSC_DATA_HINTS')
              for needle in ['startDate', 'startTime', 'scheduledAt', 'beginAt', 'date', 'matchDate', 'bestOf', 'bo3', 'bo5']:
                  hits = [m.start() for m in re.finditer(re.escape(needle), raw, re.I)]
                  out.append(f'{needle}: hits={len(hits)}')
                  for pos in hits[:5]:
                      snippet = html.unescape(raw[max(0,pos-300):pos+900])
                      out.append(re.sub(r'\s+', ' ', snippet)[:1200])

          inspect_page('OVERVIEW', overview)
          inspect_page('MATCHES', matches)
          Path('.ci/dev72-wsci-structure.txt').write_text('\n'.join(out)[:350000], encoding='utf-8')
          PY
      - name: Commit inspector result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/dev72-wsci-structure.txt
          git commit -m "dev72: capture WSCI match structure" || exit 0
          git push origin HEAD:dev72-integration-batch6
