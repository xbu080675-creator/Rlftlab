name: Apply RiftLab dev52 GCD labels

on:
  push:
    paths:
      - '.github/workflows/dev52-gcd-labels-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply GCD labels
        run: python3 tools/apply_dev52_gcd_labels.py
      - name: Commit labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/TeamDetailUi.kt app/src/main/java/com/riftlab/app/data/DynamicTeamDataProvider.kt
          git commit -m "fix: label Riot GCD global team personnel"
          git pull --rebase origin main
          git push origin HEAD:main
