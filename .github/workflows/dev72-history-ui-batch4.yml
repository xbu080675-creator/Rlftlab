name: dev72 history ui batch4

on:
  workflow_dispatch:
  push:
    branches: [ dev72-history-ui-batch4 ]
    paths:
      - 'tools/apply_dev72_history_ui.py'
      - '.github/workflows/dev72-history-ui-batch4.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-history-ui-batch4
          fetch-depth: 0
      - name: Apply history UI repairs
        run: python3 tools/apply_dev72_history_ui.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/TournamentEditionArchiveUi.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: expose full tournament history and improve archive readability"
          git push origin HEAD:dev72-history-ui-batch4
