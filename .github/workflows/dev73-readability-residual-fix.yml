name: dev73 residual readability fix

on:
  push:
    branches: [ dev72-postrelease-audit ]
    paths:
      - '.github/workflows/dev73-readability-residual-fix.yml'
      - 'tools/dev73_readability_residual_patch.py'

permissions:
  contents: write

jobs:
  patch-build-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-postrelease-audit
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Apply residual readability fix
        run: python3 tools/dev73_readability_residual_patch.py
      - name: Re-audit readability and global schedule contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'fontSize[[:space:]]*=[[:space:]]*(6|7|8|9)\.sp' app/src/main/java
          ! grep -R -n -E 'teamNameFontSize[[:space:]]*=[[:space:]]*(6|7|8|9)\.sp' app/src/main/java
          grep -q 'repeat(10)' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          grep -q 'GLOBAL_EXCLUDED_LEAGUE_SLUGS' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$DIGEST" = "769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
      - name: Commit verified readability fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): remove residual sub-10sp labels"
          git push origin HEAD:dev72-postrelease-audit
