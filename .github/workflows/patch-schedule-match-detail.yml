name: Patch schedule match detail navigation

on:
  push:
    paths:
      - 'tools/patch_schedule_match_detail.py'
      - '.github/workflows/patch-schedule-match-detail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply schedule detail patch
        run: python3 tools/patch_schedule_match_detail.py
      - name: Commit patch
        run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: open match detail from schedule"
            git push
          fi
