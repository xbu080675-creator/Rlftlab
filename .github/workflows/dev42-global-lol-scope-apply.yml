name: Apply dev42 global LoL esports scope
on:
  push:
    paths:
      - '.github/workflows/dev42-global-lol-scope-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch global league scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1))

          p = Path('app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt')
          s = p.read_text()

          s = s.replace(
              '    const val LPL_LEAGUE_ID = "98767991314006698"\n',
              '''    const val LPL_LEAGUE_ID = "98767991314006698"\n\n    // Tier-one regional + international competitions tracked by RiftLab. IDs are discovered\n    // dynamically from Riot getLeagues so league reshuffles do not require an APK update.\n    val GLOBAL_MAJOR_LEAGUE_SLUGS = setOf(\n        "worlds", "msi", "first-stand", "first_stand", "ewc",\n        "lpl", "lck", "lec", "lcs", "lcp",\n        "cblol", "cblol-brazil", "pcs", "vcs", "ljl", "lla", "lrn", "lrs"\n    )\n'''
          )

          start = s.index('    suspend fun fetchLplSchedule(): List<ScheduledEsportsMatch> {')
          end = s.index('    private fun schedulePageToken', start)
          replacement = '''    suspend fun fetchGlobalSchedule(): List<ScheduledEsportsMatch> {\n        val leagueIds = fetchTrackedLeagueIds()\n        val pages = mutableListOf<JSONObject>()\n        val visitedTokens = mutableSetOf<String>()\n\n        val center = fetchSchedulePage(null, leagueIds)\n        pages += center\n\n        var older = schedulePageToken(center, "older")\n        repeat(4) {\n            if (older.isBlank() || !visitedTokens.add("older:$older")) return@repeat\n            val page = fetchSchedulePage(older, leagueIds)\n            pages += page\n            older = schedulePageToken(page, "older")\n        }\n\n        var newer = schedulePageToken(center, "newer")\n        repeat(4) {\n            if (newer.isBlank() || !visitedTokens.add("newer:$newer")) return@repeat\n            val page = fetchSchedulePage(newer, leagueIds)\n            pages += page\n            newer = schedulePageToken(page, "newer")\n        }\n\n        return pages\n            .flatMap(::parseSchedulePage)\n            .distinctBy { it.eventId.ifBlank { it.matchId } }\n            .sortedWith(compareBy<ScheduledEsportsMatch> { parseInstant(it.startTimeIso) ?: Instant.MAX }\n                .thenBy { it.eventId })\n    }\n\n    // Compatibility alias for older call sites while the app migrates away from LPL-only naming.\n    suspend fun fetchLplSchedule(): List<ScheduledEsportsMatch> = fetchGlobalSchedule()\n\n    private suspend fun fetchTrackedLeagueIds(): List<String> {\n        return runCatching {\n            val root = getJson("${LolEsportsConfig.PERSISTED_BASE}/getLeagues?hl=en-US")\n            val leagues = root.optJSONObject("data")?.optJSONArray("leagues") ?: JSONArray()\n            buildList {\n                for (i in 0 until leagues.length()) {\n                    val league = leagues.optJSONObject(i) ?: continue\n                    val id = league.optString("id")\n                    val slug = league.optString("slug").lowercase()\n                    if (id.isNotBlank() && slug in LolEsportsConfig.GLOBAL_MAJOR_LEAGUE_SLUGS) add(id)\n                }\n            }.distinct()\n        }.getOrDefault(emptyList()).ifEmpty { listOf(LolEsportsConfig.LPL_LEAGUE_ID) }\n    }\n\n    private suspend fun fetchSchedulePage(pageToken: String?, leagueIds: List<String>): JSONObject {\n        val url = buildString {\n            append("${LolEsportsConfig.PERSISTED_BASE}/getSchedule?hl=en-US")\n            if (leagueIds.isNotEmpty()) {\n                append("&leagueId=")\n                append(URLEncoder.encode(leagueIds.joinToString(","), "UTF-8"))\n            }\n            if (!pageToken.isNullOrBlank()) {\n                append("&pageToken=").append(URLEncoder.encode(pageToken, "UTF-8"))\n            }\n        }\n        return getJson(url)\n    }\n\n'''
          s = s[:start] + replacement + s[end:]

          old_filter = '''                val league = event.optJSONObject("league")\n                val leagueId = league?.optString("id").orEmpty()\n                val leagueSlug = league?.optString("slug").orEmpty()\n                if (leagueId.isNotBlank() && leagueId != LolEsportsConfig.LPL_LEAGUE_ID && leagueSlug != "lpl") continue\n\n                val match = event.optJSONObject("match") ?: continue\n'''
          new_filter = '''                val league = event.optJSONObject("league")\n                val match = event.optJSONObject("match") ?: continue\n'''
          if old_filter not in s:
              raise SystemExit('missing LPL schedule filter')
          s = s.replace(old_filter, new_filter, 1)

          s = s.replace(
              '                        league = league?.optString("name", "LPL") ?: "LPL",',
              '                        league = league?.optString("name", "LoL Esports") ?: "LoL Esports",',
              1
          )

          s = s.replace('    suspend fun findLiveLplEvent(\n', '    suspend fun findLiveEvent(\n', 1)
          live_filter = '''                val league = event.optJSONObject("league")\n                val leagueId = league?.optString("id").orEmpty()\n                val leagueSlug = league?.optString("slug").orEmpty()\n                if (leagueId != LolEsportsConfig.LPL_LEAGUE_ID && leagueSlug != "lpl") continue\n\n                val match = event.optJSONObject("match") ?: continue\n'''
          if live_filter not in s:
              raise SystemExit('missing LPL live filter')
          s = s.replace(live_filter, '''                val match = event.optJSONObject("match") ?: continue\n''', 1)

          marker = '    suspend fun fetchLiveGame(event: LiveEventRef): LiveGameRef? {'
          idx = s.index(marker)
          alias = '''    suspend fun findLiveLplEvent(\n        preferredMatchId: String = "",\n        preferredTeamCodes: Set<String> = emptySet()\n    ): LiveEventRef? = findLiveEvent(preferredMatchId, preferredTeamCodes)\n\n'''
          s = s[:idx] + alias + s[idx:]
          p.write_text(s)

          ds = 'app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt'
          p = Path(ds); s = p.read_text()
          s = s.replace('client.fetchLplSchedule().map(::verifySeriesCompletion)', 'client.fetchGlobalSchedule().map(::verifySeriesCompletion)', 1)
          s = s.replace('message = "正在等待 LPL 实时比赛…"', 'message = "正在等待全球 LoL Esports 实时比赛…"', 1)
          s = s.replace('currentEvent = client.findLiveLplEvent(preferredMatchId = matchId)', 'currentEvent = client.findLiveEvent(preferredMatchId = matchId)', 1)
          s = s.replace('currentEvent = client.findLiveLplEvent(preferredMatchId = matchId) ?: event', 'currentEvent = client.findLiveEvent(preferredMatchId = matchId) ?: event', 1)
          p.write_text(s)

          router = 'app/src/main/java/com/riftlab/app/data/LplOfficialLiveDataSource.kt'
          p = Path(router); s = p.read_text()
          s = s.replace('internal class LplOfficialLiveDataSource : LiveMatchDataSource {', 'internal class GlobalOfficialLiveDataSource : LiveMatchDataSource {', 1)
          s = s.replace(
              '''    private data class Provider(\n        val name: String,\n        val priority: Int,\n        val source: LiveMatchDataSource,\n        val status: StateFlow<LiveSourceStatus>\n    )\n''',
              '''    private data class Provider(\n        val name: String,\n        val priority: Int,\n        val source: LiveMatchDataSource,\n        val status: StateFlow<LiveSourceStatus>,\n        val lplOnly: Boolean = false\n    )\n''',
              1
          )
          s = s.replace(
              '''        Provider("LPL Comm Realtime", 0, commRealtime, commRealtime.status),\n        Provider("Riot LiveStats", 10, riotLiveStats, riotLiveStats.status),\n        Provider("LPL MatchDetail", 30, lplMatchDetail, lplMatchDetail.status)\n''',
              '''        Provider("LPL Comm Realtime", 0, commRealtime, commRealtime.status, lplOnly = true),\n        Provider("Riot LiveStats", 10, riotLiveStats, riotLiveStats.status),\n        Provider("LPL MatchDetail", 30, lplMatchDetail, lplMatchDetail.status, lplOnly = true)\n''',
              1
          )
          s = s.replace(
              '''                            .filter { candidate ->\n                                val status = providerStatuses[candidate.name]\n''',
              '''                            .filter { candidate ->\n                                if (candidate.lplOnly && !currentTargetIsLpl()) return@filter false\n                                val status = providerStatuses[candidate.name]\n''',
              1
          )
          s = s.replace(
              '''        val live = providers.firstOrNull { provider ->\n            val s = providerStatuses[provider.name]\n''',
              '''        val live = providers.firstOrNull { provider ->\n            if (provider.lplOnly && !currentTargetIsLpl()) return@firstOrNull false\n            val s = providerStatuses[provider.name]\n''',
              1
          )
          s = s.replace(
              '''            val provider = providers.firstOrNull { providerStatuses[it.name]?.phase == phase } ?: continue\n''',
              '''            val provider = providers.firstOrNull { candidate ->\n                (!candidate.lplOnly || currentTargetIsLpl()) && providerStatuses[candidate.name]?.phase == phase\n            } ?: continue\n''',
              1
          )
          insert = '''\n    private fun currentTargetIsLpl(): Boolean {\n        val target = LiveMatchTargetRegistry.snapshot() ?: return false\n        val league = target.league.lowercase()\n        return league == "lpl" || league.contains("league of legends pro league")\n    }\n'''
          s = s.replace('\n    companion object {\n', insert + '\n    companion object {\n', 1)
          p.write_text(s)

          store = 'app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt'
          p = Path(store); s = p.read_text()
          s = s.replace('        league = "LPL",', '        league = "LoL Esports",', 1)
          s = s.replace('        rosterNote = "正在同步 Riot LPL 赛程；不会用 Mock 首发或 Rank 填空。"', '        rosterNote = "正在同步 Riot 全球 LoL Esports 赛程；不会用 Mock 首发或 Rank 填空。"', 1)
          s = s.replace('    private val liveDataSource = LplOfficialLiveDataSource()', '    private val liveDataSource = GlobalOfficialLiveDataSource()', 1)
          s = s.replace('        emptyLiveSnapshot("LPL Official · 等待当前正在进行的小局")', '        emptyLiveSnapshot("LoL Esports · 等待当前正在进行的小局")', 1)
          s = s.replace('        _scheduleStatus.value = "正在同步 Riot LPL 分页赛程…"', '        _scheduleStatus.value = "正在同步 Riot 全球赛事分页赛程…"', 1)
          s = s.replace('            // recent completed LPL series from the schedule, so opening RiftLab after the match', '            // recent completed series from the schedule. LPL currently has an additional TJStats final resolver;', 1)
          old = '''            if (latestCompleted != null) {\n                scope.launch {\n                    runCatching { postMatchResolver.refresh(latestCompleted) }\n                }\n            }\n'''
          new = '''            if (latestCompleted != null && latestCompleted.league.contains("LPL", ignoreCase = true)) {\n                scope.launch {\n                    runCatching { postMatchResolver.refresh(latestCompleted) }\n                }\n            }\n'''
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('            league = target.league.ifBlank { "LPL" },', '            league = target.league.ifBlank { "LoL Esports" },', 1)
          s = s.replace('            stage = target.blockName.ifBlank { "LPL" }.uppercase(),', '            stage = target.blockName.ifBlank { target.league.ifBlank { "LoL Esports" } }.uppercase(),', 1)
          p.write_text(s)

          gradle = 'app/build.gradle.kts'
          p = Path(gradle); s = p.read_text()
          s = s.replace('versionCode = 41\n        versionName = "1.0.0-dev.41"', 'versionCode = 42\n        versionName = "1.0.0-dev.42"', 1)
          s = s.replace('// dev.41: OP.GG gameByMatch GOLD/XP frame fallback after Riot LiveStats history miss.', '// dev.42: global Riot league scope (Worlds/MSI/major regions) + league-aware live provider routing.')
          p.write_text(s)
          PY
      - name: Commit and push source changes
        run: |
          git config user.name 'riftlab-dev-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat: expand RiftLab from LPL to global LoL esports coverage'
          git push
