name: Compile Diagnostics
on:
  push:
    paths:
      - '.github/workflows/compile-diagnostics.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and capture log
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee compile.log
          code=${PIPESTATUS[0]}
          echo "$code" > compile.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: compile-diagnostics
          path: |
            compile.log
            compile.exit
