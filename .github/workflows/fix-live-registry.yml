name: Fix Live Registry Calls

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/fix_live_registry_calls.py
      - run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: use shared live target registry API"
          git push origin HEAD:main
