name: dev74 schedule index semantics

on:
  push:
    branches: [ dev74-schedule-center-anr-fix ]
    paths:
      - '.github/workflows/dev74-schedule-index-semantics.yml'
      - 'tools/dev74_schedule_index_semantics_fix.py'

permissions:
  contents: write

jobs:
  patch-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev74-schedule-center-anr-fix
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Preserve fallback semantics
        run: python3 tools/dev74_schedule_index_semantics_fix.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile app
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon
      - name: Commit verified semantics fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(dev74): preserve schedule league fallback semantics"
          git push origin HEAD:dev74-schedule-center-anr-fix
