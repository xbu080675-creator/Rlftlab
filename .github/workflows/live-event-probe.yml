name: Live Event Probe

on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe current LPL EventDetails
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, urllib.parse

          source = pathlib.Path('app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt').read_text()
          key = re.search(r'API_KEY = "([^"]+)"', source).group(1)
          base = re.search(r'PERSISTED_BASE = "([^"]+)"', source).group(1)
          live_base = re.search(r'LIVE_BASE = "([^"]+)"', source).group(1)
          event_id = '117155436343202190'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'x-api-key': key,
                  'Accept': 'application/json',
                  'User-Agent': 'RiftLab-Live-Probe/1.0',
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.load(r), r.status

          root, status = get(f'{base}/getEventDetails?hl=en-US&id={event_id}')
          print('eventDetails http=', status)
          event = root.get('data', {}).get('event', {}) or {}
          match = event.get('match', {}) or {}
          print('event state=', event.get('state'))
          print('match id=', match.get('id'))
          print('match state=', match.get('state'))
          print('match keys=', sorted(match.keys()))
          games = match.get('games', []) or []
          print('games count=', len(games))
          for g in games:
              print('GAME', json.dumps({
                  'id': g.get('id'),
                  'number': g.get('number'),
                  'state': g.get('state'),
                  'teams': g.get('teams'),
              }, ensure_ascii=False))

          for g in games:
              gid = str(g.get('id') or '')
              if not gid:
                  continue
              try:
                  w, ws = get(f'{live_base}/window/{gid}')
                  print('WINDOW', gid, 'http=', ws, 'frames=', len(w.get('frames', []) or []), 'keys=', sorted(w.keys()))
              except Exception as e:
                  print('WINDOW', gid, 'ERR', repr(e))
          PY
