name: Live Event Probe

on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe current LPL EventDetails
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, urllib.parse

          source = pathlib.Path('app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt').read_text()
          key = re.search(r'API_KEY = "([^"]+)"', source).group(1)
          base = re.search(r'PERSISTED_BASE = "([^"]+)"', source).group(1)
          live_base = re.search(r'LIVE_BASE = "([^"]+)"', source).group(1)
          event_id = '117155436343202190'
          schedule_start = '2026-09-08T09:00:00Z'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'x-api-key': key,
                  'Accept': 'application/json',
                  'User-Agent': 'RiftLab-Live-Probe/1.0',
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  body = r.read().decode('utf-8', 'replace')
                  return json.loads(body), r.status

          root, status = get(f'{base}/getEventDetails?hl=en-US&id={event_id}')
          print('eventDetails http=', status)
          event = root.get('data', {}).get('event', {}) or {}
          match = event.get('match', {}) or {}
          print('event state=', event.get('state'))
          print('match id=', match.get('id'))
          print('match state=', match.get('state'))
          games = match.get('games', []) or []
          print('games count=', len(games))
          for g in games:
              print('GAME', json.dumps({
                  'id': g.get('id'),
                  'number': g.get('number'),
                  'state': g.get('state'),
                  'teams': g.get('teams'),
              }, ensure_ascii=False))

          g1 = str((games[0] if games else {}).get('id') or '')
          if g1:
              for label, url in [
                  ('WINDOW_LATEST', f'{live_base}/window/{g1}'),
                  ('WINDOW_SCHEDULE_START', f'{live_base}/window/{g1}?startingTime=' + urllib.parse.quote(schedule_start, safe='')),
                  ('DETAILS', f'{live_base}/details/{g1}'),
              ]:
                  try:
                      payload, http = get(url)
                      frames = payload.get('frames', []) or []
                      print(label, 'http=', http, 'frames=', len(frames), 'keys=', sorted(payload.keys()))
                      if frames:
                          print(label, 'first keys=', sorted(frames[0].keys()))
                          print(label, 'first ts=', frames[0].get('rfc460Timestamp'))
                          print(label, 'last ts=', frames[-1].get('rfc460Timestamp'))
                          print(label, 'last sample=', json.dumps(frames[-1], ensure_ascii=False)[:1200])
                  except Exception as e:
                      print(label, 'ERR', repr(e))
          PY
