name: Apply RiftLab dev58 OTA fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dev57-research-compile-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply dev58 source changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt")
          s = p.read_text(encoding="utf-8")
          if "@Composable\nprivate fun researchEvidenceColor" not in s:
              s = s.replace(
                  "private fun researchEvidenceColor(value: ResearchEvidence) = when (value) {",
                  "@Composable\nprivate fun researchEvidenceColor(value: ResearchEvidence) = when (value) {",
                  1,
              )
          s = s.replace(
              'return Regex("(?:19|20)\\d{2}").find(bucket.title)?.value?.toIntOrNull()',
              'return Regex("""(?:19|20)\\d{2}""").find(bucket.title)?.value?.toIntOrNull()',
          )
          p.write_text(s, encoding="utf-8")

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'versionCode = \d+', 'versionCode = 58', s, count=1)
          s = re.sub(r'versionName = "[^"]+"', 'versionName = "1.0.0-dev.58"', s, count=1)
          close_block = (
              'if (!devSigningStore.exists() && devSigningB64.exists()) {\n'
              '    devSigningStore.parentFile.mkdirs()\n'
              '    devSigningStore.writeBytes(Base64.getDecoder().decode(devSigningB64.readText().trim()))\n'
              '}\n'
          )
          if "val otaCnManifestUrl =" not in s:
              ota_block = (
                  '\nval otaCnManifestUrl = providers.gradleProperty("RIFTLAB_OTA_CN_MANIFEST_URL")\n'
                  '    .orElse("")\n'
                  '    .get()\n'
                  '    .trim()\n'
                  'val otaCnManifestLiteral = otaCnManifestUrl\n'
                  '    .replace("\\\\", "\\\\\\\\")\n'
                  '    .replace("\\\"", "\\\\\\\"")\n'
              )
              s = s.replace(close_block, close_block + ota_block, 1)
          version_anchor = '        versionName = "1.0.0-dev.58"\n'
          if 'buildConfigField("String", "OTA_CN_MANIFEST_URL"' not in s:
              s = s.replace(
                  version_anchor,
                  version_anchor + '        buildConfigField("String", "OTA_CN_MANIFEST_URL", "\\\"$otaCnManifestLiteral\\\"")\n',
                  1,
              )
          if "// dev.58:" not in s:
              s = s.rstrip() + "\n\n// dev.58: fix annual research compilation and add mainland-first dual-channel OTA with verified GitHub fallback.\n"
          p.write_text(s, encoding="utf-8")

          p = Path("app/src/main/java/com/riftlab/app/ui/UpdateCenterUi.kt")
          s = p.read_text(encoding="utf-8")
          needle = '            Text(state.status, color = if (state.available) RiftCyan else RiftMuted, fontSize = 11.sp, lineHeight = 16.sp)\n'
          if '更新通道 · ${state.sourceLabel}' not in s:
              replacement = (
                  '            if (state.sourceLabel.isNotBlank()) {\n'
                  '                Text("更新通道 · ${state.sourceLabel}", color = RiftMuted, fontSize = 9.sp)\n'
                  '            }\n'
                  '            Text(state.status, color = if (state.available) RiftCyan else RiftMuted, fontSize = 11.sp, lineHeight = 16.sp)\n'
              )
              s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding="utf-8")

          p = Path(".github/workflows/android-build.yml")
          s = p.read_text(encoding="utf-8")
          old = (
              '      - name: Build fixed-signed debug APK\n'
              '        run: gradle :app:assembleDebug\n'
          )
          new = (
              '      - name: Build fixed-signed debug APK\n'
              '        env:\n'
              '          RIFTLAB_OTA_CN_MANIFEST_URL: ${{ vars.RIFTLAB_OTA_CN_MANIFEST_URL }}\n'
              '        run: gradle :app:assembleDebug -PRIFTLAB_OTA_CN_MANIFEST_URL="${RIFTLAB_OTA_CN_MANIFEST_URL:-}"\n'
          )
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("DEV_CHANGELOG.txt")
          s = p.read_text(encoding="utf-8")
          entry = (
              "dev.58：修复 dev.57 年度赛事研究页的 Compose @Composable 与正则转义编译错误；"
              "OTA 升级为“中国大陆对象存储/CDN 优先 + GitHub dev-latest 自动兜底”的双通道。"
              "国内 manifest 支持相对 APK 路径，强制 HTTPS，并校验 SHA-256、包名与 versionCode；"
              "国内下载失败时仅在 GitHub 同版本且 SHA-256 一致时自动切换。"
              "CI 可通过仓库 Variables/Secrets 向 S3 兼容国内对象存储发布带版本号 APK 与 latest.json；"
              "未配置国内存储时明确跳过，不伪造可用源。"
          )
          if not s.startswith("dev.58："):
              p.write_text(entry + "\n\n" + s, encoding="utf-8")
          PY

          cat > app/src/main/java/com/riftlab/app/update/AppUpdateManager.kt <<'KOTLIN'
          package com.riftlab.app.update

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import com.riftlab.app.BuildConfig
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.MessageDigest

          internal data class AppUpdateState(
              val checking: Boolean = false,
              val downloading: Boolean = false,
              val available: Boolean = false,
              val latestVersionName: String = "",
              val latestVersionCode: Int = 0,
              val changelog: String = "",
              val apkUrl: String = "",
              val expectedSha256: String = "",
              val sourceLabel: String = "",
              val progressPercent: Int = 0,
              val downloadedBytes: Long = 0L,
              val totalBytes: Long = 0L,
              val status: String = "尚未检查更新",
              val error: String? = null
          )

          private data class ReleaseCandidate(
              val sourceLabel: String,
              val versionName: String,
              val versionCode: Int,
              val changelog: String,
              val apkUrl: String,
              val sha256: String,
              val size: Long
          )

          private data class PreferredRelease(
              val candidate: ReleaseCandidate,
              val note: String = ""
          )

          internal object AppUpdateManager {
              private const val RELEASE_API =
                  "https://api.github.com/repos/xbu080675-creator/Rlftlab/releases/tags/dev-latest"
              private const val SOURCE_CN = "国内 OTA 镜像"
              private const val SOURCE_GITHUB = "GitHub DEV 备用源"

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private var appContext: Context? = null

              private val _state = MutableStateFlow(AppUpdateState())
              val state: StateFlow<AppUpdateState> = _state.asStateFlow()

              fun initialize(context: Context) {
                  appContext = context.applicationContext
              }

              fun checkForUpdates() {
                  if (_state.value.checking) return
                  scope.launch {
                      val hasCn = BuildConfig.OTA_CN_MANIFEST_URL.isNotBlank()
                      _state.value = _state.value.copy(
                          checking = true,
                          error = null,
                          status = if (hasCn) {
                              "正在检查国内 OTA 镜像…"
                          } else {
                              "国内 OTA 镜像尚未配置 · 正在检查 GitHub 备用源…"
                          }
                      )
                      val result = runCatching { fetchPreferredRelease() }
                      _state.value = result.fold(
                          onSuccess = { preferred ->
                              candidateToState(preferred.candidate, preferred.note).copy(checking = false)
                          },
                          onFailure = { t ->
                              _state.value.copy(
                                  checking = false,
                                  error = t.message ?: t::class.java.simpleName,
                                  status = "检查更新失败 · ${t.message?.take(120) ?: t::class.java.simpleName}"
                              )
                          }
                      )
                  }
              }

              fun downloadAndInstall() {
                  val context = appContext ?: return
                  val current = _state.value
                  if (!current.available || current.apkUrl.isBlank() || current.downloading) return

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      !context.packageManager.canRequestPackageInstalls()
                  ) {
                      _state.value = current.copy(status = "需要先允许 RiftLab 安装未知应用")
                      val intent = Intent(
                          Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                          Uri.parse("package:${context.packageName}")
                      ).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(intent)
                      return
                  }

                  scope.launch {
                      _state.value = current.copy(
                          downloading = true,
                          progressPercent = 0,
                          downloadedBytes = 0,
                          totalBytes = current.totalBytes,
                          error = null,
                          status = "正在通过 ${current.sourceLabel.ifBlank { "OTA" }} 下载 ${current.latestVersionName}…"
                      )
                      val result = runCatching { downloadWithFallback(current) }
                      result.onSuccess { apk ->
                          _state.value = _state.value.copy(
                              downloading = false,
                              progressPercent = 100,
                              status = "下载、SHA-256 与 APK 身份校验完成 · 正在打开系统安装器"
                          )
                          withContext(Dispatchers.Main) { launchInstaller(context, apk) }
                      }.onFailure { t ->
                          _state.value = _state.value.copy(
                              downloading = false,
                              error = t.message ?: t::class.java.simpleName,
                              status = "更新下载失败 · ${t.message?.take(120) ?: t::class.java.simpleName}"
                          )
                      }
                  }
              }

              private fun fetchPreferredRelease(): PreferredRelease {
                  val cnManifest = BuildConfig.OTA_CN_MANIFEST_URL.trim()
                  if (cnManifest.isBlank()) {
                      return PreferredRelease(
                          candidate = fetchGithubRelease(),
                          note = "国内镜像待配置"
                      )
                  }

                  return try {
                      PreferredRelease(fetchDomesticManifest(cnManifest))
                  } catch (_: Throwable) {
                      PreferredRelease(
                          candidate = fetchGithubRelease(),
                          note = "国内镜像不可用，已自动切换 GitHub"
                      )
                  }
              }

              private fun fetchDomesticManifest(manifestUrl: String): ReleaseCandidate {
                  requireHttps(manifestUrl, "国内 OTA manifest")
                  val root = getJson(
                      url = manifestUrl,
                      accept = "application/json",
                      failurePrefix = "国内镜像"
                  )
                  val schemaVersion = root.optInt("schemaVersion", 1)
                  if (schemaVersion < 1) error("国内镜像 manifest schema 无效")
                  val channel = root.optString("channel", "dev")
                  if (channel.isNotBlank() && !channel.equals("dev", ignoreCase = true)) {
                      error("国内镜像 channel 非 dev")
                  }

                  val versionName = root.optString("versionName").trim()
                  val versionCode = root.optInt("versionCode", 0)
                  val sha256 = root.optString("sha256").trim().lowercase()
                  val apkRef = root.optString("apkUrl").trim()
                      .ifBlank { root.optString("apk").trim() }
                  val changelog = root.optString("changelog").trim()
                  val size = root.optLong("size", 0L).coerceAtLeast(0L)

                  if (versionName.isBlank() || versionCode <= 0 || apkRef.isBlank()) {
                      error("国内镜像 manifest 元数据不完整")
                  }
                  validateSha256(sha256)

                  val apkUrl = URL(URL(manifestUrl), apkRef).toString()
                  requireHttps(apkUrl, "国内 OTA APK")
                  return ReleaseCandidate(
                      sourceLabel = SOURCE_CN,
                      versionName = versionName,
                      versionCode = versionCode,
                      changelog = changelog,
                      apkUrl = apkUrl,
                      sha256 = sha256,
                      size = size
                  )
              }

              private fun fetchGithubRelease(): ReleaseCandidate {
                  val root = getJson(
                      url = RELEASE_API,
                      accept = "application/vnd.github+json",
                      failurePrefix = "GitHub"
                  )
                  val body = root.optString("body")
                  val versionName = lineValue(body, "versionName")
                  val versionCode = lineValue(body, "versionCode").toIntOrNull() ?: 0
                  val sha256 = lineValue(body, "sha256").lowercase()
                  val changelog = body.substringAfter("changelog=", "")
                      .trim()
                      .ifBlank { root.optString("name") }

                  val assets = root.optJSONArray("assets")
                  var apkUrl = ""
                  var total = 0L
                  if (assets != null) {
                      for (i in 0 until assets.length()) {
                          val asset = assets.optJSONObject(i) ?: continue
                          val name = asset.optString("name")
                          if (name.endsWith(".apk", ignoreCase = true)) {
                              apkUrl = asset.optString("browser_download_url").trim()
                              total = asset.optLong("size", 0L).coerceAtLeast(0L)
                              break
                          }
                      }
                  }
                  if (versionCode <= 0 || versionName.isBlank() || apkUrl.isBlank()) {
                      error("GitHub DEV release metadata incomplete")
                  }
                  validateSha256(sha256)
                  requireHttps(apkUrl, "GitHub OTA APK")
                  return ReleaseCandidate(
                      sourceLabel = SOURCE_GITHUB,
                      versionName = versionName,
                      versionCode = versionCode,
                      changelog = changelog,
                      apkUrl = apkUrl,
                      sha256 = sha256,
                      size = total
                  )
              }

              private fun candidateToState(
                  candidate: ReleaseCandidate,
                  note: String
              ): AppUpdateState {
                  val available = candidate.versionCode > BuildConfig.VERSION_CODE
                  val prefix = listOf(note, candidate.sourceLabel)
                      .filter { it.isNotBlank() }
                      .joinToString(" · ")
                  return AppUpdateState(
                      available = available,
                      latestVersionName = candidate.versionName,
                      latestVersionCode = candidate.versionCode,
                      changelog = candidate.changelog,
                      apkUrl = candidate.apkUrl,
                      expectedSha256 = candidate.sha256,
                      sourceLabel = candidate.sourceLabel,
                      totalBytes = candidate.size,
                      status = if (available) {
                          "$prefix · 发现新版本 ${candidate.versionName} · code ${candidate.versionCode}"
                      } else {
                          "$prefix · 当前已是最新 DEV 版本 · ${BuildConfig.VERSION_NAME}"
                      }
                  )
              }

              private fun downloadWithFallback(current: AppUpdateState): File {
                  val primary = ReleaseCandidate(
                      sourceLabel = current.sourceLabel,
                      versionName = current.latestVersionName,
                      versionCode = current.latestVersionCode,
                      changelog = current.changelog,
                      apkUrl = current.apkUrl,
                      sha256 = current.expectedSha256,
                      size = current.totalBytes
                  )

                  return try {
                      downloadApk(primary)
                  } catch (primaryError: Throwable) {
                      if (primary.sourceLabel != SOURCE_CN) throw primaryError

                      _state.value = _state.value.copy(
                          progressPercent = 0,
                          downloadedBytes = 0,
                          status = "国内镜像下载失败 · 正在切换 GitHub 备用源…"
                      )
                      val fallback = fetchGithubRelease()
                      if (
                          fallback.versionCode != primary.versionCode ||
                          !fallback.sha256.equals(primary.sha256, ignoreCase = true)
                      ) {
                          error("国内镜像与 GitHub 备用源版本或 SHA-256 不一致，请重新检查更新")
                      }

                      _state.value = _state.value.copy(
                          sourceLabel = fallback.sourceLabel,
                          apkUrl = fallback.apkUrl,
                          totalBytes = fallback.size,
                          status = "已切换 ${fallback.sourceLabel} · 正在继续下载…"
                      )
                      try {
                          downloadApk(fallback)
                      } catch (fallbackError: Throwable) {
                          fallbackError.addSuppressed(primaryError)
                          throw fallbackError
                      }
                  }
              }

              private fun downloadApk(candidate: ReleaseCandidate): File {
                  val context = appContext ?: error("AppUpdateManager not initialized")
                  val dir = File(context.cacheDir, "updates").apply { mkdirs() }
                  val out = File(dir, "RiftLab-update.apk")
                  if (out.exists()) out.delete()

                  val connection = URL(candidate.apkUrl).openConnection() as HttpURLConnection
                  try {
                      connection.instanceFollowRedirects = true
                      connection.connectTimeout = 12_000
                      connection.readTimeout = 35_000
                      connection.useCaches = false
                      connection.setRequestProperty("Accept", "application/octet-stream")
                      connection.setRequestProperty("Cache-Control", "no-cache")
                      connection.setRequestProperty(
                          "User-Agent",
                          "RiftLab-Updater/${BuildConfig.VERSION_NAME}"
                      )
                      connection.connect()
                      if (connection.responseCode !in 200..299) {
                          error("${candidate.sourceLabel} HTTP ${connection.responseCode}")
                      }

                      val responseTotal = connection.contentLengthLong.coerceAtLeast(0L)
                      val total = if (responseTotal > 0L) responseTotal else candidate.size
                      val digest = MessageDigest.getInstance("SHA-256")
                      connection.inputStream.use { input ->
                          FileOutputStream(out).use { output ->
                              val buffer = ByteArray(64 * 1024)
                              var downloaded = 0L
                              while (true) {
                                  val read = input.read(buffer)
                                  if (read < 0) break
                                  output.write(buffer, 0, read)
                                  digest.update(buffer, 0, read)
                                  downloaded += read
                                  val percent = if (total > 0) {
                                      ((downloaded * 100L) / total).toInt().coerceIn(0, 100)
                                  } else {
                                      0
                                  }
                                  _state.value = _state.value.copy(
                                      downloadedBytes = downloaded,
                                      totalBytes = total,
                                      progressPercent = percent,
                                      status = "正在通过 ${candidate.sourceLabel} 下载 ${candidate.versionName} · $percent%"
                                  )
                              }
                          }
                      }

                      val actual = digest.digest().joinToString("") { "%02x".format(it) }
                      if (!actual.equals(candidate.sha256, ignoreCase = true)) {
                          out.delete()
                          error("${candidate.sourceLabel} SHA-256 校验失败")
                      }
                      verifyArchiveIdentity(context, out, candidate.versionCode)
                      return out
                  } finally {
                      connection.disconnect()
                  }
              }

              private fun verifyArchiveIdentity(
                  context: Context,
                  apk: File,
                  expectedVersionCode: Int
              ) {
                  val info = context.packageManager.getPackageArchiveInfo(apk.absolutePath, 0)
                      ?: run {
                          apk.delete()
                          error("APK 元数据读取失败")
                      }
                  if (info.packageName != context.packageName) {
                      apk.delete()
                      error("APK 包名校验失败")
                  }
                  if (info.longVersionCode != expectedVersionCode.toLong()) {
                      apk.delete()
                      error("APK versionCode 与 OTA manifest 不一致")
                  }
              }

              private fun launchInstaller(context: Context, apk: File) {
                  val uri = FileProvider.getUriForFile(
                      context,
                      "${context.packageName}.fileprovider",
                      apk
                  )
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_ACTIVITY_NEW_TASK
                      )
                  }
                  context.startActivity(intent)
              }

              private fun getJson(
                  url: String,
                  accept: String,
                  failurePrefix: String
              ): JSONObject {
                  val connection = URL(url).openConnection() as HttpURLConnection
                  return try {
                      connection.instanceFollowRedirects = true
                      connection.connectTimeout = 8_000
                      connection.readTimeout = 12_000
                      connection.useCaches = false
                      connection.setRequestProperty("Accept", accept)
                      connection.setRequestProperty("Cache-Control", "no-cache")
                      connection.setRequestProperty("Pragma", "no-cache")
                      connection.setRequestProperty(
                          "User-Agent",
                          "RiftLab-Updater/${BuildConfig.VERSION_NAME}"
                      )
                      val code = connection.responseCode
                      if (code !in 200..299) error("$failurePrefix HTTP $code")
                      JSONObject(connection.inputStream.bufferedReader().use { it.readText() })
                  } finally {
                      connection.disconnect()
                  }
              }

              private fun validateSha256(value: String) {
                  if (!Regex("^[0-9a-f]{64}$").matches(value)) {
                      error("OTA SHA-256 缺失或格式无效")
                  }
              }

              private fun requireHttps(value: String, label: String) {
                  if (!value.startsWith("https://", ignoreCase = true)) {
                      error("$label 必须使用 HTTPS")
                  }
              }

              private fun lineValue(body: String, key: String): String = body.lineSequence()
                  .firstOrNull { it.trim().startsWith("$key=") }
                  ?.substringAfter('=')
                  ?.trim()
                  .orEmpty()
          }
          KOTLIN

          cat > .github/workflows/ota-direct.yml <<'OTAYAML'
          name: DEV OTA Direct

          on:
            push:
              branches: [ main ]
              paths:
                - 'app/**'
                - 'DEV_CHANGELOG.txt'
                - 'build.gradle.kts'
                - 'settings.gradle.kts'
                - 'gradle.properties'
                - 'signing/**'
                - '.github/workflows/ota-direct.yml'
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: riftlab-dev-ota-direct
            cancel-in-progress: true

          jobs:
            build-and-publish:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v3
                - name: Install Android SDK 36
                  run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
                - name: Bundle resilient data seeds
                  shell: bash
                  run: |
                    mkdir -p app/src/main/assets
                    for name in riot_persisted_mirror.json team_profiles.json people.json team_archive.json; do
                      if [ -f "data/lpl/$name" ]; then
                        cp "data/lpl/$name" "app/src/main/assets/$name"
                      fi
                    done
                    if [ -f "data/esports/esports_graph.json" ]; then
                      cp "data/esports/esports_graph.json" "app/src/main/assets/esports_graph.json"
                    fi
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '9.6.0'
                - name: Build fixed-signed debug APK
                  env:
                    RIFTLAB_OTA_CN_MANIFEST_URL: ${{ vars.RIFTLAB_OTA_CN_MANIFEST_URL }}
                  run: gradle :app:assembleDebug -PRIFTLAB_OTA_CN_MANIFEST_URL="${RIFTLAB_OTA_CN_MANIFEST_URL:-}"
                - name: Verify fixed dev signature
                  shell: bash
                  run: |
                    set -euo pipefail
                    APK="app/build/outputs/apk/debug/app-debug.apk"
                    APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
                    "$APKSIGNER" verify --print-certs "$APK"
                    DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
                    EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
                    echo "RiftLab dev signing SHA-256: $DIGEST"
                    test "$DIGEST" = "$EXPECTED"
                - name: Prepare OTA metadata
                  shell: bash
                  run: |
                    set -euo pipefail
                    VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
                    VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
                    SRC="app/build/outputs/apk/debug/app-debug.apk"
                    APK_NAME="RiftLab-${VERSION_NAME}.apk"
                    OUT="/tmp/${APK_NAME}"
                    cp "$SRC" "$OUT"
                    SHA=$(sha256sum "$OUT" | awk '{print $1}')
                    SIZE=$(stat -c '%s' "$OUT")
                    CHANGELOG=$(python3 - <<'PY'
                    from pathlib import Path
                    text = Path('DEV_CHANGELOG.txt').read_text(encoding='utf-8').strip()
                    first = text.split('\n\n', 1)[0].replace('\n', ' ').strip()
                    if len(first) > 520:
                        first = first[:519].rstrip() + '…'
                    print(first)
                    PY
                    )
                    export VERSION_NAME VERSION_CODE APK_NAME OUT SHA SIZE CHANGELOG
                    python3 - <<'PY'
                    import json, os
                    from datetime import datetime, timezone
                    payload = {
                        "schemaVersion": 1,
                        "channel": "dev",
                        "versionName": os.environ["VERSION_NAME"],
                        "versionCode": int(os.environ["VERSION_CODE"]),
                        "apk": os.environ["APK_NAME"],
                        "sha256": os.environ["SHA"],
                        "size": int(os.environ["SIZE"]),
                        "publishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                        "changelog": os.environ["CHANGELOG"],
                    }
                    with open("/tmp/latest.json", "w", encoding="utf-8") as f:
                        json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
                        f.write("\n")
                    PY
                    cat > /tmp/riftlab-release.txt <<EOF
                    RIFTLAB_UPDATE
                    versionName=$VERSION_NAME
                    versionCode=$VERSION_CODE
                    sha256=$SHA
                    channel=dev
                    changelog=$CHANGELOG
                    EOF
                    {
                      echo "RIFTLAB_VERSION_NAME=$VERSION_NAME"
                      echo "RIFTLAB_VERSION_CODE=$VERSION_CODE"
                      echo "RIFTLAB_APK_NAME=$APK_NAME"
                      echo "RIFTLAB_APK_PATH=$OUT"
                    } >> "$GITHUB_ENV"
                - name: Publish dev-latest GitHub fallback
                  env:
                    GH_TOKEN: ${{ github.token }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    git tag -f dev-latest "$GITHUB_SHA"
                    git push -f origin refs/tags/dev-latest

                    if gh release view dev-latest >/dev/null 2>&1; then
                      RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/dev-latest" --jq .id)
                      gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
                        --jq '.[] | select(.name | endswith(".apk")) | .id' |
                        while read -r AID; do
                          [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
                        done
                      gh release upload dev-latest "$RIFTLAB_APK_PATH"
                      gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RID" \
                        -f name="RiftLab $RIFTLAB_VERSION_NAME · DEV" \
                        -f body="$(cat /tmp/riftlab-release.txt)" \
                        -F prerelease=true \
                        -f target_commitish="$GITHUB_SHA" >/dev/null
                    else
                      gh release create dev-latest "$RIFTLAB_APK_PATH" \
                        --verify-tag \
                        --title "RiftLab $RIFTLAB_VERSION_NAME · DEV" \
                        --notes-file /tmp/riftlab-release.txt \
                        --prerelease
                    fi
                - name: Publish mainland OTA mirror
                  continue-on-error: true
                  env:
                    OTA_CN_MANIFEST_URL: ${{ vars.RIFTLAB_OTA_CN_MANIFEST_URL }}
                    OTA_CN_S3_ENDPOINT: ${{ vars.RIFTLAB_OTA_CN_S3_ENDPOINT }}
                    OTA_CN_BUCKET: ${{ vars.RIFTLAB_OTA_CN_BUCKET }}
                    OTA_CN_PREFIX: ${{ vars.RIFTLAB_OTA_CN_PREFIX }}
                    OTA_CN_REGION: ${{ vars.RIFTLAB_OTA_CN_REGION }}
                    AWS_ACCESS_KEY_ID: ${{ secrets.RIFTLAB_OTA_CN_ACCESS_KEY_ID }}
                    AWS_SECRET_ACCESS_KEY: ${{ secrets.RIFTLAB_OTA_CN_SECRET_ACCESS_KEY }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    missing=0
                    for name in OTA_CN_MANIFEST_URL OTA_CN_S3_ENDPOINT OTA_CN_BUCKET OTA_CN_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
                      if [ -z "${!name:-}" ]; then
                        echo "::notice::$name is not configured; mainland mirror upload is skipped."
                        missing=1
                      fi
                    done
                    if [ "$missing" -ne 0 ]; then
                      exit 0
                    fi

                    if ! command -v aws >/dev/null 2>&1; then
                      python3 -m pip install --user --quiet awscli
                      export PATH="$HOME/.local/bin:$PATH"
                    fi
                    # COS/OSS/OBS modern buckets expect S3 virtual-hosted style.
                    aws configure set default.s3.addressing_style virtual

                    PREFIX="${OTA_CN_PREFIX:-riftlab/dev}"
                    PREFIX="${PREFIX#/}"
                    PREFIX="${PREFIX%/}"
                    APK_KEY="${PREFIX:+$PREFIX/}$RIFTLAB_APK_NAME"
                    MANIFEST_KEY="${PREFIX:+$PREFIX/}latest.json"

                    aws s3 cp "$RIFTLAB_APK_PATH" "s3://$OTA_CN_BUCKET/$APK_KEY" \
                      --endpoint-url "$OTA_CN_S3_ENDPOINT" \
                      --region "$OTA_CN_REGION" \
                      --content-type "application/vnd.android.package-archive" \
                      --cache-control "public,max-age=31536000,immutable" \
                      --no-progress

                    aws s3 cp /tmp/latest.json "s3://$OTA_CN_BUCKET/$MANIFEST_KEY" \
                      --endpoint-url "$OTA_CN_S3_ENDPOINT" \
                      --region "$OTA_CN_REGION" \
                      --content-type "application/json; charset=utf-8" \
                      --cache-control "no-cache,no-store,must-revalidate" \
                      --no-progress

                    echo "Mainland OTA mirror published: $OTA_CN_MANIFEST_URL"
                    curl -fsSL --retry 2 --connect-timeout 8 \
                      -H 'Cache-Control: no-cache' \
                      "${OTA_CN_MANIFEST_URL}?ci=${GITHUB_RUN_ID}" |
                      python3 -c 'import json,sys; d=json.load(sys.stdin); assert int(d["versionCode"]) == int(sys.argv[1]); print("CN manifest verified:", d["versionName"], d["sha256"])' \
                      "$RIFTLAB_VERSION_CODE"
          OTAYAML

          cat > docs/OTA_CN.md <<'DOC'
          # RiftLab 中国大陆 OTA 镜像

          RiftLab dev.58 起采用双通道更新：

          1. 中国大陆对象存储/CDN `latest.json`（优先）
          2. GitHub `dev-latest` Release（自动兜底）

          客户端只接受 HTTPS。下载完成后校验 SHA-256、包名和 versionCode，再交给 Android 系统安装器；固定 dev 签名仍由 Android 最终校验。

          ## GitHub Actions 配置

          Repository Variables：

          - `RIFTLAB_OTA_CN_MANIFEST_URL`：公开 HTTPS 地址，例如 `https://<cdn-domain>/riftlab/dev/latest.json`
          - `RIFTLAB_OTA_CN_S3_ENDPOINT`：S3-compatible endpoint
          - `RIFTLAB_OTA_CN_BUCKET`：bucket
          - `RIFTLAB_OTA_CN_PREFIX`：可选，默认 `riftlab/dev`
          - `RIFTLAB_OTA_CN_REGION`：签名 region

          Repository Secrets：

          - `RIFTLAB_OTA_CN_ACCESS_KEY_ID`
          - `RIFTLAB_OTA_CN_SECRET_ACCESS_KEY`

          `ota-direct.yml` 会先上传带版本号 APK，再最后上传 `latest.json`。未配置以上值时不会伪造国内源：CI 跳过镜像上传，客户端使用 GitHub 备用源。

          建议使用中国大陆可直连且支持 HTTPS/S3-compatible API 的 COS、OSS、OBS 或同类对象存储。`latest.json` 使用 no-cache，APK 文件名带版本号，可长期缓存。
          DOC

      - name: Compile-check dev58 before push
        run: gradle :app:compileDebugKotlin -PRIFTLAB_OTA_CN_MANIFEST_URL=

      - name: Commit dev58
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt \
            app/src/main/java/com/riftlab/app/ui/UpdateCenterUi.kt \
            app/src/main/java/com/riftlab/app/update/AppUpdateManager.kt \
            .github/workflows/android-build.yml \
            .github/workflows/ota-direct.yml \
            DEV_CHANGELOG.txt \
            docs/OTA_CN.md
          git commit -m "fix: dev.58 compile and mainland-first OTA"
          git pull --rebase origin main
          git push origin HEAD:main
