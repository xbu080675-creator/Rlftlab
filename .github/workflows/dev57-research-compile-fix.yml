name: Fix RiftLab dev57 research compile

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dev57-research-compile-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply dev58 compile/build fixes
        run: python3 tools/fix_dev57_research_compile.py
      - name: Compile check
        run: gradle :app:compileDebugKotlin
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/TournamentResearch.kt \
            app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt \
            .github/workflows/android-build.yml DEV_CHANGELOG.txt
          if git diff --cached --quiet; then
            echo "No dev58 fix changes needed"
            exit 0
          fi
          git commit -m "fix: finalize dev.58 compile and build wiring"
          git pull --rebase origin main
          git push origin HEAD:main
