name: dev73 final static audit

on:
  push:
    branches: [ dev72-postrelease-audit ]
    paths:
      - '.github/workflows/dev73-final-static-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-postrelease-audit
      - name: Audit residual tiny text and temporary release files
        shell: bash
        run: |
          set -uo pipefail
          echo '=== residual 8sp/9sp ==='
          grep -R -n -E '(^|[^0-9])(8|9)\.sp([^0-9]|$)' app/src/main/java || true
          echo '=== residual native 8f/9f text sizes ==='
          grep -R -n -E '(textSize|setTextSize|drawText|fontSize|teamNameFontSize).*(8|9)f([^0-9]|$)' app/src/main/java || true
          echo '=== mock naming ==='
          grep -R -n 'MockAiInsightEngine' app/src/main/java || true
          echo '=== branch-specific dev73 workflow/tool leftovers ==='
          find .github/workflows tools -maxdepth 2 -type f \( -iname '*dev73*' -o -iname '*postrelease*' \) -print || true
          echo '=== generated audit leftovers ==='
          find . -maxdepth 2 -type f -iname '*audit*.json' -print || true
          echo '=== release metadata ==='
          grep -n -E 'versionCode|versionName' app/build.gradle.kts
