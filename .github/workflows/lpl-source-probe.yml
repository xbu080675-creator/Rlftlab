name: LPL Source Probe

on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current LPL TJStats ids and routes
        shell: bash
        run: |
          python - <<'PY'
          import re, json, urllib.request, urllib.parse, urllib.error

          UA = 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          ORIGIN = 'https://lpl.qq.com'

          def req(url, headers=None, timeout=15):
              h = {
                  'User-Agent': UA,
                  'Accept': '*/*',
                  'Referer': ORIGIN + '/',
                  'Origin': ORIGIN,
              }
              if headers:
                  h.update(headers)
              r = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as x:
                      body = x.read().decode('utf-8', 'replace')
                      return x.status, body, dict(x.headers)
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')
                  return e.code, body, dict(e.headers)

          def fetch_text(path):
              st, body, _ = req(path if path.startswith('http') else ORIGIN + path)
              print('FETCH', path, 'HTTP', st, 'LEN', len(body))
              return body

          common = fetch_text('/web202301/js/common.js')
          token_match = re.search(r"Authorization\s*:\s*['\"]([^'\"]+)['\"]", common)
          token = token_match.group(1) if token_match else ''
          print('TJ_TOKEN_FOUND=', bool(token), 'LEN=', len(token))
          if not token:
              raise SystemExit('No public TJStats Authorization token found in official common.js')

          sources = {
              'index': fetch_text('/web202301/js/index.js'),
              'public': fetch_text('/web201612/js/public.js'),
              'showdata2': fetch_text('/web201612/js/showdata2.js'),
              'afterdata': fetch_text('/web201612/js/after-data-1.js'),
              'live': fetch_text('/web201612/js/LPL_Live.js'),
              'config': fetch_text('/web201612/js/lplMatchConfig.js'),
          }

          print('\n=== OFFICIAL getTJStats CALLS ===')
          routes = set()
          for name, text in sources.items():
              for m in re.finditer(r"getTJStats\s*\(\s*['\"]([^'\"]+)['\"]", text):
                  route = m.group(1)
                  routes.add(route)
                  lo = max(0, m.start() - 180)
                  hi = min(len(text), m.start() + 850)
                  print('\nSOURCE=', name, 'ROUTE=', route)
                  print(text[lo:hi].replace('\n', ' ')[:1050])
          print('\nROUTES=', sorted(routes))

          # Current homepage match list / mapping source.
          data_candidates = [
              '/web201612/data/LOL_MATCH2_GAME_LIST_BRIEF.js',
              '/web201612/data/LOL_NEWMATCH_FIR_PAGE_RECO_INFO.js',
              '/web201612/data/LOL_MATCH2_GAME_LIST.js',
          ]
          print('\n=== CURRENT MATCH DATA ===')
          for path in data_candidates:
              try:
                  text = fetch_text(path)
              except Exception as e:
                  print(path, 'ERR', repr(e)); continue
              low = text.lower()
              for needle in ['lgd', 'ig', 'invictus']:
                  pos = low.find(needle)
                  if pos >= 0:
                      print('\n', path, 'needle=', needle, 'pos=', pos)
                      print(text[max(0,pos-1800):pos+2600].replace('\n',' ')[:4500])
              # Print recent-looking date snippets and bMatch IDs near 2026 if present.
              for m in list(re.finditer(r'2026[-/.]\d{1,2}[-/.]\d{1,2}', text))[-8:]:
                  print('DATE_CTX', text[max(0,m.start()-500):m.start()+1300].replace('\n',' ')[:1800])

          base = 'https://open.tjstats.com/match-auth-app/open/v1'
          headers = {'Authorization': token, 'Accept': 'application/json, text/plain, */*'}
          probe_routes = [
              '/schedule/match',
              '/schedule/info',
              '/schedule/singleMatch',
              '/schedule/starting',
              '/realtime/teamBasic',
              '/realtime/team',
              '/realtime/teamGold',
              '/realtime/playerBasic',
              '/realtime/player',
              '/realtime/singleBp',
              '/pro/realtime/game',
          ]
          print('\n=== TJSTATS PARAMETER PROBE ===')
          for route in probe_routes:
              st, body, hdr = req(base + route, headers=headers)
              print('\nROUTE', route, 'HTTP', st, 'TYPE', hdr.get('Content-Type'), 'LEN', len(body))
              print(body[:2400].replace('\n', ' '))
          PY
