name: LPL Source Probe

on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe LPL official frontend and data backends
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, json
          from html import unescape

          UA = 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'

          def raw(url, headers=None, timeout=20):
              h = {'User-Agent': UA, 'Accept': '*/*'}
              if headers: h.update(headers)
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8', 'replace'), dict(r.headers)

          def show(label, url):
              try:
                  st, final, body, hdr = raw(url)
                  print('\n===', label, '===')
                  print('status=', st, 'final=', final, 'len=', len(body), 'type=', hdr.get('Content-Type'))
                  print('keywords=', {k: body.lower().find(k.lower()) for k in ['tjstats','match-auth-app','comm-match-app','bmid','authorization','appid','token','realtime/singlebp','realtime/team','realtime/topdata']})
                  scripts = re.findall(r'<script[^>]+src=[\"\']([^\"\']+)', body, flags=re.I)
                  print('scripts=', scripts[:40])
                  for pat in [r'https?://[^\"\'<> ]*tjstats[^\"\'<> ]*', r'[^\"\']{0,100}bmid[^\"\']{0,180}', r'[^\"\']{0,100}appId[^\"\']{0,180}', r'[^\"\']{0,100}Authorization[^\"\']{0,180}']:
                      vals = re.findall(pat, body, flags=re.I)
                      if vals: print('match', pat, vals[:10])
                  return final, body, scripts
              except Exception as e:
                  print('\n===', label, 'ERR ===', repr(e))
                  return url, '', []

          pages = [
              ('LPL_HOME', 'https://lpl.qq.com/'),
              ('LPL_ES', 'https://lpl.qq.com/es/'),
              ('LPL_STATS_EXAMPLE', 'https://lpl.qq.com/es/stats.shtml?bmid=10413'),
          ]
          all_scripts=[]
          for label,url in pages:
              final, body, scripts = show(label,url)
              for s in scripts:
                  if s.startswith('//'): s='https:'+s
                  elif s.startswith('/'):
                      p=urllib.parse.urlsplit(final)
                      s=f'{p.scheme}://{p.netloc}{s}'
                  elif not s.startswith('http'):
                      s=urllib.parse.urljoin(final,s)
                  all_scripts.append(s)

          # Fetch a bounded number of JS files and grep interesting API/auth strings.
          seen=set()
          for s in all_scripts:
              if s in seen: continue
              seen.add(s)
              if len(seen)>35: break
              try:
                  st, final, body, hdr = raw(s, timeout=15)
              except Exception as e:
                  continue
              low=body.lower()
              if any(k in low for k in ['tjstats','match-auth-app','comm-match-app','loginbyappid','realtime/singlebp','bmid','authorization']):
                  print('\n=== INTERESTING_JS ===', final, 'len=', len(body))
                  for key in ['tjstats','match-auth-app','comm-match-app','loginByAppId','realtime/singleBp','realtime/team','realtime/topData','bmid','appId','Authorization','token']:
                      pos=low.find(key.lower())
                      if pos>=0:
                          print(key, '=>', body[max(0,pos-260):pos+520].replace('\n',' ')[:900])

          # Probe known historical QQ data endpoints for reachability only.
          for url in [
              'https://apps.game.qq.com/lol/match/apis/searchMatchInfo_s.php?p0=1&r1=MatchInfo',
              'https://apps.game.qq.com/lol/match/apis/searchSMatchList.php?p0=1&r1=SMatchListArr',
              'https://open.tjstats.com/match-auth-app/swagger/v1/doc.json',
          ]:
              try:
                  st, final, body, hdr = raw(url)
                  print('\n=== DIRECT ===', url, 'status=', st, 'final=', final, 'len=', len(body), 'type=', hdr.get('Content-Type'))
                  print(body[:1200].replace('\n',' '))
              except Exception as e:
                  print('\n=== DIRECT ERR ===', url, repr(e))
          PY
