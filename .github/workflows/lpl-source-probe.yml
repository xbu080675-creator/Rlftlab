name: LPL Source Probe

on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect TJStats realtime swagger parameters
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request

          URLS = [
            'https://open.tjstats.com/match-auth-app/swagger/v1/doc.json',
            'https://open.tjstats.com/match-auth-app/swagger/v1/swagger.json',
            'https://open.tjstats.com/match-auth-app/swagger/doc.json',
          ]
          targets = [
            '/realtime/team',
            '/realtime/teamGold',
            '/realtime/player',
            '/realtime/singleBp',
            '/pro/realtime/game',
          ]
          headers = {
            'User-Agent': 'Mozilla/5.0',
            'Referer': 'https://open.tjstats.com/match-auth-app/swagger/v1/index.html',
          }

          doc = None
          for url in URLS:
            try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                body = r.read().decode('utf-8', 'replace')
                print('DOC', url, 'HTTP', r.status, 'LEN', len(body))
                doc = json.loads(body)
                break
            except Exception as e:
              print('DOC_ERR', url, repr(e))

          if not doc:
            raise SystemExit('no swagger doc')

          paths = doc.get('paths', {})
          for path in targets:
            item = paths.get(path)
            print('\nPATH', path)
            if not item:
              print('MISSING')
              continue
            op = item.get('get') or item.get('post') or {}
            print('SUMMARY', op.get('summary'))
            for p in op.get('parameters', []):
              if '$ref' in p:
                print('PARAM_REF', p['$ref'])
              else:
                print('PARAM', json.dumps({
                  'name': p.get('name'),
                  'in': p.get('in'),
                  'required': p.get('required'),
                  'type': p.get('type'),
                  'format': p.get('format'),
                  'schema': p.get('schema'),
                  'description': p.get('description'),
                }, ensure_ascii=False))
            print('RESPONSES', ','.join((op.get('responses') or {}).keys()))
          PY
