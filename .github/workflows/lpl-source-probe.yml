name: LPL Source Probe

on:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract official realtime call parameters
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          BASE='https://lpl.qq.com'
          PATHS=[
            '/web202301/js/index.js',
            '/web202301/js/common.js',
            '/web201612/js/showdata2.js',
            '/web201612/js/after-data-1.js',
            '/web201612/js/LPL_Live.js',
            '/web201612/js/lplMatchConfig.js',
          ]
          def get(path):
            try:
              req=urllib.request.Request(BASE+path,headers={'User-Agent':UA,'Referer':BASE+'/'})
              with urllib.request.urlopen(req,timeout=15) as r:
                return r.read().decode('utf-8','replace')
            except Exception:
              return ''
          found=0
          for path in PATHS:
            text=get(path)
            for m in re.finditer(r'(?:getTJStats\s*\([^\)]{0,120}|["\']/(?:pro/)?realtime/[^"\']+)',text,re.I):
              p=m.start()
              chunk=text[max(0,p-520):min(len(text),p+1200)]
              if 'realtime/' not in chunk.lower() and 'schedule/starting' not in chunk.lower():
                continue
              # One compact single-line context per actual call.
              print('CALL src='+path.split('/')[-1]+' ctx='+re.sub(r'\s+',' ',chunk)[:1650])
              found+=1
              if found>=30: break
            if found>=30: break
          print('CALL_COUNT='+str(found))
          PY
