name: dev79 final verification

on:
  push:
    branches: [ dev79-data-depth-visual ]
    paths:
      - '.github/workflows/dev79-apply.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev79-data-depth-visual
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Verify dev79 data-depth contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 79' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-dev.79"' app/build.gradle.kts
          grep -q 'ComprehensiveDataDepthEnricher.enrich' app/src/main/java/com/riftlab/app/data/ComprehensiveDataCenter.kt
          grep -q 'MatchTimelineStore.timelines' app/src/main/java/com/riftlab/app/data/ComprehensiveDataCenter.kt
          grep -q 'bluePlayerSnapshots' app/src/main/java/com/riftlab/app/data/OpggMatchSupplementProvider.kt
          grep -q 'CoverageDial' app/src/main/java/com/riftlab/app/ui/ComprehensiveDataCoverageUi.kt
          grep -q 'fetchGlobalSchedule' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          grep -q 'InternationalEventMirrorProvider.fetchMatches' app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug
      - name: Verify fixed DEV signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev79-candidate
          path: app/build/outputs/apk/debug/app-debug.apk
