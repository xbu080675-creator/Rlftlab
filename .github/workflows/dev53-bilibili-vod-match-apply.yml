name: Apply RiftLab dev53 Bilibili VOD matcher

on:
  push:
    paths:
      - '.github/workflows/dev53-bilibili-vod-match-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Bilibili VOD resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/riftlab/app/data/BilibiliVodRepository.kt')
          s = p.read_text()

          s = s.replace(
              '    private const val REQUEST_GAP_MS = 260L\n',
              '    private const val REQUEST_GAP_MS = 260L\n    private const val NEGATIVE_CACHE_TTL_MS = 5L * 60L * 1000L\n',
              1
          )

          old_cache = '''        val cached = cache[key]\n        if (!forceRefresh && cached != null) {\n            _state.value = cached\n            return\n        }'''
          new_cache = '''        val cached = cache[key]\n        val cachedReusable = cached?.let { state ->\n            state.vod != null ||\n                (state.updatedAtEpochMs > 0L && System.currentTimeMillis() - state.updatedAtEpochMs < NEGATIVE_CACHE_TTL_MS)\n        } == true\n        if (!forceRefresh && cachedReusable) {\n            _state.value = cached!!\n            return\n        }'''
          if old_cache not in s:
              raise SystemExit('cache block not found')
          s = s.replace(old_cache, new_cache, 1)

          old_status = '                    else -> "B站官方录像 · 暂未找到官方完整录像"'
          new_status = '                    else -> "B站官方录像 · 暂未找到官方完整录像 · 将自动重试"'
          if old_status not in s:
              raise SystemExit('status block not found')
          s = s.replace(old_status, new_status, 1)

          old_queries = '''        val queries = buildList {\n            if (year > 0 && leagueToken.isNotBlank() && monthDay.isNotBlank()) add("$year$leagueToken $monthDay $left vs $right")\n            if (monthDay.isNotBlank()) add("$monthDay $left vs $right")\n            add("$left vs $right")\n        }.distinct()'''
          new_queries = '''        // Bilibili titles do not preserve Riot schedule side ordering. For example the schedule\n        // can be T1 vs KT while the official upload is titled KT vs T1. Search both orders, then\n        // fall back to an unordered token query; candidate scoring itself remains order-independent.\n        val orderedPairs = listOf("$left vs $right", "$right vs $left")\n        val loosePair = "$left $right"\n        val queries = buildList {\n            if (year > 0 && leagueToken.isNotBlank() && monthDay.isNotBlank()) {\n                orderedPairs.forEach { pair -> add("$year$leagueToken $monthDay $pair") }\n            }\n            if (monthDay.isNotBlank()) {\n                orderedPairs.forEach { pair -> add("$monthDay $pair") }\n                add("$monthDay $loosePair")\n            }\n            orderedPairs.forEach(::add)\n            add(loosePair)\n        }.distinct()'''
          if old_queries not in s:
              raise SystemExit('query block not found')
          s = s.replace(old_queries, new_queries, 1)
          p.write_text(s)

          p = Path('app/build.gradle.kts')
          g = p.read_text()
          if 'versionCode = 52' not in g or 'versionName = "1.0.0-dev.52"' not in g:
              raise SystemExit('dev52 version block not found')
          g = g.replace('versionCode = 52', 'versionCode = 53', 1)
          g = g.replace('versionName = "1.0.0-dev.52"', 'versionName = "1.0.0-dev.53"', 1)
          g += '\n// dev.53: Bilibili official VOD lookup accepts reversed team order and retries negative search cache.\n'
          p.write_text(g)
          PY
      - name: Commit dev53
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev53-bilibili-vod-match-apply.yml
          git add app/src/main/java/com/riftlab/app/data/BilibiliVodRepository.kt app/build.gradle.kts
          git commit -m "fix: harden Bilibili official VOD matching"
          git pull --rebase origin main
          git push origin HEAD:main
