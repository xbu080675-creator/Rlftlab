name: Probe TJStats post-match schemas

on:
  push:
    paths:
      - '.github/workflows/probe-tjstats-post.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe bmid 13503 schemas
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          from pathlib import Path

          src = Path('app/src/main/java/com/riftlab/app/data/LplHistoricalPostMatchResolver.kt').read_text()
          auth = re.search(r'TJ_AUTH = "([^"]+)"', src).group(1)
          urls = [
              'https://open.tjstats.com/match-auth-app/open/v1/compound/matchDetail?matchId=13503',
              'https://open.tjstats.com/comm-match-app/open/v1/compound/matchDetail?matchId=13503',
              'https://open.tjstats.com/comm-match-app/open/v1/compound/postMatchData?matchId=13503',
          ]

          def summarize(v, depth=0):
              if depth >= 4:
                  if isinstance(v, dict): return {'__keys__': list(v.keys())[:40]}
                  if isinstance(v, list): return {'__len__': len(v)}
                  return v
              if isinstance(v, dict):
                  out = {}
                  for k, val in list(v.items())[:60]:
                      out[k] = summarize(val, depth+1)
                  return out
              if isinstance(v, list):
                  return {'__len__': len(v), '__sample__': [summarize(x, depth+1) for x in v[:2]]}
              if isinstance(v, str) and len(v) > 160:
                  return v[:160] + '…'
              return v

          for url in urls:
              print('\n===', url, '===')
              req = urllib.request.Request(url, headers={
                  'Authorization': auth,
                  'Accept': 'application/json, text/plain, */*',
                  'User-Agent': 'RiftLab-CI/1.0',
                  'Referer': 'https://lpl.qq.com/',
                  'Origin': 'https://lpl.qq.com',
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      raw = r.read().decode('utf-8', 'replace')
                      print('HTTP', r.status, 'bytes', len(raw))
                      try:
                          data = json.loads(raw)
                          print(json.dumps(summarize(data), ensure_ascii=False, indent=2)[:18000])
                      except Exception:
                          print(raw[:4000])
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8','replace')
                  print('HTTP', e.code, raw[:4000])
              except Exception as e:
                  print('ERROR', repr(e))
          PY
