name: dev72 user audit apply

on:
  workflow_dispatch:
  push:
    branches: [ dev72-user-audit-fixes ]
    paths:
      - 'tools/apply_dev72_user_audit.py'
      - '.github/workflows/dev72-user-audit-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-user-audit-fixes
          fetch-depth: 0
      - name: Apply dev72 user-audit repairs
        run: python3 tools/apply_dev72_user_audit.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/TeamArchiveProvider.kt \
                  app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt \
                  app/src/main/java/com/riftlab/app/ui/ComprehensiveDataCoverageUi.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: fix global team archive, H2H perspective and mobile type"
          git push origin HEAD:dev72-user-audit-fixes
