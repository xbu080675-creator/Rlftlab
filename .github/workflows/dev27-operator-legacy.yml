name: RiftLab dev27 operator and legacy migration

on:
  push:
    paths:
      - 'tools/dev27_operator_legacy.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/dev27_operator_legacy.py
      - run: rm -f tools/dev27_operator_legacy.py .github/workflows/dev27-operator-legacy.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: track operators and legacy management"
          git push
