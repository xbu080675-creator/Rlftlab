name: Patch post-match archive

on:
  push:
    paths:
      - 'tools/patch_post_match.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply post-match patch
        run: python3 tools/patch_post_match.py
      - name: Commit patch
        run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/CompletedGameArchive.kt \
                  app/src/main/java/com/riftlab/app/data/LplCurrentGameLiveDataSource.kt \
                  app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt \
                  app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: restore real post-match series data"
            git push
          fi
