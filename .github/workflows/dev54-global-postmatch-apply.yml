name: Apply RiftLab dev54 global post-match

on:
  push:
    paths:
      - '.github/workflows/dev54-global-postmatch-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dev54 global post-match recovery
        run: python3 tools/apply_dev54_global_postmatch.py
      - name: Commit dev54
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/riftlab/app/data/OpggMatchSupplementProvider.kt \
            app/src/main/java/com/riftlab/app/data/MatchDetailRepository.kt \
            app/src/main/java/com/riftlab/app/ui/MatchDetailUi.kt \
            app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          git commit -m "feat: restore global post-match operator data"
          git pull --rebase origin main
          git push origin HEAD:main
