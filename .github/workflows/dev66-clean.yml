name: dev66 clean

on:
  push:
    branches:
      - dev66-mainland-ota-docs
    paths:
      - '.github/workflows/dev66-clean.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev66-mainland-ota-docs
          fetch-depth: 0
      - name: Prepare cleanup
        run: python3 tools/dev66_remove_gitee.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile cleaned dev66
        run: gradle :app:assembleDebug
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dev66-clean.yml
          rm -f .github/workflows/dev66-remove-gitee.yml
          rm -f .github/workflows/dev66-compile-check.yml
          rm -f tools/dev66_remove_gitee.py
          git add -A
          git commit -m "dev66: keep Gitee out of OTA and lock docs"
          git push origin HEAD:dev66-mainland-ota-docs
