name: Migrate OTA Publisher

on:
  push:
    paths:
      - 'tools/migrate_ota_publisher.py'
      - '.github/workflows/migrate-ota-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/migrate_ota_publisher.py
      - run: rm -f tools/migrate_ota_publisher.py .github/workflows/migrate-ota-publisher.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android-build.yml
          git rm -f tools/migrate_ota_publisher.py .github/workflows/migrate-ota-publisher.yml
          git commit -m "ci: publish OTA from Android Build"
          git push
