name: Fix RiftLab dev.47 apply staging

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-dev47-apply.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix staging and retrigger dev47
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/dev47-global-nav-apply.yml')
          text = p.read_text(encoding='utf-8')
          old = '          git add app DEV_CHANGELOG.txt .github/workflows/dev47-global-nav-apply.yml\n'
          new = '          git add -A\n'
          if old not in text:
              raise SystemExit('dev47 staging marker missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-dev47-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stage dev47 workflow self-deletion"
          git push origin main
