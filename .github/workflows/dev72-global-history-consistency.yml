name: dev72 global history consistency

on:
  push:
    branches:
      - dev72-global-history-consistency
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply global history consistency
        run: python3 tools/apply_dev72_global_history_consistency.py
      - name: Audit global history schema
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/java/com/riftlab/app/data/RiotLiveStatsHistoryResolver.kt
          grep -q 'parsePlayers(blueMeta, blueFrame, blueId, "BLUE")' "$FILE"
          grep -q 'parsePlayers(redMeta, redFrame, redId, "RED")' "$FILE"
          grep -q 'targetKey = LiveMatchTargetRegistry.key(match)' "$FILE"
          grep -q 'teamId = teamId' "$FILE"
          grep -q 'side = side' "$FILE"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Clean compile Android
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Commit verified history consistency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riftlab/app/data/RiotLiveStatsHistoryResolver.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'dev72: align global Riot history with live player identity'
          git push
