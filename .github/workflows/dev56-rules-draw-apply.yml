name: Apply RiftLab dev56 rules and draw

on:
  push:
    paths:
      - '.github/workflows/dev56-rules-draw-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dev56 patch
        run: python3 tools/apply_dev56_rules_draw.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt app/build.gradle.kts
          git commit -m "feat: add tournament rules and draw center (dev.56)"
          git pull --rebase origin main
          git push origin HEAD:main
