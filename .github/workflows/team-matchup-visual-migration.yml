name: Team Matchup Visual Migration

on:
  push:
    paths:
      - '.github/workflows/team-matchup-visual-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply global team matchup visual standard
        run: python3 .github/scripts/team_matchup_migration.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui
          git commit -m "ui: standardize team-vs-team scores on logos"
          git push
