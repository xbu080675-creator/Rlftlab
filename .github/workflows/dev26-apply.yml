name: RiftLab dev26 one-shot migration

on:
  push:
    paths:
      - 'tools/dev26_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/dev26_patch.py
      - run: rm -f tools/dev26_patch.py .github/workflows/dev26-apply.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: finish dynamic team data dev26"
          git push
