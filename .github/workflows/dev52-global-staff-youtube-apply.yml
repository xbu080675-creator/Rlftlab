name: Apply RiftLab dev52 global staff and YouTube fixes

on:
  push:
    paths:
      - '.github/workflows/dev52-global-staff-youtube-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dev52 fixes
        run: python3 tools/apply_dev52_global_staff_youtube_fix.py
      - name: Commit dev52
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/DynamicTeamDataProvider.kt \
                  app/src/main/java/com/riftlab/app/ui/GlobalReplayContent.kt \
                  app/src/main/java/com/riftlab/app/data/RiotVodRepository.kt \
                  app/src/main/java/com/riftlab/app/ui/TeamDetailUi.kt \
                  app/src/main/AndroidManifest.xml \
                  app/build.gradle.kts
          git commit -m "fix: resolve global staff and inline YouTube playback dev52"
          git pull --rebase origin main
          git push origin HEAD:main
