name: Probe Riot GCD
on:
  push:
    paths:
      - '.github/workflows/probe-leaguepedia-roster.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate official GCD tabs
        shell: python
        run: |
          import urllib.request, re, html
          sheet='1Y7k5kQ2AegbuyiGwEPsa62e883FYVtHqr6UVut9RC4o'
          url=f'https://docs.google.com/spreadsheets/u/1/d/{sheet}/pubhtml'
          req=urllib.request.Request(url,headers={'User-Agent':'RiftLab/1.0 GCD probe'})
          with urllib.request.urlopen(req,timeout=20) as r:
            text=r.read().decode('utf-8','replace')
            print('HTTP',r.status,'BYTES',len(text))
          # Published Sheets embeds tabs as gid/name pairs in several JS/HTML shapes.
          seen=set()
          patterns=[
            r'gid[=:](\d+).*?name[=:]["\']([^"\']+)',
            r'[?&]gid=(\d+)[^>]{0,300}>([^<>]{1,100})<',
            r'"sheetId"\s*:\s*(\d+).*?"title"\s*:\s*"([^"]+)"',
          ]
          for pattern in patterns:
            for gid,name in re.findall(pattern,text,re.I|re.S):
              name=html.unescape(re.sub(r'\s+',' ',name)).strip()
              key=(gid,name)
              if key not in seen:
                seen.add(key); print('TAB',gid,repr(name))
          for token in ['China','LPL','Coach','Coaching','Staff','Korea','EMEA','Americas','Pacific']:
            print('TOKEN',token,text.lower().find(token.lower()))
          if not seen:
            for m in re.finditer(r'gid',text,re.I):
              s=max(0,m.start()-180); e=min(len(text),m.start()+420)
              print('SNIP',re.sub(r'\s+',' ',text[s:e])[:600])
