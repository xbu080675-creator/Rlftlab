name: Probe Leaguepedia Roster
on:
  push:
    paths:
      - '.github/workflows/probe-leaguepedia-roster.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query BLG current roster
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          params={
            'action':'cargoquery',
            'format':'json',
            'tables':'ListplayerCurrent=LPC',
            'fields':'LPC.ID,LPC.Name,LPC.Role,LPC.IsSubstitute,LPC.IsTrainee,LPC.Team,LPC.N',
            'where':'LPC._pageName="Bilibili Gaming" AND LPC.ID IS NOT NULL',
            'order_by':'LPC.N ASC',
            'limit':'50'
          }
          url='https://lol.fandom.com/api.php?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'RiftLab/1.0 GitHub probe'})
          with urllib.request.urlopen(req,timeout=20) as r:
            text=r.read().decode('utf-8','replace')
            print('HTTP',r.status,'BYTES',len(text))
          data=json.loads(text)
          print('ROWS',len(data.get('cargoquery',[])))
          for row in data.get('cargoquery',[]):
            print(row.get('title',{}))