name: Probe Leaguepedia Roster
on:
  push:
    paths:
      - '.github/workflows/probe-leaguepedia-roster.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover BLG current roster key
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          def query(where):
            params={
              'action':'cargoquery','format':'json','tables':'ListplayerCurrent=LPC',
              'fields':'LPC._pageName=Page,LPC.ID,LPC.Name,LPC.Role,LPC.IsSubstitute,LPC.IsTrainee,LPC.Team,LPC.N',
              'where':where,'order_by':'LPC._pageName,LPC.N ASC','limit':'100'
            }
            url='https://lol.fandom.com/api.php?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'RiftLab/1.0 GitHub probe'})
            with urllib.request.urlopen(req,timeout=20) as r:
              text=r.read().decode('utf-8','replace')
              print('HTTP',r.status,'BYTES',len(text),'WHERE',where)
            data=json.loads(text)
            rows=data.get('cargoquery',[])
            print('ROWS',len(rows))
            for row in rows: print(row.get('title',{}))
          query('LPC._pageName LIKE "%Bilibili%" OR LPC.Team LIKE "%Bilibili%" OR LPC.Team="BLG"')