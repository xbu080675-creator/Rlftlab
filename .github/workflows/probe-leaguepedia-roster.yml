name: Probe Riot GCD
on:
  push:
    paths:
      - '.github/workflows/probe-leaguepedia-roster.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query official China GCD
        shell: python
        run: |
          import urllib.request, csv, io
          sheet='1Y7k5kQ2AegbuyiGwEPsa62e883FYVtHqr6UVut9RC4o'
          gid='594163931'
          url=f'https://docs.google.com/spreadsheets/d/{sheet}/pub?gid={gid}&single=true&output=csv'
          req=urllib.request.Request(url,headers={'User-Agent':'RiftLab/1.0 GCD probe'})
          with urllib.request.urlopen(req,timeout=20) as r:
            text=r.read().decode('utf-8-sig','replace')
            print('HTTP',r.status,'BYTES',len(text))
          rows=list(csv.reader(io.StringIO(text)))
          print('UPDATED',rows[0] if rows else [])
          print('HEADER',rows[1] if len(rows)>1 else [])
          print('--- BLG ---')
          for row in rows[2:]:
            if len(row)>1 and row[1].strip().upper()=='BILIBILI GAMING':
              print(row)
