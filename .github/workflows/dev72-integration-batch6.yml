name: dev72 integration batch6

on:
  workflow_dispatch:
  push:
    branches: [ dev72-integration-batch6 ]
    paths:
      - 'tools/apply_dev72_integration_batch6.py'
      - '.github/workflows/dev72-integration-batch6.yml'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-integration-batch6
          fetch-depth: 0
      - name: Apply integration patches
        run: python3 tools/apply_dev72_integration_batch6.py
      - name: Refresh bundled international mirror
        run: python3 tools/sync_international_events.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace
      - name: Commit verified integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt \
                  tools/sync_international_events.py \
                  data/global/international_events.json \
                  app/src/main/assets/data/international_events.json
          if git diff --cached --quiet; then
            echo "No integration source changes"
            exit 0
          fi
          git commit -m "dev72: wire verified international events into app"
          git push origin HEAD:dev72-integration-batch6
