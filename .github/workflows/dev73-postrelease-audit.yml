name: dev73 post-release audit

on:
  workflow_dispatch:
  push:
    branches: [ dev72-postrelease-audit ]
    paths:
      - '.github/workflows/dev73-postrelease-audit.yml'
      - 'tools/dev73_postrelease_audit.py'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-postrelease-audit
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Apply post-release audit fixes
        run: python3 tools/dev73_postrelease_audit.py
      - name: Verify dev73 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 73' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-dev.73"' app/build.gradle.kts
          grep -q 'RIFT_MIN_FONT_SCALE = 1.12f' app/src/main/java/com/riftlab/app/ui/RiftTheme.kt
          grep -q 'globalPostMatchProvider.fetch(latestCompleted)' app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt
          grep -q 'CompletedGameArchive::publishSeries' app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt
          grep -q 'LocalLiveInsightEngine()' app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt
          test ! -e app/src/main/java/com/riftlab/app/data/MockAiInsightEngine.kt
          ! grep -R -E 'fontSize[[:space:]]*=[[:space:]]*[89]\.sp' app/src/main/java/com/riftlab/app/ui
          grep -q 'fetchGlobalSchedule' app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          grep -q 'InternationalEventMirrorProvider.fetchMatches' app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev73-audit-candidate
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/src/main/java/com/riftlab/app app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(dev73): complete dev72 post-release remediation"
          git push origin HEAD:dev72-postrelease-audit
