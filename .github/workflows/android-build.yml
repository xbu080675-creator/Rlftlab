name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feat/schedule-center ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Probe Riot LoL Esports schedule center source
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          import urllib.error

          source = pathlib.Path("app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt").read_text()
          key = re.search(r'API_KEY = "([^"]+)"', source).group(1)
          league_id = re.search(r'LPL_LEAGUE_ID = "([^"]+)"', source).group(1)
          base = re.search(r'PERSISTED_BASE = "([^"]+)"', source).group(1)

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "x-api-key": key,
                      "Accept": "application/json",
                      "User-Agent": "RiftLab-CI/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      return json.load(response), response.status
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  print("HTTP", e.code, path, body[:240])
                  return {}, e.code
              except Exception as e:
                  print("ERROR", path, repr(e))
                  return {}, 0

          def schedule_page(token=None):
              path = f"/getSchedule?hl=en-US&leagueId={league_id}"
              if token:
                  path += "&pageToken=" + urllib.parse.quote(token, safe="")
              payload, status = get(path)
              schedule = payload.get("data", {}).get("schedule", {})
              return schedule, status

          center, status = schedule_page()
          print("schedule center http:", status)
          pages = [center]

          for direction in ("older", "newer"):
              token = center.get("pages", {}).get(direction)
              seen = set()
              for _ in range(2):
                  if not token or token in seen:
                      break
                  seen.add(token)
                  page, page_status = schedule_page(token)
                  print("schedule page", direction, "http", page_status, "events", len(page.get("events", [])))
                  pages.append(page)
                  token = page.get("pages", {}).get(direction)

          events = {}
          for page in pages:
              for event in page.get("events", []) or []:
                  if event.get("type") != "match":
                      continue
                  match = event.get("match", {}) or {}
                  event_id = str(event.get("id") or match.get("id") or "")
                  if event_id:
                      events[event_id] = event

          state_counts = collections.Counter(str(e.get("state", "unknown")) for e in events.values())
          print("schedule unique matches:", len(events))
          print("schedule states:", dict(state_counts))
          for event in sorted(events.values(), key=lambda e: str(e.get("startTime", "")))[:8]:
              teams = event.get("match", {}).get("teams", []) or []
              codes = " vs ".join(str(t.get("code") or t.get("name") or "?") for t in teams[:2])
              scores = ":".join(str((t.get("result") or {}).get("gameWins", 0)) for t in teams[:2])
              print(" match", event.get("startTime"), event.get("state"), codes, scores, event.get("blockName"))

          live, live_status = get("/getLive?hl=en-US")
          live_events = live.get("data", {}).get("schedule", {}).get("events", []) or []
          lpl_live = []
          for event in live_events:
              league = event.get("league", {}) or {}
              if str(league.get("id", "")) == league_id or str(league.get("slug", "")).lower() == "lpl":
                  lpl_live.append(event)
          print("getLive http:", live_status, "LPL events:", len(lpl_live))
          for event in lpl_live:
              teams = event.get("match", {}).get("teams", []) or []
              print(" live", event.get("id"), " / ".join(str(t.get("code", "?")) for t in teams[:2]))
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build fixed-signed debug APK
        run: gradle :app:assembleDebug
      - name: Verify fixed dev signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev5-schedule-center
          path: app/build/outputs/apk/debug/app-debug.apk
