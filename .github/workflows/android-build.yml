name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Probe Riot LoL Esports data source
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          import urllib.error

          source = pathlib.Path("app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt").read_text()
          key = re.search(r'API_KEY = "([^"]+)"', source).group(1)
          league_id = re.search(r'LPL_LEAGUE_ID = "([^"]+)"', source).group(1)
          base = re.search(r'PERSISTED_BASE = "([^"]+)"', source).group(1)

          def get(path):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "x-api-key": key,
                      "Accept": "application/json",
                      "User-Agent": "RiftLab-CI/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      return json.load(response), response.status
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  print("HTTP", e.code, path, body[:240])
                  return {}, e.code
              except Exception as e:
                  print("ERROR", path, repr(e))
                  return {}, 0

          schedule, _ = get(f"/getSchedule?hl=en-US&leagueId={league_id}")
          events = schedule.get("data", {}).get("schedule", {}).get("events", [])
          target = None
          for event in events:
              if event.get("type") != "match":
                  continue
              teams = event.get("match", {}).get("teams", [])
              codes = {str(team.get("code", "")).upper() for team in teams}
              if {"LGD", "IG"}.issubset(codes):
                  target = event
                  break
          print("schedule target:", target.get("startTime") if target else None, target.get("state") if target else None)

          live, _ = get("/getLive?hl=en-US")
          live_events = live.get("data", {}).get("schedule", {}).get("events", [])
          print("getLive events:", len(live_events) if isinstance(live_events, list) else "invalid")

          probes = [
              ("no-id", "/getTeams?hl=en-US"),
              ("lgd-gaming", "/getTeams?hl=en-US&id=lgd-gaming"),
              ("invictus-gaming", "/getTeams?hl=en-US&id=invictus-gaming"),
              ("invictus-gaming-ig", "/getTeams?hl=en-US&id=invictus-gaming-ig"),
          ]
          for label, path in probes:
              payload, status = get(path)
              teams = payload.get("data", {}).get("teams", [])
              print("probe", label, "http", status, "teams", len(teams) if isinstance(teams, list) else "invalid")
              for team in teams[:3] if isinstance(teams, list) else []:
                  print(
                      " team",
                      team.get("code"),
                      team.get("name"),
                      "id=" + str(team.get("id", "")),
                      "slug=" + str(team.get("slug", "")),
                      "players=" + str(len(team.get("players", []))),
                  )
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build fixed-signed debug APK
        run: gradle :app:assembleDebug
      - name: Verify fixed dev signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev4-riot-data-fixed-sign
          path: app/build/outputs/apk/debug/app-debug.apk
