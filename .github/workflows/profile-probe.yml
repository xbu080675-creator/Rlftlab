name: Profile Snapshot Probe

on:
  push:
    paths:
      - '.github/workflows/profile-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Leaguepedia Cargo in two batched requests
        shell: python
        run: |
          import json, time, urllib.parse, urllib.request

          BASE = 'https://lol.fandom.com/api.php'
          teams = [
              "Anyone's Legend", 'Bilibili Gaming', 'Top Esports', 'JD Gaming',
              'LGD Gaming', 'EDward Gaming', 'ThunderTalk Gaming', 'Invictus Gaming',
              'LNG Esports', 'Ninjas in Pyjamas.CN', 'Weibo Gaming', 'Team WE'
          ]

          def cargo(tables, fields, where, limit):
              params = urllib.parse.urlencode({
                  'action':'cargoquery','format':'json','tables':tables,
                  'fields':fields,'where':where,'limit':str(limit)
              })
              req = urllib.request.Request(BASE+'?'+params, headers={
                  'Accept':'application/json',
                  'User-Agent':'RiftLabSnapshotBot/1.0 (GitHub Actions; xbu080675-creator/Rlftlab)'
              })
              last = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=25) as r:
                          body = r.read().decode('utf-8')
                      obj = json.loads(body)
                      if 'error' in obj:
                          raise RuntimeError(obj['error'])
                      return obj.get('cargoquery', [])
                  except Exception as e:
                      last = e
                      print(f'cargo attempt {attempt+1} failed: {e}')
                      if attempt < 2: time.sleep(65)
              raise last

          q = lambda s: s.replace('\\','\\\\').replace('"','\\"')
          team_where = ' OR '.join(f'Name="{q(x)}"' for x in teams)
          team_rows = cargo('Teams', 'OverviewPage,Name,Short,Twitter,Youtube,Instagram,Facebook,Website', team_where, 50)

          overview = []
          for row in team_rows:
              t = row.get('title', {})
              name = t.get('OverviewPage') or t.get('Name')
              if name: overview.append(name)
          people_where = ' OR '.join(f'Team="{q(x)}"' for x in overview)
          time.sleep(65)
          people_rows = cargo('Players', 'ID,Name,Role,Team,Twitter,Weibo,Youtube,Stream,Instagram,Tiktok,IsPersonality', people_where, 500)

          payload = {'teams': team_rows, 'people': people_rows}
          print('RIFTLAB_PROFILE_SNAPSHOT_BEGIN')
          print(json.dumps(payload, ensure_ascii=False, separators=(',',':')))
          print('RIFTLAB_PROFILE_SNAPSHOT_END')
