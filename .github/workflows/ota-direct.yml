name: DEV OTA Direct

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'DEV_CHANGELOG.txt'
      - 'DEV_CURRENT_CHANGELOG.txt'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'signing/**'
      - '.github/workflows/ota-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riftlab-dev-ota-direct
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Bundle resilient data seeds
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          for name in riot_persisted_mirror.json team_profiles.json people.json team_archive.json; do
            if [ -f "data/lpl/$name" ]; then
              cp "data/lpl/$name" "app/src/main/assets/$name"
            fi
          done
          if [ -f "data/esports/esports_graph.json" ]; then
            cp "data/esports/esports_graph.json" "app/src/main/assets/esports_graph.json"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build fixed-signed debug APK
        env:
          RIFTLAB_OTA_PRIMARY_MANIFEST_URL: ${{ vars.RIFTLAB_OTA_PRIMARY_MANIFEST_URL }}
          RIFTLAB_GITHUB_ACCELERATOR_BASE_URLS: ${{ vars.RIFTLAB_GITHUB_ACCELERATOR_BASE_URLS }}
          RIFTLAB_GITHUB_ACCELERATOR_BASE_URL: ${{ vars.RIFTLAB_GITHUB_ACCELERATOR_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          ACCEL="${RIFTLAB_GITHUB_ACCELERATOR_BASE_URLS:-${RIFTLAB_GITHUB_ACCELERATOR_BASE_URL:-}}"
          gradle :app:assembleDebug \
            -PRIFTLAB_OTA_PRIMARY_MANIFEST_URL="${RIFTLAB_OTA_PRIMARY_MANIFEST_URL:-}" \
            -PRIFTLAB_GITHUB_ACCELERATOR_BASE_URLS="$ACCEL"
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - name: Prepare OTA package and metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="RiftLab-${VERSION_NAME}.apk"
          OUT="/tmp/${APK_NAME}"
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$OUT")
          CHANGELOG=$(python3 - <<'PY'
          from pathlib import Path
          current = Path('DEV_CURRENT_CHANGELOG.txt')
          source = current if current.exists() else Path('DEV_CHANGELOG.txt')
          text = source.read_text(encoding='utf-8').strip()
          first = text.split('\n\n', 1)[0].replace('\n', ' ').strip()
          print((first[:519].rstrip() + '…') if len(first) > 520 else first)
          PY
          )
          python3 - "$VERSION_NAME" "$VERSION_CODE" "$APK_NAME" "$SHA" "$SIZE" "$CHANGELOG" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          version_name, version_code, apk_name, sha256, size, changelog = sys.argv[1:]
          payload = {
              "schemaVersion": 1,
              "channel": "dev",
              "versionName": version_name,
              "versionCode": int(version_code),
              "apk": apk_name,
              "sha256": sha256,
              "size": int(size),
              "publishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "changelog": changelog,
          }
          with open('/tmp/latest.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')
          PY
          cat > /tmp/riftlab-release.txt <<EOF
          RIFTLAB_UPDATE
          versionName=$VERSION_NAME
          versionCode=$VERSION_CODE
          sha256=$SHA
          channel=dev
          changelog=$CHANGELOG
          EOF
          echo "RIFTLAB_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RIFTLAB_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RIFTLAB_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "RIFTLAB_APK_PATH=$OUT" >> "$GITHUB_ENV"
          echo "RIFTLAB_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
      - name: Publish canonical GitHub dev-latest OTA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f dev-latest "$GITHUB_SHA"
          git push -f origin refs/tags/dev-latest

          if gh release view dev-latest >/dev/null 2>&1; then
            RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/dev-latest" --jq .id)

            # Remove only an existing copy of this exact APK before publishing the new bytes.
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
              --jq ".[] | select(.name == \"$RIFTLAB_APK_NAME\") | .id" |
              while read -r AID; do
                [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
              done

            # Canonical source publishes APK first, then atomically switches latest.json.
            gh release upload dev-latest "$RIFTLAB_APK_PATH"
            gh release upload dev-latest /tmp/latest.json --clobber

            # Once the stable manifest points at the new APK, stale APKs are safe to remove.
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
              --jq ".[] | select((.name | endswith(\".apk\")) and .name != \"$RIFTLAB_APK_NAME\") | .id" |
              while read -r AID; do
                [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
              done

            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RID" \
              -f name="RiftLab $RIFTLAB_VERSION_NAME · DEV" \
              -f body="$(cat /tmp/riftlab-release.txt)" \
              -F prerelease=true \
              -f target_commitish="$GITHUB_SHA" >/dev/null
          else
            gh release create dev-latest "$RIFTLAB_APK_PATH" \
              --verify-tag \
              --title "RiftLab $RIFTLAB_VERSION_NAME · DEV" \
              --notes-file /tmp/riftlab-release.txt \
              --prerelease
            gh release upload dev-latest /tmp/latest.json
          fi

          echo "GitHub OTA manifest: https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/latest.json"

      - name: Mirror dev-latest to Gitee mainland OTA
        continue-on-error: true
        timeout-minutes: 15
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: xiaobaiaaa1
          GITEE_REPO: Rlftlab
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN is not configured; canonical GitHub OTA remains available."
            exit 0
          fi

          # Gitee currently limits a single Release attachment to 100 MiB. Do not let mirror
          # failure block the canonical GitHub publication; the app will fall back automatically.
          MAX_GITEE_ASSET=$((100 * 1024 * 1024))
          if [ "${RIFTLAB_APK_SIZE:-0}" -gt "$MAX_GITEE_ASSET" ]; then
            echo "APK is larger than 100 MiB; skip Gitee Release mirror and keep GitHub fallback."
            exit 0
          fi

          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          AUTH="access_token=${GITEE_TOKEN}"

          LOOKUP_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 45 \
            -H "Accept: application/json" \
            -o "$LOOKUP_FILE" -w '%{http_code}' \
            "$API/releases/tags/dev-latest?$AUTH")

          RID=""
          if [ "$HTTP_CODE" = "200" ]; then
            RID=$(jq -r '.id // empty' "$LOOKUP_FILE")
          elif [ "$HTTP_CODE" != "404" ]; then
            echo "Gitee release lookup failed: HTTP $HTTP_CODE"
            cat "$LOOKUP_FILE"
            exit 1
          fi
          rm -f "$LOOKUP_FILE"

          if [ -z "$RID" ]; then
            RID=$(curl -fsS --connect-timeout 10 --max-time 45 \
              -X POST \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=dev-latest" \
              --data-urlencode "name=RiftLab $RIFTLAB_VERSION_NAME · China OTA" \
              --data-urlencode "body@/tmp/riftlab-release.txt" \
              --data-urlencode "prerelease=true" \
              --data-urlencode "target_commitish=main" \
              "$API/releases" | jq -r '.id // empty')
            test -n "$RID"
          else
            curl -fsS --connect-timeout 10 --max-time 45 \
              -X PATCH \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "name=RiftLab $RIFTLAB_VERSION_NAME · China OTA" \
              --data-urlencode "body@/tmp/riftlab-release.txt" \
              --data-urlencode "prerelease=true" \
              --data-urlencode "target_commitish=main" \
              "$API/releases/$RID" >/dev/null
          fi

          list_gitee_assets() {
            curl -fsS --connect-timeout 10 --max-time 45 \
              -H "Accept: application/json" \
              "$API/releases/$RID/attach_files?$AUTH"
          }

          delete_gitee_asset_by_name() {
            local ASSET_NAME="$1"
            list_gitee_assets | jq -r --arg name "$ASSET_NAME" '.[] | select(.name == $name) | .id' |
              while read -r AID; do
                if [ -n "$AID" ]; then
                  curl -fsS --connect-timeout 10 --max-time 45 \
                    -X DELETE \
                    "$API/releases/$RID/attach_files/$AID?$AUTH" >/dev/null
                fi
              done
          }

          # Same safety ordering as GitHub: APK bytes first, latest.json only after they exist.
          delete_gitee_asset_by_name "$RIFTLAB_APK_NAME"
          curl -fsS --connect-timeout 10 --max-time 600 \
            -X POST \
            -F "access_token=$GITEE_TOKEN" \
            -F "file=@$RIFTLAB_APK_PATH;type=application/vnd.android.package-archive" \
            "$API/releases/$RID/attach_files" >/dev/null

          delete_gitee_asset_by_name "latest.json"
          curl -fsS --connect-timeout 10 --max-time 90 \
            -X POST \
            -F "access_token=$GITEE_TOKEN" \
            -F "file=@/tmp/latest.json;type=application/json" \
            "$API/releases/$RID/attach_files" >/dev/null

          # The new manifest is live; old APK attachments can now be removed.
          list_gitee_assets | jq -r --arg keep "$RIFTLAB_APK_NAME" \
            '.[] | select((.name | endswith(".apk")) and .name != $keep) | .id' |
            while read -r AID; do
              if [ -n "$AID" ]; then
                curl -fsS --connect-timeout 10 --max-time 45 \
                  -X DELETE \
                  "$API/releases/$RID/attach_files/$AID?$AUTH" >/dev/null
              fi
            done

          echo "Gitee mainland OTA manifest: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/dev-latest/latest.json"
