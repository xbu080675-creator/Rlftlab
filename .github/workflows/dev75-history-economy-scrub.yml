name: dev75 history economy scrub fix

on:
  push:
    branches: [ dev75-history-economy-scrub-fix ]
    paths:
      - '.github/workflows/dev75-history-economy-scrub.yml'
      - 'tools/dev75_history_economy_scrub_fix.py'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev75-history-economy-scrub-fix
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Apply scrub persistence fix
        run: python3 tools/dev75_history_economy_scrub_fix.py
      - name: Verify scrub persistence contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 75' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-dev.75"' app/build.gradle.kts
          grep -q 'selectedElapsedSecond' app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          grep -q 'selectedElapsedSecond = snapshots\[index\].elapsedSeconds' app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          ! grep -q 'remember(current.gameId, current.game, snapshots.size)' app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$DIGEST" = "769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev75-history-scrub-candidate
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit verified source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt app/build.gradle.kts DEV_CURRENT_CHANGELOG.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(dev75): keep historical economy scrub position after release"
          git push origin HEAD:dev75-history-economy-scrub-fix
