name: Probe Roster Schema
on:
  push:
    paths:
      - '.github/workflows/probe-roster-schema.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Riot BLG roster schema
        shell: python
        run: |
          import json, re, urllib.request, urllib.parse, datetime
          from pathlib import Path

          src = Path('app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt').read_text()
          key = re.search(r'API_KEY = "([^"]+)"', src).group(1)
          league = re.search(r'LPL_LEAGUE_ID = "([^"]+)"', src).group(1)
          headers={'x-api-key':key,'Accept':'application/json','User-Agent':'RiftLab-roster-probe'}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          tournaments=get(f'https://esports-api.lolesports.com/persisted/gw/getTournamentsForLeague?hl=en-US&leagueId={league}')
          ts=[]
          for lg in tournaments.get('data',{}).get('leagues',[]):
              ts.extend(lg.get('tournaments',[]) or [])
          today=datetime.date.today().isoformat()
          current=[t for t in ts if str(t.get('startDate') or '')[:10] <= today <= str(t.get('endDate') or '9999-12-31')[:10]]
          tournament=(current[-1] if current else sorted(ts,key=lambda t:str(t.get('startDate') or ''))[-1])
          tid=tournament.get('id')
          print('TOURNAMENT',tournament)
          standings=get('https://esports-api.lolesports.com/persisted/gw/getStandings?hl=en-US&tournamentId='+urllib.parse.quote(str(tid)))
          blg=None
          for standing in standings.get('data',{}).get('standings',[]):
              for stage in standing.get('stages',[]):
                  for section in stage.get('sections',[]):
                      for rank in section.get('rankings',[]) or []:
                          for t in rank.get('teams',[]) or []:
                              if (t.get('code') or '').upper()=='BLG': blg=t
          print('STANDINGS_BLG',blg)
          team_id=str((blg or {}).get('id') or '')
          team_slug=str((blg or {}).get('slug') or '')
          for lookup in [team_id, team_slug, 'bilibili-gaming', 'BLG']:
              if not lookup: continue
              root=get('https://esports-api.lolesports.com/persisted/gw/getTeams?hl=en-US&id='+urllib.parse.quote(lookup))
              teams=root.get('data',{}).get('teams',[])
              print('LOOKUP',lookup,'COUNT',len(teams))
              for idx,team in enumerate(teams[:3]):
                  print(' TEAM',idx,'KEYS',sorted(team.keys()))
                  for keyname in ['id','slug','code','name','image','status','homeLeague']:
                      if keyname in team: print('  ',keyname,repr(team.get(keyname)))
                  for arrname in ['players','coaches','staff','members']:
                      arr=team.get(arrname)
                      if isinstance(arr,list):
                          print('  ',arrname,'COUNT',len(arr))
                          for item in arr:
                              if not isinstance(item,dict):
                                  print('    ',repr(item)); continue
                              safe={k:item.get(k) for k in sorted(item.keys()) if k.lower() not in {'email','phone'}}
                              print('    ',safe)
