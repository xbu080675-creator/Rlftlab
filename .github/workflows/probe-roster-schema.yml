name: Probe Roster Schema
on:
  push:
    paths:
      - '.github/workflows/probe-roster-schema.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Riot BLG roster schema
        shell: python
        run: |
          import json, re, urllib.request, urllib.parse
          from pathlib import Path

          src = Path('app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt').read_text()
          key = re.search(r'API_KEY = "([^"]+)"', src).group(1)
          league = re.search(r'LPL_LEAGUE_ID = "([^"]+)"', src).group(1)
          headers={'x-api-key':key,'Accept':'application/json','User-Agent':'RiftLab-roster-probe'}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          sched=get(f'https://esports-api.lolesports.com/persisted/gw/getSchedule?hl=en-US&leagueId={league}')
          blg=None
          for ev in sched.get('data',{}).get('schedule',{}).get('events',[]):
              for t in ev.get('match',{}).get('teams',[]) if ev.get('type')=='match' else []:
                  if (t.get('code') or '').upper()=='BLG':
                      blg=t; break
              if blg: break
          print('SCHEDULE_BLG', {k:blg.get(k) for k in sorted(blg.keys()) if k not in {'result'}})
          tid=str(blg.get('id') or '')
          root=get('https://esports-api.lolesports.com/persisted/gw/getTeams?hl=en-US&id='+urllib.parse.quote(tid))
          teams=root.get('data',{}).get('teams',[])
          print('TEAM_COUNT',len(teams))
          for idx,team in enumerate(teams[:3]):
              print('TEAM',idx,'KEYS',sorted(team.keys()))
              for keyname in ['id','slug','code','name','image','status','homeLeague']:
                  if keyname in team: print(' ',keyname,repr(team.get(keyname)))
              for arrname in ['players','coaches','staff','members']:
                  arr=team.get(arrname)
                  if isinstance(arr,list):
                      print(' ',arrname,'COUNT',len(arr))
                      for item in arr:
                          if not isinstance(item,dict):
                              print('   ',repr(item)); continue
                          safe={k:item.get(k) for k in sorted(item.keys()) if k.lower() not in {'email','phone'}}
                          print('   ',safe)
