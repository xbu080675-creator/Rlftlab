name: dev73 final validation

on:
  push:
    branches: [ dev72-postrelease-audit ]
    paths:
      - '.github/workflows/dev73-final-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-postrelease-audit
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Verify global schedule contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt
          grep -q 'fetchGlobalScheduleWindow' "$FILE"
          grep -q 'GLOBAL_EXCLUDED_LEAGUE_SLUGS' "$FILE"
          ! grep -q 'GLOBAL_MAJOR_LEAGUE_SLUGS' "$FILE"
          ! grep -q 'val deepPaged' "$FILE"
      - name: Probe Riot global schedule completeness
        run: python3 tools/dev73_schedule_completeness_audit.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: dev73-final-validation
          path: |
            schedule-audit.json
            app/build/outputs/apk/debug/app-debug.apk
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev73-final-validation.yml
          git config user.name "PocketSpace"
          git config user.email "xbu080675@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(dev73): remove temporary final validation workflow"
          git push origin HEAD:dev72-postrelease-audit
