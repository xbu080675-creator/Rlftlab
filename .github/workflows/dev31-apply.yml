name: DEV31 Apply

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/dev31_app_patch.py'
      - '.github/workflows/dev31-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dev31 app patch
        run: python3 tools/dev31_app_patch.py
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java/com/riftlab/app/ui/TeamDetailUi.kt app/build.gradle.kts DEV_CHANGELOG.txt
          if git diff --cached --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'riftlab-dev-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: adopt organization graph and complete results'
          git push origin HEAD:main
