name: dev76 visual system v2

on:
  push:
    branches: [ dev76-visual-system-v2 ]
    paths:
      - '.github/workflows/dev76-visual-system.yml'
      - 'tools/dev76_visual_system_v2.py'
      - 'app/src/main/java/com/riftlab/app/ui/RiftVisualSystem.kt'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev76-visual-system-v2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Apply Visual System 2.0
        run: python3 tools/dev76_visual_system_v2.py
      - name: Verify visual contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 76' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-dev.76"' app/build.gradle.kts
          grep -q 'internal fun RiftHudPanel' app/src/main/java/com/riftlab/app/ui/RiftVisualSystem.kt
          grep -q 'GoldDifferenceChart' app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          grep -q 'detectDragGestures' app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          grep -q 'distinctBy { it.elapsedSeconds }' app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          ! grep -q 'NO MOCK FALLBACK' app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev76-visual-system-candidate
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit verified visual refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/src/main/java/com/riftlab/app/ui app/build.gradle.kts DEV_CURRENT_CHANGELOG.txt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(dev76): introduce visual system v2 and economy replay"
          git push origin HEAD:dev76-visual-system-v2
