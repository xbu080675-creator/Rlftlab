name: Apply RiftLab dev50 international catalog

on:
  push:
    paths:
      - '.github/workflows/dev50-international-catalog-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dev50 patch
        run: python3 tools/apply_dev50.py
      - name: Commit dev50
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/LeagueSubscriptionUi.kt app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt app/build.gradle.kts
          git commit -m "feat: promote Worlds 2026 and international event catalog dev50"
          git pull --rebase origin main
          git push origin HEAD:main
