name: DEV19 Patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dev19-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch post-match navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt')
          s = p.read_text()

          old = '''@Composable\nprivate fun PostScreen() {\n    val series by MatchSessionStore.completedSeries.collectAsState()'''
          new = '''@Composable\nprivate fun PostScreen() {\n    val context = LocalContext.current\n    val series by MatchSessionStore.completedSeries.collectAsState()'''
          if old not in s:
              raise SystemExit('PostScreen anchor not found')
          s = s.replace(old, new, 1)

          old = '''                Panel(accent = resolved.seriesFinished) {'''
          new = '''                Panel(\n                    accent = resolved.seriesFinished,\n                    onClick = {\n                        EntityDetailLauncher.openMatch(\n                            context,\n                            resolved.matchKey,\n                            resolved.teamA,\n                            resolved.teamB\n                        )\n                    }\n                ) {'''
          if old not in s:
              raise SystemExit('series panel anchor not found')
          s = s.replace(old, new, 1)

          old = '''            items(resolved.games) { game ->\n                Panel(accent = false) {'''
          new = '''            items(resolved.games) { game ->\n                Panel(\n                    accent = false,\n                    onClick = {\n                        EntityDetailLauncher.openMatch(\n                            context,\n                            resolved.matchKey,\n                            resolved.teamA,\n                            resolved.teamB\n                        )\n                    }\n                ) {'''
          if old not in s:
              raise SystemExit('game panel anchor not found')
          s = s.replace(old, new, 1)

          old = '''@Composable\nprivate fun Panel(accent: Boolean = false, content: @Composable ColumnScope.() -> Unit) {\n    Column(\n        Modifier.fillMaxWidth()'''
          new = '''@Composable\nprivate fun Panel(\n    accent: Boolean = false,\n    onClick: (() -> Unit)? = null,\n    content: @Composable ColumnScope.() -> Unit\n) {\n    val base = Modifier.fillMaxWidth()\n    val interactive = if (onClick != null) base.clickable(onClick = onClick) else base\n    Column(\n        interactive'''
          if old not in s:
              raise SystemExit('Panel anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name 'RiftLab CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt
          git commit -m 'feat: open full match detail from post-match cards'
          git push
