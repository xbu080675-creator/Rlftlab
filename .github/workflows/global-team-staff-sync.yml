name: Global Team Staff Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'tools/sync_global_team_staff.py'
      - '.github/workflows/global-team-staff-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync Riot GCD global team staff mirror
        run: python3 tools/sync_global_team_staff.py
      - name: Commit mirror update
        run: |
          if git diff --quiet -- data/global/team_staff.json; then
            echo "No mirror change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global/team_staff.json
          git commit -m "data: refresh Riot GCD global team staff mirror"
          git pull --rebase origin main
          git push origin HEAD:main
