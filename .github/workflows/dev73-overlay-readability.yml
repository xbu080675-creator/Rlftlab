name: dev73 overlay readability audit

on:
  push:
    branches: [ dev72-postrelease-audit ]
    paths:
      - '.github/workflows/dev73-overlay-readability.yml'
      - 'tools/dev73_overlay_readability_patch.py'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-postrelease-audit
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Patch overlay readability
        run: python3 tools/dev73_overlay_readability_patch.py
      - name: Verify overlay font floor
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E ',[[:space:]]*[89]f,' app/src/main/java/com/riftlab/app/overlay
          ! grep -R -F 'textSize = if (value.length > 2) 9f else 16f' app/src/main/java/com/riftlab/app/overlay
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$DIGEST" = "769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
      - name: Commit verified overlay fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/overlay
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): raise overlay text size floor"
          git push origin HEAD:dev72-postrelease-audit
