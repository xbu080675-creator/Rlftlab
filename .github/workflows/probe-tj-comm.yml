name: Probe TJStats Comm API

on:
  push:
    paths:
      - 'tools/probe_tj_comm.py'
      - '.github/workflows/probe-tj-comm.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe TJStats comm-match-app schema
        run: python3 tools/probe_tj_comm.py
