name: Apply dev46 global schedule partition fix
on:
  push:
    paths:
      - '.github/workflows/dev46-global-schedule-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch global schedule, standings and team lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'start marker not found: {start}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'end marker not found: {end}')
              return text[:a] + replacement + text[b:]

          # 1) Models: preserve league identity through schedule/tournament pipelines.
          p = Path('app/src/main/java/com/riftlab/app/data/Models.kt')
          s = p.read_text()
          old = '''data class ScheduledEsportsMatch(\n    val eventId: String,\n    val matchId: String,\n    val league: String,\n    val blockName: String,\n    val startTimeIso: String,\n    val state: String,\n    val bestOf: Int,\n    val teams: List<EsportsTeamRef>\n)\n'''
          new = '''data class ScheduledEsportsMatch(\n    val eventId: String,\n    val matchId: String,\n    val league: String,\n    val blockName: String,\n    val startTimeIso: String,\n    val state: String,\n    val bestOf: Int,\n    val teams: List<EsportsTeamRef>,\n    val leagueId: String = "",\n    val leagueSlug: String = ""\n)\n'''
          if old not in s: raise SystemExit('ScheduledEsportsMatch model pattern not found')
          s = s.replace(old, new, 1)
          old = '''data class EsportsTournamentRef(\n    val id: String,\n    val slug: String,\n    val startDate: String,\n    val endDate: String\n)\n'''
          new = '''data class EsportsTournamentRef(\n    val id: String,\n    val slug: String,\n    val startDate: String,\n    val endDate: String,\n    val leagueId: String = "",\n    val leagueSlug: String = "",\n    val leagueName: String = ""\n)\n'''
          if old not in s: raise SystemExit('EsportsTournamentRef model pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Riot schedule: one leagueId per request; merge all leagues afterward.
          p = Path('app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt')
          s = p.read_text()
          if 'import kotlinx.coroutines.async\n' not in s:
              s = s.replace(
                  'import kotlinx.coroutines.Dispatchers\n',
                  'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.async\nimport kotlinx.coroutines.awaitAll\nimport kotlinx.coroutines.coroutineScope\nimport kotlinx.coroutines.sync.Semaphore\nimport kotlinx.coroutines.sync.withPermit\n',
                  1
              )
          old_slugs = '''    val GLOBAL_MAJOR_LEAGUE_SLUGS = setOf(\n        "worlds", "msi", "first-stand", "first_stand", "ewc",\n        "lpl", "lck", "lec", "lcs", "lcp",\n        "cblol", "cblol-brazil", "pcs", "vcs", "ljl", "lla", "lrn", "lrs"\n    )'''
          new_slugs = '''    val GLOBAL_MAJOR_LEAGUE_SLUGS = setOf(\n        "worlds", "msi", "first-stand", "first_stand", "firststand", "ewc", "esports-world-cup",\n        "lpl", "lck", "lec", "lcs", "lta", "lta-north", "lta_north", "lta-south", "lta_south", "lcp",\n        "cblol", "cblol-brazil", "pcs", "vcs", "ljl", "lla", "lrn", "lrs"\n    )'''
          if old_slugs not in s: raise SystemExit('global league slug pattern not found')
          s = s.replace(old_slugs, new_slugs, 1)

          marker = 'internal data class LiveEventRef('
          if marker not in s: raise SystemExit('LiveEventRef marker missing')
          s = s.replace(marker, '''internal data class TrackedLeagueRef(\n    val id: String,\n    val slug: String,\n    val name: String\n)\n\n''' + marker, 1)

          fetch_global = '''    suspend fun fetchGlobalSchedule(): List<ScheduledEsportsMatch> {\n        val leagues = fetchTrackedLeagues()\n        if (leagues.isEmpty()) return emptyList()\n\n        val semaphore = Semaphore(4)\n        val results = coroutineScope {\n            leagues.map { league ->\n                async(Dispatchers.IO) {\n                    semaphore.withPermit {\n                        league to runCatching { fetchLeagueScheduleWindow(league) }.getOrDefault(emptyList())\n                    }\n                }\n            }.awaitAll()\n        }\n\n        return results\n            .flatMap { it.second }\n            .distinctBy { it.eventId.ifBlank { it.matchId } }\n            .sortedWith(\n                compareBy<ScheduledEsportsMatch> { parseInstant(it.startTimeIso) ?: Instant.MAX }\n                    .thenBy { it.leagueSlug }\n                    .thenBy { it.eventId }\n            )\n    }\n\n    private suspend fun fetchLeagueScheduleWindow(league: TrackedLeagueRef): List<ScheduledEsportsMatch> {\n        val pages = mutableListOf<JSONObject>()\n        val visitedTokens = mutableSetOf<String>()\n        val center = fetchSchedulePage(null, league.id)\n        pages += center\n\n        // One neighbour page in each direction is enough for the always-on phone refresh.\n        // Historical deep collection belongs in the central mirror, not in every five-minute APK poll.\n        var older = schedulePageToken(center, "older")\n        if (older.isNotBlank() && visitedTokens.add("older:$older")) {\n            pages += fetchSchedulePage(older, league.id)\n        }\n        var newer = schedulePageToken(center, "newer")\n        if (newer.isNotBlank() && visitedTokens.add("newer:$newer")) {\n            pages += fetchSchedulePage(newer, league.id)\n        }\n\n        return pages\n            .flatMap { parseSchedulePage(it, league) }\n            .distinctBy { it.eventId.ifBlank { it.matchId } }\n    }\n\n'''
          s = replace_between(
              s,
              '    suspend fun fetchGlobalSchedule(): List<ScheduledEsportsMatch> {',
              '    // Compatibility alias for older call sites while the app migrates away from LPL-only naming.',
              fetch_global
          )

          tracked_and_fetch = '''    internal suspend fun fetchTrackedLeagues(): List<TrackedLeagueRef> {\n        val discovered = runCatching {\n            val root = getJson("${LolEsportsConfig.PERSISTED_BASE}/getLeagues?hl=en-US")\n            val leagues = root.optJSONObject("data")?.optJSONArray("leagues") ?: JSONArray()\n            buildList {\n                for (i in 0 until leagues.length()) {\n                    val league = leagues.optJSONObject(i) ?: continue\n                    val id = league.optString("id")\n                    val slug = league.optString("slug").lowercase()\n                    val normalized = slug.replace('_', '-')\n                    val tracked = slug in LolEsportsConfig.GLOBAL_MAJOR_LEAGUE_SLUGS ||\n                        normalized in LolEsportsConfig.GLOBAL_MAJOR_LEAGUE_SLUGS\n                    if (id.isNotBlank() && tracked) {\n                        add(\n                            TrackedLeagueRef(\n                                id = id,\n                                slug = slug,\n                                name = league.optString("name").ifBlank { slug.uppercase() }\n                            )\n                        )\n                    }\n                }\n            }.distinctBy { it.id }\n        }.getOrDefault(emptyList())\n\n        return discovered.ifEmpty {\n            listOf(TrackedLeagueRef(LolEsportsConfig.LPL_LEAGUE_ID, "lpl", "LPL"))\n        }\n    }\n\n    private suspend fun fetchSchedulePage(pageToken: String?, leagueId: String): JSONObject {\n        val url = buildString {\n            append("${LolEsportsConfig.PERSISTED_BASE}/getSchedule?hl=en-US")\n            if (leagueId.isNotBlank()) {\n                append("&leagueId=")\n                append(URLEncoder.encode(leagueId, "UTF-8"))\n            }\n            if (!pageToken.isNullOrBlank()) {\n                append("&pageToken=").append(URLEncoder.encode(pageToken, "UTF-8"))\n            }\n        }\n        return getJson(url)\n    }\n\n'''
          s = replace_between(
              s,
              '    private suspend fun fetchTrackedLeagueIds(): List<String> {',
              '    private fun schedulePageToken(root: JSONObject, direction: String): String =',
              tracked_and_fetch
          )

          s = s.replace(
              '    private fun parseSchedulePage(root: JSONObject): List<ScheduledEsportsMatch> {',
              '    private fun parseSchedulePage(root: JSONObject, trackedLeague: TrackedLeagueRef): List<ScheduledEsportsMatch> {',
              1
          )
          old = '''                val league = event.optJSONObject("league")\n                val match = event.optJSONObject("match") ?: continue'''
          new = '''                val league = event.optJSONObject("league")\n                val leagueId = league?.optString("id").orEmpty().ifBlank { trackedLeague.id }\n                val leagueSlug = league?.optString("slug").orEmpty().ifBlank { trackedLeague.slug }\n                val leagueName = league?.optString("name").orEmpty().ifBlank { trackedLeague.name }\n                val match = event.optJSONObject("match") ?: continue'''
          if old not in s: raise SystemExit('schedule league parse pattern missing')
          s = s.replace(old, new, 1)
          old = '''                        league = league?.optString("name", "LoL Esports") ?: "LoL Esports",\n                        blockName = event.optString("blockName", ""),\n                        startTimeIso = event.optString("startTime"),\n                        state = verifiedScheduleState(rawState, bestOf, teams),\n                        bestOf = bestOf,\n                        teams = teams\n'''
          new = '''                        league = leagueName.ifBlank { "LoL Esports" },\n                        blockName = event.optString("blockName", ""),\n                        startTimeIso = event.optString("startTime"),\n                        state = verifiedScheduleState(rawState, bestOf, teams),\n                        bestOf = bestOf,\n                        teams = teams,\n                        leagueId = leagueId,\n                        leagueSlug = leagueSlug\n'''
          if old not in s: raise SystemExit('ScheduledEsportsMatch constructor pattern missing')
          s = s.replace(old, new, 1)
          old = '''            if (item.optString("slug").equals(slug, ignoreCase = true)) {\n                selected = item\n                break\n            }'''
          new = '''            if (\n                item.optString("id") == slug ||\n                item.optString("slug").equals(slug, ignoreCase = true)\n            ) {\n                selected = item\n                break\n            }'''
          if old not in s: raise SystemExit('team id/slug selection pattern missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Standings: discover/fetch tournaments for every tracked major league.
          p = Path('app/src/main/java/com/riftlab/app/data/LolEsportsStandingsClient.kt')
          s = p.read_text()
          if 'import kotlinx.coroutines.async\n' not in s:
              s = s.replace(
                  'import kotlinx.coroutines.Dispatchers\n',
                  'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.async\nimport kotlinx.coroutines.awaitAll\nimport kotlinx.coroutines.coroutineScope\nimport kotlinx.coroutines.sync.Semaphore\nimport kotlinx.coroutines.sync.withPermit\n',
                  1
              )
          start = s.index('    suspend fun fetchLplTournaments(): List<EsportsTournamentRef> {')
          end = s.index('    suspend fun fetchTournamentStandings', start)
          replacement = '''    private val leagueClient = LolEsportsApiClient()\n    private var tournamentCache: List<EsportsTournamentRef> = emptyList()\n    private var tournamentCacheAtEpochMs: Long = 0L\n\n    suspend fun fetchGlobalTournaments(): List<EsportsTournamentRef> {\n        val now = System.currentTimeMillis()\n        if (tournamentCache.isNotEmpty() && now - tournamentCacheAtEpochMs < 6 * 60 * 60 * 1000L) {\n            return tournamentCache\n        }\n\n        val leagues = leagueClient.fetchTrackedLeagues()\n        val semaphore = Semaphore(4)\n        val result = coroutineScope {\n            leagues.map { league ->\n                async(Dispatchers.IO) {\n                    semaphore.withPermit {\n                        runCatching { fetchTournamentsForLeague(league) }.getOrDefault(emptyList())\n                    }\n                }\n            }.awaitAll().flatten()\n        }.distinctBy { it.id }.sortedBy { it.startDate }\n\n        if (result.isNotEmpty()) {\n            tournamentCache = result\n            tournamentCacheAtEpochMs = now\n        }\n        return result.ifEmpty { tournamentCache }\n    }\n\n    suspend fun fetchLplTournaments(): List<EsportsTournamentRef> =\n        fetchGlobalTournaments().filter {\n            it.leagueSlug.equals("lpl", ignoreCase = true) || it.leagueId == LolEsportsConfig.LPL_LEAGUE_ID\n        }\n\n    private suspend fun fetchTournamentsForLeague(leagueRef: TrackedLeagueRef): List<EsportsTournamentRef> {\n        val encodedLeagueId = URLEncoder.encode(leagueRef.id, "UTF-8")\n        val root = getJson(\n            "${LolEsportsConfig.PERSISTED_BASE}/getTournamentsForLeague?hl=en-US&leagueId=$encodedLeagueId"\n        )\n        val leagues = root.optJSONObject("data")?.optJSONArray("leagues") ?: JSONArray()\n        val result = buildList {\n            for (i in 0 until leagues.length()) {\n                val league = leagues.optJSONObject(i) ?: continue\n                val tournaments = league.optJSONArray("tournaments") ?: JSONArray()\n                for (j in 0 until tournaments.length()) {\n                    val tournament = tournaments.optJSONObject(j) ?: continue\n                    val id = tournament.optString("id")\n                    if (id.isBlank()) continue\n                    add(\n                        EsportsTournamentRef(\n                            id = id,\n                            slug = tournament.optString("slug"),\n                            startDate = tournament.optString("startDate"),\n                            endDate = tournament.optString("endDate"),\n                            leagueId = leagueRef.id,\n                            leagueSlug = league.optString("slug").ifBlank { leagueRef.slug },\n                            leagueName = league.optString("name").ifBlank { leagueRef.name }\n                        )\n                    )\n                }\n            }\n        }\n        return result.distinctBy { it.id }.sortedBy { it.startDate }\n    }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # 4) Wire global tournaments into StandingsDataSource.
          p = Path('app/src/main/java/com/riftlab/app/data/LolEsportsDataSources.kt')
          s = p.read_text()
          old = '    override suspend fun fetchLeagueTournaments(): List<EsportsTournamentRef> = client.fetchLplTournaments()'
          new = '    override suspend fun fetchLeagueTournaments(): List<EsportsTournamentRef> = client.fetchGlobalTournaments()'
          if old not in s: raise SystemExit('standings datasource LPL pattern missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 5) Standings labels are no longer LPL-only, and selected standings refresh every cycle.
          p = Path('app/src/main/java/com/riftlab/app/data/StandingsCenterStore.kt')
          s = p.read_text()
          old = '''            if (selected != null && _state.value.standings?.tournamentId != selected.id) {\n                refreshStandings(selected)\n            }'''
          new = '''            if (selected != null) {\n                refreshStandings(selected)\n            }'''
          if old not in s: raise SystemExit('standings refresh pattern missing')
          s = s.replace(old, new, 1)
          start = s.index('    fun displayTournamentName(tournament: EsportsTournamentRef): String {')
          end = s.index('    fun containsDate(', start)
          replacement = '''    fun displayTournamentName(tournament: EsportsTournamentRef): String {\n        val slug = tournament.slug.lowercase()\n        val leagueSlug = tournament.leagueSlug.lowercase()\n        val leagueName = tournament.leagueName.ifBlank { tournament.leagueSlug.uppercase() }.ifBlank { "LoL Esports" }\n        val identity = "$leagueSlug $leagueName $slug".lowercase()\n        val year = parseDate(tournament.startDate)?.year?.toString().orEmpty()\n\n        return when {\n            identity.contains("worlds") || identity.contains("world championship") -> "$year 全球总决赛"\n            identity.contains("mid-season") || Regex("(^|[^a-z])msi([^a-z]|$)").containsMatchIn(identity) -> "$year 季中冠军赛"\n            identity.contains("first stand") || identity.contains("first-stand") || identity.contains("first_stand") -> "$year First Stand"\n            identity.contains("esports world cup") || Regex("(^|[^a-z])ewc([^a-z]|$)").containsMatchIn(identity) -> "$year Esports World Cup"\n            slug.contains("split_1") -> "$year $leagueName 第一赛段"\n            slug.contains("split_2") -> "$year $leagueName 第二赛段"\n            slug.contains("split_3") -> "$year $leagueName 第三赛段"\n            slug.contains("spring") -> "$year $leagueName 春季赛"\n            slug.contains("summer") -> "$year $leagueName 夏季赛"\n            slug.contains("regional") -> "$year $leagueName 区域资格赛"\n            else -> tournament.slug.replace('_', ' ').ifBlank { "$year $leagueName" }\n        }\n    }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # 6) Prematch roster lookup must prefer Riot team id globally, not derived LPL-ish slugs.
          p = Path('app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt')
          s = p.read_text()
          old = '''    private fun teamLookupSlug(team: EsportsTeamRef): String? {\n        if (team.slug.isNotBlank()) return team.slug\n\n        return team.name'''
          new = '''    private fun teamLookupSlug(team: EsportsTeamRef): String? {\n        if (team.id.isNotBlank()) return team.id\n        if (team.slug.isNotBlank()) return team.slug\n\n        return team.name'''
          if old not in s: raise SystemExit('prematch team lookup pattern missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 7) Event Center: partition by regions / Worlds / international, and never match tournaments by date alone.
          p = Path('app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt')
          s = p.read_text()
          marker = '''private enum class EventCenterTab(val label: String) {\n    SCHEDULE("赛程"),\n    STANDINGS("排名"),\n    POINTS("积分"),\n    BRACKET("淘汰赛"),\n    TEAMS("战队")\n}\n'''
          insert = marker + '''\nprivate enum class ScheduleDirectorySection(val label: String) {\n    REGIONAL("各大赛区"),\n    WORLDS("全球总决赛"),\n    INTERNATIONAL("国际赛事")\n}\n'''
          if marker not in s: raise SystemExit('EventCenterTab marker missing')
          s = s.replace(marker, insert, 1)
          s = s.replace('"按官方 Tournament 整理"', '"各大赛区 / 全球总决赛 / 国际赛事"', 1)

          start = s.index('@Composable\nprivate fun CompetitionDirectory(')
          end = s.index('@Composable\nprivate fun CompetitionMatches(', start)
          directory = '''@Composable\nprivate fun CompetitionDirectory(\n    buckets: List<ScheduleCompetitionBucket>,\n    currentMatchId: String?,\n    nextMatchId: String?,\n    onSelect: (ScheduleCompetitionBucket) -> Unit\n) {\n    val regional = buckets.filter { bucketSection(it) == ScheduleDirectorySection.REGIONAL }\n        .groupBy(::bucketLeagueLabel)\n        .toList()\n        .sortedBy { regionalLeagueOrder(it.first) }\n    val worlds = buckets.filter { bucketSection(it) == ScheduleDirectorySection.WORLDS }\n    val international = buckets.filter { bucketSection(it) == ScheduleDirectorySection.INTERNATIONAL }\n\n    LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n        if (regional.isNotEmpty()) {\n            item("section-regional") { DirectorySectionHeader(ScheduleDirectorySection.REGIONAL.label) }\n            regional.forEach { (league, leagueBuckets) ->\n                item("league-$league") { DirectoryLeagueHeader(league) }\n                items(leagueBuckets.sortedBy { it.firstEpochMs }, key = { it.key }) { bucket ->\n                    CompetitionDirectoryCard(bucket, currentMatchId, nextMatchId) { onSelect(bucket) }\n                }\n            }\n        }\n        if (worlds.isNotEmpty()) {\n            item("section-worlds") { DirectorySectionHeader(ScheduleDirectorySection.WORLDS.label) }\n            items(worlds.sortedBy { it.firstEpochMs }, key = { it.key }) { bucket ->\n                CompetitionDirectoryCard(bucket, currentMatchId, nextMatchId) { onSelect(bucket) }\n            }\n        }\n        if (international.isNotEmpty()) {\n            item("section-international") { DirectorySectionHeader(ScheduleDirectorySection.INTERNATIONAL.label) }\n            items(international.sortedBy { it.firstEpochMs }, key = { it.key }) { bucket ->\n                CompetitionDirectoryCard(bucket, currentMatchId, nextMatchId) { onSelect(bucket) }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun DirectorySectionHeader(title: String) {\n    Text(\n        title,\n        color = RiftCyan,\n        fontSize = 12.sp,\n        fontWeight = FontWeight.Bold,\n        modifier = Modifier.padding(top = 8.dp, bottom = 2.dp)\n    )\n}\n\n@Composable\nprivate fun DirectoryLeagueHeader(league: String) {\n    Text(\n        league,\n        color = RiftText,\n        fontSize = 14.sp,\n        fontWeight = FontWeight.SemiBold,\n        modifier = Modifier.padding(top = 5.dp, start = 4.dp)\n    )\n}\n\n@Composable\nprivate fun CompetitionDirectoryCard(\n    bucket: ScheduleCompetitionBucket,\n    currentMatchId: String?,\n    nextMatchId: String?,\n    onClick: () -> Unit\n) {\n    val currentMatch = bucket.matches.firstOrNull { it.matchId == currentMatchId }\n    val hasCurrent = currentMatch != null\n    val hasNext = bucket.matches.any { it.matchId == nextMatchId }\n    val completed = bucket.matches.count { MatchSessionStore.schedulePhase(it) == ScheduleMatchPhase.COMPLETED }\n    Column(\n        Modifier.fillMaxWidth()\n            .clickable(onClick = onClick)\n            .background(RiftPanel, CutCornerShape(topEnd = 14.dp, bottomStart = 8.dp))\n            .border(1.dp, if (hasCurrent) RiftCyan.copy(alpha = 0.55f) else RiftLine, CutCornerShape(topEnd = 14.dp, bottomStart = 8.dp))\n            .padding(horizontal = 14.dp, vertical = 13.dp)\n    ) {\n        Row(verticalAlignment = Alignment.CenterVertically) {\n            Column(Modifier.weight(1f)) {\n                Text(bucket.title, color = if (hasCurrent) RiftCyan else RiftText, fontSize = 17.sp, fontWeight = FontWeight.SemiBold)\n                Spacer(Modifier.height(4.dp))\n                Text(competitionRange(bucket.matches), color = RiftMuted, fontSize = 10.sp)\n            }\n            Column(horizontalAlignment = Alignment.End) {\n                when {\n                    hasCurrent -> Text(\n                        currentMatch?.let { scheduleActivityText(MatchSessionStore.scheduleActivity(it)) } ?: "进行中",\n                        color = RiftCyan,\n                        fontSize = 10.sp,\n                        fontWeight = FontWeight.Bold\n                    )\n                    hasNext -> Text("NEXT", color = RiftText, fontSize = 10.sp, fontWeight = FontWeight.SemiBold)\n                }\n                Text("${bucket.matches.size} 场 · 已结束 $completed", color = RiftMuted, fontSize = 9.sp)\n            }\n            Spacer(Modifier.width(8.dp))\n            Icon(Icons.Default.ChevronRight, null, tint = RiftMuted)\n        }\n    }\n}\n\nprivate fun bucketSection(bucket: ScheduleCompetitionBucket): ScheduleDirectorySection {\n    val sample = bucket.matches.firstOrNull()\n    val identity = listOf(\n        bucket.tournament?.leagueSlug.orEmpty(),\n        bucket.tournament?.leagueName.orEmpty(),\n        sample?.leagueSlug.orEmpty(),\n        sample?.league.orEmpty(),\n        bucket.title\n    ).joinToString(" ").lowercase()\n    return when {\n        identity.contains("worlds") || identity.contains("world championship") || identity.contains("全球总决赛") ->\n            ScheduleDirectorySection.WORLDS\n        identity.contains("mid-season") || Regex("(^|[^a-z])msi([^a-z]|$)").containsMatchIn(identity) ||\n            identity.contains("first stand") || identity.contains("first-stand") || identity.contains("first_stand") ||\n            identity.contains("esports world cup") || Regex("(^|[^a-z])ewc([^a-z]|$)").containsMatchIn(identity) ->\n            ScheduleDirectorySection.INTERNATIONAL\n        else -> ScheduleDirectorySection.REGIONAL\n    }\n}\n\nprivate fun bucketLeagueLabel(bucket: ScheduleCompetitionBucket): String {\n    val sample = bucket.matches.firstOrNull()\n    val slug = bucket.tournament?.leagueSlug.orEmpty().ifBlank { sample?.leagueSlug.orEmpty() }.lowercase()\n    val name = bucket.tournament?.leagueName.orEmpty().ifBlank { sample?.league.orEmpty() }\n    return when {\n        slug == "lpl" -> "LPL"\n        slug == "lck" -> "LCK"\n        slug == "lec" -> "LEC"\n        slug == "lcs" -> "LCS"\n        slug.startsWith("lta") -> "LTA"\n        slug == "lcp" -> "LCP"\n        slug.startsWith("cblol") -> "CBLOL"\n        slug == "pcs" -> "PCS"\n        slug == "vcs" -> "VCS"\n        slug == "ljl" -> "LJL"\n        slug == "lla" -> "LLA"\n        slug == "lrn" -> "LRN"\n        slug == "lrs" -> "LRS"\n        name.isNotBlank() -> name\n        else -> "其他赛区"\n    }\n}\n\nprivate fun regionalLeagueOrder(label: String): Int = when (label.uppercase()) {\n    "LPL" -> 0\n    "LCK" -> 1\n    "LEC" -> 2\n    "LCS" -> 3\n    "LTA" -> 4\n    "LCP" -> 5\n    "CBLOL" -> 6\n    "PCS" -> 7\n    "VCS" -> 8\n    "LJL" -> 9\n    "LLA" -> 10\n    "LRN" -> 11\n    "LRS" -> 12\n    else -> 99\n}\n\n'''
          s = s[:start] + directory + s[end:]

          start = s.index('private fun buildCompetitionBuckets(')
          end = s.index('private fun competitionRange(', start)
          buckets = '''private fun buildCompetitionBuckets(\n    matches: List<ScheduledEsportsMatch>,\n    tournaments: List<EsportsTournamentRef>\n): List<ScheduleCompetitionBucket> {\n    val official = tournaments.mapNotNull { tournament ->\n        val tournamentMatches = matches.filter { match ->\n            sameLeague(match, tournament) &&\n                matchStartDate(match)?.let { StandingsCenterStore.containsDate(tournament, it) } == true\n        }\n        if (tournamentMatches.isEmpty()) return@mapNotNull null\n        ScheduleCompetitionBucket(\n            key = tournament.id,\n            title = StandingsCenterStore.displayTournamentName(tournament),\n            matches = tournamentMatches.sortedBy(::matchStartEpochMs),\n            firstEpochMs = tournamentMatches.minOfOrNull(::matchStartEpochMs) ?: Long.MAX_VALUE,\n            tournamentId = tournament.id,\n            tournament = tournament\n        )\n    }\n\n    val used = official.flatMap { it.matches }.map(::scheduleIdentity).toSet()\n    val fallback = buildFallbackBuckets(matches.filterNot { scheduleIdentity(it) in used })\n    return (official + fallback)\n        .distinctBy { it.key }\n        .sortedBy { it.firstEpochMs }\n}\n\nprivate fun sameLeague(match: ScheduledEsportsMatch, tournament: EsportsTournamentRef): Boolean {\n    if (match.leagueId.isNotBlank() && tournament.leagueId.isNotBlank()) {\n        return match.leagueId == tournament.leagueId\n    }\n    val matchSlug = normalizeLeagueToken(match.leagueSlug)\n    val tournamentSlug = normalizeLeagueToken(tournament.leagueSlug)\n    if (matchSlug.isNotBlank() && tournamentSlug.isNotBlank()) return matchSlug == tournamentSlug\n    val matchName = normalizeLeagueToken(match.league)\n    val tournamentName = normalizeLeagueToken(tournament.leagueName)\n    return matchName.isNotBlank() && tournamentName.isNotBlank() && matchName == tournamentName\n}\n\nprivate fun buildFallbackBuckets(matches: List<ScheduledEsportsMatch>): List<ScheduleCompetitionBucket> {\n    val result = mutableListOf<ScheduleCompetitionBucket>()\n    matches\n        .mapNotNull { match -> matchStartDate(match)?.let { Triple(competitionLeagueKey(match), match, it) } }\n        .groupBy { it.first }\n        .forEach { (leagueKey, leagueEntries) ->\n            leagueEntries\n                .sortedBy { it.third }\n                .groupBy { it.third.year }\n                .forEach { (year, yearEntries) ->\n                    var index = 1\n                    var current = mutableListOf<Pair<ScheduledEsportsMatch, LocalDate>>()\n                    var previous: LocalDate? = null\n                    fun flush() {\n                        if (current.isEmpty()) return\n                        val stageMatches = current.map { it.first }\n                        result += ScheduleCompetitionBucket(\n                            key = "$year-$leagueKey-stage-$index",\n                            title = fallbackBucketTitle(stageMatches, year, index),\n                            matches = stageMatches,\n                            firstEpochMs = stageMatches.minOfOrNull(::matchStartEpochMs) ?: Long.MAX_VALUE\n                        )\n                        index += 1\n                        current = mutableListOf()\n                    }\n                    yearEntries.forEach { entry ->\n                        val date = entry.third\n                        val gap = previous?.let { ChronoUnit.DAYS.between(it, date) } ?: 0L\n                        if (current.isNotEmpty() && gap >= FALLBACK_STAGE_GAP_DAYS) flush()\n                        current += entry.second to date\n                        previous = date\n                    }\n                    flush()\n                }\n        }\n    return result.sortedBy { it.firstEpochMs }\n}\n\nprivate fun fallbackBucketTitle(matches: List<ScheduledEsportsMatch>, year: Int, index: Int): String {\n    val sample = matches.firstOrNull()\n    val identity = listOf(sample?.leagueSlug.orEmpty(), sample?.league.orEmpty()).joinToString(" ").lowercase()\n    return when {\n        identity.contains("worlds") || identity.contains("world championship") -> "$year 全球总决赛"\n        identity.contains("mid-season") || Regex("(^|[^a-z])msi([^a-z]|$)").containsMatchIn(identity) -> "$year 季中冠军赛"\n        identity.contains("first stand") || identity.contains("first-stand") || identity.contains("first_stand") -> "$year First Stand"\n        identity.contains("esports world cup") || Regex("(^|[^a-z])ewc([^a-z]|$)").containsMatchIn(identity) -> "$year Esports World Cup"\n        else -> "$year ${sample?.league?.ifBlank { sample.leagueSlug.uppercase() } ?: "LoL Esports"} ${stageName(index)}"\n    }\n}\n\nprivate fun competitionLeagueKey(match: ScheduledEsportsMatch): String =\n    normalizeLeagueToken(match.leagueId.ifBlank { match.leagueSlug.ifBlank { match.league } }).ifBlank { "lol-esports" }\n\nprivate fun normalizeLeagueToken(value: String): String = value\n    .lowercase()\n    .replace(Regex("[^a-z0-9]+"), "-")\n    .trim('-')\n\nprivate fun scheduleIdentity(match: ScheduledEsportsMatch): String =\n    match.eventId.ifBlank { match.matchId }.ifBlank { "${match.leagueId}:${match.startTimeIso}:${match.teams.joinToString { it.id.ifBlank { it.code } }}" }\n\nprivate fun stageName(index: Int): String = when (index) {\n    1 -> "第一赛段"\n    2 -> "第二赛段"\n    3 -> "第三赛段"\n    else -> "第${index}赛段"\n}\n\n'''
          s = s[:start] + buckets + s[end:]
          p.write_text(s)

          # 8) Version.
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = '''        versionCode = 45\n        versionName = "1.0.0-dev.45"\n'''
          new = '''        versionCode = 46\n        versionName = "1.0.0-dev.46"\n'''
          if old not in s: raise SystemExit('dev45 version pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '// dev.45: Cito REST/WebSocket provider credential slot and transport contract.',
              '// dev.46: per-league global schedule fetch + region/Worlds/international partition.'
          )
          p.write_text(s)
          PY
