name: Apply dev89 roster delivery diagnostics

on:
  push:
    paths:
      - '.github/workflows/dev89-roster-delivery-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expose roster transport state in pre-match UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt')
          s = p.read_text()
          old = '''                Text(
                    if (socialCount > 0) officialRosterState.message else data.rosterNote,
                    color = RiftMuted,
                    fontSize = 11.sp,
                    lineHeight = 17.sp
                )'''
          new = '''                Text(
                    officialRosterState.message,
                    color = if (socialCount > 0) RiftCyan else RiftMuted,
                    fontSize = 11.sp,
                    lineHeight = 17.sp
                )
                if (officialRosterState.diagnostics.isNotBlank()) {
                    Spacer(Modifier.height(4.dp))
                    Text(
                        "DELIVERY ${officialRosterState.endpointLabel} · checked ${officialRosterState.checkedEndpoints} · " +
                            (if (officialRosterState.usedLastGood) "LAST-GOOD CACHE" else "LIVE FETCH"),
                        color = RiftMuted,
                        fontSize = 10.sp,
                        lineHeight = 15.sp
                    )
                    Text(
                        officialRosterState.diagnostics,
                        color = RiftMuted,
                        fontSize = 9.sp,
                        lineHeight = 14.sp
                    )
                }
                if (socialCount == 0 && data.rosterNote.isNotBlank()) {
                    Spacer(Modifier.height(4.dp))
                    Text(data.rosterNote, color = RiftMuted, fontSize = 10.sp, lineHeight = 15.sp)
                }'''
          if old not in s:
              raise SystemExit('roster status block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/RiftLabApp.kt
          git commit -m "dev.89: expose official roster delivery diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
