name: dev72 replay timeline batch3

on:
  workflow_dispatch:
  push:
    branches: [ dev72-replay-timeline-batch3 ]
    paths:
      - 'tools/apply_dev72_replay_timeline.py'
      - '.github/workflows/dev72-replay-timeline-batch3.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-replay-timeline-batch3
          fetch-depth: 0
      - name: Apply replay and timeline repairs
        run: python3 tools/apply_dev72_replay_timeline.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/RiotVodRepository.kt \
                  app/src/main/java/com/riftlab/app/ui/GlobalReplayContent.kt \
                  app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: sync replay timestamp and add economy scrubber"
          git push origin HEAD:dev72-replay-timeline-batch3
