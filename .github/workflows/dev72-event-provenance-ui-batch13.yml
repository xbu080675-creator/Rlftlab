name: dev72 event provenance UI batch13

on:
  workflow_dispatch:
  push:
    branches: [ dev72-event-provenance-ui-batch13 ]
    paths:
      - 'tools/apply_dev72_event_provenance_ui_batch13.py'
      - '.github/workflows/dev72-event-provenance-ui-batch13.yml'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-event-provenance-ui-batch13
          fetch-depth: 0
      - name: Apply event provenance UI
        run: python3 tools/apply_dev72_event_provenance_ui_batch13.py
      - name: Audit provenance visibility
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/java/com/riftlab/app/ui/MatchReplayContent.kt
          grep -q 'TimelineEventEvidence' "$FILE"
          grep -q 'SOURCE · ${anchor.source}' "$FILE"
          grep -q '连续帧差分确认' "$FILE"
          grep -q '派生窗口 · 非官方事件分类' "$FILE"
          grep -q 'Provider 明确事件' "$FILE"
          grep -q 'event.source.ifBlank { "RiftLab 本机实时记录" }' "$FILE"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Commit verified UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/MatchReplayContent.kt
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "dev72: expose timeline event provenance in replay UI"
          git push origin HEAD:dev72-event-provenance-ui-batch13
