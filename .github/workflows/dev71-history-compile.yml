name: dev71 handbook governance compile

on:
  push:
    branches: [ dev71-data-coverage-repair ]
    paths:
      - '.github/workflows/dev71-history-compile.yml'
      - 'tools/apply_dev71_handbook_governance.py'
      - 'app/src/main/java/com/riftlab/app/data/OfficialHandbookGovernance2026.kt'

permissions:
  contents: write

concurrency:
  group: dev71-handbook-governance-compile
  cancel-in-progress: true

jobs:
  apply-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev71-data-coverage-repair
          fetch-depth: 0
      - name: Apply official handbook governance
        run: python3 tools/apply_dev71_handbook_governance.py
      - name: Static handbook guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OfficialHandbookGovernance2026.rulesFor' app/src/main/java/com/riftlab/app/data/TournamentGovernance.kt
          grep -q 'participantCodesFor' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          grep -q 'handbookQualification' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          grep -q '2026 Worlds · Riot 官方赛制' app/src/main/java/com/riftlab/app/data/OfficialHandbookGovernance2026.kt
          grep -q 'third Worlds place' docs/RIFTLAB_DEV71_DATA_COVERAGE_AUDIT.md
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile dev71 handbook tranche
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit validated handbook wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/riftlab/app/data/TournamentGovernance.kt \
            app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt \
            docs/RIFTLAB_DEV71_DATA_COVERAGE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No generated handbook changes to commit"
            exit 0
          fi
          git commit -m "dev71: wire Riot 2026 handbook rules and qualifiers"
          git push origin HEAD:dev71-data-coverage-repair
