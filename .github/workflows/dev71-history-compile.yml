name: dev71 qualification handbook compile

on:
  push:
    branches: [ dev71-data-coverage-repair ]
    paths:
      - '.github/workflows/dev71-history-compile.yml'
      - 'tools/apply_dev71_qualification_handbook.py'

permissions:
  contents: write

concurrency:
  group: dev71-qualification-handbook-compile
  cancel-in-progress: true

jobs:
  apply-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev71-data-coverage-repair
          fetch-depth: 0
      - name: Apply QualificationCenter handbook wiring
        run: python3 tools/apply_dev71_qualification_handbook.py
      - name: Static qualification guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'buildOfficialRegionalMechanismSnapshot' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'QualificationMechanism.DIRECT_PLACEMENT' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'QualificationMechanism.MIXED' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'qualification center handbook tranche' docs/RIFTLAB_DEV71_DATA_COVERAGE_AUDIT.md
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile dev71 qualification handbook tranche
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit validated QualificationCenter source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/riftlab/app/data/QualificationCenter.kt \
            docs/RIFTLAB_DEV71_DATA_COVERAGE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No generated qualification changes to commit"
            exit 0
          fi
          git commit -m "dev71: surface official regional qualification mechanisms"
          git push origin HEAD:dev71-data-coverage-repair
