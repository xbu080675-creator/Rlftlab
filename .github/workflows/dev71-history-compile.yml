name: dev71 qualification semantics compile

on:
  push:
    branches: [ dev71-data-coverage-repair ]
    paths:
      - '.github/workflows/dev71-history-compile.yml'
      - 'tools/apply_dev71_qualification_semantics.py'

permissions:
  contents: write

concurrency:
  group: dev71-qualification-compile
  cancel-in-progress: true

jobs:
  apply-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev71-data-coverage-repair
          fetch-depth: 0
      - name: Apply qualification semantics repair
        run: python3 tools/apply_dev71_qualification_semantics.py
      - name: Static qualification guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enum class QualificationMechanism' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'PARTICIPANT_ORIGIN' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q '这里不是 Championship Points 缺失' app/src/main/java/com/riftlab/app/ui/QualificationPathUi.kt
          grep -q '资格路径 / 参赛来源' app/src/main/java/com/riftlab/app/ui/TournamentEditionArchiveUi.kt
          grep -q 'Championship Points、名次直通、资格赛与国际赛参赛来源' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile dev71 qualification tranche
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit validated qualification source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/riftlab/app/data/QualificationCenter.kt \
            app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt \
            app/src/main/java/com/riftlab/app/ui/QualificationPathUi.kt \
            app/src/main/java/com/riftlab/app/ui/TournamentEditionArchiveUi.kt \
            docs/RIFTLAB_DEV71_DATA_COVERAGE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No generated qualification changes to commit"
            exit 0
          fi
          git commit -m "dev71: classify qualification mechanisms and participant origins"
          git push origin HEAD:dev71-data-coverage-repair
