name: dev71 final release validation

on:
  push:
    branches: [ dev71-data-coverage-repair ]
    paths:
      - '.github/workflows/dev71-history-compile.yml'
      - 'tools/apply_dev71_release_prep.py'
      - 'tools/apply_dev71_clean_build_fix.py'

permissions:
  contents: write

concurrency:
  group: dev71-final-release-validation
  cancel-in-progress: true

jobs:
  finalize-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev71-data-coverage-repair
          fetch-depth: 0
      - name: Repair clean-build generated inputs
        run: python3 tools/apply_dev71_clean_build_fix.py
      - name: Apply dev71 release metadata
        run: python3 tools/apply_dev71_release_prep.py
      - name: Bundle all resilient data seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          for name in riot_persisted_mirror.json team_profiles.json people.json team_archive.json; do
            if [ -f "data/lpl/$name" ]; then cp "data/lpl/$name" "app/src/main/assets/$name"; fi
          done
          for name in team_staff.json match_awards.json; do
            if [ -f "data/global/$name" ]; then cp "data/global/$name" "app/src/main/assets/$name"; fi
          done
          if [ -f data/esports/esports_graph.json ]; then
            cp data/esports/esports_graph.json app/src/main/assets/esports_graph.json
          fi
      - name: Final static guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 71' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-dev.71"' app/build.gradle.kts
          grep -q 'doLast { materializeTextBackedBuildInputs() }' app/build.gradle.kts
          grep -q '^dev.71：' DEV_CURRENT_CHANGELOG.txt
          grep -q '^dev.71：' DEV_CHANGELOG.txt
          grep -q '^dev.70：' DEV_CHANGELOG.txt
          grep -q '^dev.69：' DEV_CHANGELOG.txt
          grep -q 'OfficialLcpChampionshipPoints2026.rules' app/src/main/java/com/riftlab/app/data/QualificationCenter.kt
          grep -q 'loadBundled("team_staff.json")' app/src/main/java/com/riftlab/app/data/GlobalTeamStaffProvider.kt
          grep -q 'loadBundled("match_awards.json")' app/src/main/java/com/riftlab/app/data/GlobalVerifiedAwardsProvider.kt
          grep -q 'for name in team_staff.json match_awards.json' .github/workflows/ota-direct.yml
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean compile dev71
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED=769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"
      - name: Commit validated release metadata and clean-build repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts DEV_CURRENT_CHANGELOG.txt DEV_CHANGELOG.txt docs/RIFTLAB_DEV_67_86.md
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          git commit -m "dev71: finalize metadata and clean-build inputs"
          git push origin HEAD:dev71-data-coverage-repair
