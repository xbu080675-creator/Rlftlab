name: dev71 archive integrity compile

on:
  push:
    branches: [ dev71-data-coverage-repair ]
    paths:
      - '.github/workflows/dev71-history-compile.yml'
      - 'tools/apply_dev71_archive_integrity.py'

permissions:
  contents: write

concurrency:
  group: dev71-archive-integrity-compile
  cancel-in-progress: true

jobs:
  apply-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev71-data-coverage-repair
          fetch-depth: 0
      - name: Apply archive integrity fixes
        run: python3 tools/apply_dev71_archive_integrity.py
      - name: Static archive guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'patchVersions = old?.patchVersions.orEmpty()' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          grep -q 'standingsOverride = cachedHydratedStandings(record.tournamentId)' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          grep -q 'record.participantTeamCodes + standingsTeams + matchTeams' app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile dev71 archive tranche
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit validated archive source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt
          if git diff --cached --quiet; then
            echo "No generated archive changes to commit"
            exit 0
          fi
          git commit -m "dev71: preserve historical archive hydration"
          git push origin HEAD:dev71-data-coverage-repair
