name: dev73 schedule completeness audit

on:
  push:
    branches: [ dev72-postrelease-audit ]
    paths:
      - '.github/workflows/dev73-schedule-completeness-audit.yml'
      - 'tools/dev73_schedule_completeness_audit.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev72-postrelease-audit
      - name: Probe Riot global schedule
        run: python3 tools/dev73_schedule_completeness_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: dev73-schedule-audit
          path: schedule-audit.json
