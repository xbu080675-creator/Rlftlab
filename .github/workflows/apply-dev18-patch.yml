name: Cleanup dev18 Workflows
on:
  push:
    paths:
      - '.github/workflows/apply-dev18-patch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove one-shot probes and patch workflows
        run: |
          git rm -f \
            .github/workflows/apply-dev18-patch.yml \
            .github/workflows/apply-roster-runtime-patch.yml \
            .github/workflows/probe-leaguepedia-roster.yml \
            .github/workflows/probe-liquipedia-staff.yml \
            .github/workflows/probe-roster-schema.yml \
            .github/workflows/probe-team-assets.yml \
            .github/workflows/probe-tj-comm.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove temporary dev18 probes"
          git push
