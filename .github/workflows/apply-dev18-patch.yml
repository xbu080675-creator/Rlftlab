name: Apply dev18 Context Fix
on:
  push:
    paths:
      - '.github/workflows/apply-dev18-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch team detail navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt')
          s=p.read_text()
          old='TeamDetailRepository.open(team, selectedBucket.matches)'
          new='TeamDetailRepository.open(team, center.matches)'
          if old not in s:
              raise SystemExit('team open pattern not found')
          p.write_text(s.replace(old,new))
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          git commit -m "fix: derive current lineup from global schedule"
          git push
