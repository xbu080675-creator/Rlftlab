name: Fix RiftLab dev.48 compile

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-dev48-compile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Kotlin compile and subscription next target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/riftlab/app/ui/GlobalReplayContent.kt')
          text = p.read_text(encoding='utf-8')
          bad = 'modifier = Modifier.padding(top = 5.dp, horizontal = 2.dp)'
          good = 'modifier = Modifier.padding(start = 2.dp, top = 5.dp, end = 2.dp)'
          if bad not in text:
              raise SystemExit('GlobalReplay padding marker missing')
          p.write_text(text.replace(bad, good, 1), encoding='utf-8')

          p = Path('app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt')
          text = p.read_text(encoding='utf-8')
          old = '        val next = findNextMatch(center.matches, liveMatch.matchId)\n'
          new = '        val next = findNextMatch(center.matches.filter(::matchesHomepageSubscription), liveMatch.matchId)\n'
          if old not in text:
              raise SystemExit('subscription next marker missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/GlobalReplayContent.kt app/src/main/java/com/riftlab/app/data/MatchSessionStore.kt
          git commit -m "fix: compile global replay and scope next match to subscriptions"
          git push origin main
