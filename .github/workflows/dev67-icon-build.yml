name: dev67 icon build

on:
  push:
    branches:
      - dev67-icon-repack
    paths:
      - '.github/workflows/dev67-icon-build.yml'
      - 'app/src/main/icon/riftlab_launcher.webp.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev67-icon-repack
          fetch-depth: 0

      - name: Apply dev67 icon-only release changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          gradle = root / 'app/build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')

          text = text.replace('versionCode = 66', 'versionCode = 67', 1)
          text = text.replace('versionName = "1.0.0-dev.66"', 'versionName = "1.0.0-dev.67"', 1)

          marker = '''if (!devSigningStore.exists() && devSigningB64.exists()) {
              devSigningStore.parentFile.mkdirs()
              devSigningStore.writeBytes(Base64.getDecoder().decode(devSigningB64.readText().trim()))
          }
          '''
          icon_block = '''if (!devSigningStore.exists() && devSigningB64.exists()) {
              devSigningStore.parentFile.mkdirs()
              devSigningStore.writeBytes(Base64.getDecoder().decode(devSigningB64.readText().trim()))
          }

          // dev.67 icon-only release: keep the generated launcher artwork as text in Git and decode
          // it into build/generated so the exact generated WebP is packaged without adding binary blobs.
          val launcherIconB64 = file("src/main/icon/riftlab_launcher.webp.b64")
          val generatedLauncherResDir = layout.buildDirectory.dir("generated/riftlabLauncher/res")
          val generatedLauncherIcon = generatedLauncherResDir.get().file("drawable-nodpi/ic_launcher_riftlab.webp").asFile
          if (launcherIconB64.exists()) {
              generatedLauncherIcon.parentFile.mkdirs()
              val bytes = Base64.getDecoder().decode(launcherIconB64.readText().filterNot(Char::isWhitespace))
              if (!generatedLauncherIcon.exists() || !generatedLauncherIcon.readBytes().contentEquals(bytes)) {
                  generatedLauncherIcon.writeBytes(bytes)
              }
          }
          '''
          if 'val launcherIconB64 =' not in text:
              if marker not in text:
                  raise SystemExit('dev signing marker not found in app/build.gradle.kts')
              text = text.replace(marker, icon_block, 1)

          source_marker = '''android {
              namespace = "com.riftlab.app"
              compileSdk = 36
          '''
          source_repl = '''android {
              namespace = "com.riftlab.app"
              compileSdk = 36
              sourceSets["main"].res.srcDir(generatedLauncherResDir)
          '''
          if 'sourceSets["main"].res.srcDir(generatedLauncherResDir)' not in text:
              if source_marker not in text:
                  raise SystemExit('android marker not found in app/build.gradle.kts')
              text = text.replace(source_marker, source_repl, 1)

          dev67_comment = '// dev.67: icon-only repack. No product/runtime changes; package the new RiftLab launcher icon and republish OTA for normal-network download testing without VPN/system proxy.\n'
          if '// dev.67:' not in text:
              text = text.rstrip() + '\n\n' + dev67_comment
          gradle.write_text(text, encoding='utf-8')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          app_marker = '''    <application
                  android:name=".RiftLabApplication"
                  android:hardwareAccelerated="true"
          '''
          app_repl = '''    <application
                  android:name=".RiftLabApplication"
                  android:icon="@drawable/ic_launcher_riftlab"
                  android:roundIcon="@drawable/ic_launcher_riftlab"
                  android:hardwareAccelerated="true"
          '''
          if 'android:icon="@drawable/ic_launcher_riftlab"' not in text:
              if app_marker not in text:
                  raise SystemExit('application marker not found in AndroidManifest.xml')
              text = text.replace(app_marker, app_repl, 1)
          manifest.write_text(text, encoding='utf-8')

          changelog = (
              'dev.67：仅更新 RiftLab APK 启动器图标并重新封装、签名、分发；不改赛事数据、UI 功能、OTA 逻辑或其他运行时功能。'
              '本版本用于在未开启 VPN / 系统代理的普通网络环境下，实测现有 GitHub canonical dev-latest + APP 内请求级 GitHub 加速的更新下载链路。'
              '版本升级至 1.0.0-dev.67 / versionCode 67。'
          )
          (root / 'DEV_CURRENT_CHANGELOG.txt').write_text(changelog + '\n', encoding='utf-8')
          full = root / 'DEV_CHANGELOG.txt'
          old = full.read_text(encoding='utf-8')
          if not old.startswith('dev.67：'):
              full.write_text(changelog + '\n\n' + old, encoding='utf-8')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build dev67 APK
        run: gradle :app:assembleDebug

      - name: Verify packaged launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "application-icon-|application:.*icon='res/drawable"
          unzip -l "$APK" | grep -E 'res/drawable[^/]*/ic_launcher_riftlab.*\.(webp|png)'

      - name: Commit validated dev67
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dev67-icon-build.yml
          git add -A
          git commit -m "dev67: refresh launcher icon for OTA download test"
          git push origin HEAD:dev67-icon-repack
