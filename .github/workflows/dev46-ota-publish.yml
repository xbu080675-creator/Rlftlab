name: Publish RiftLab dev.46 OTA

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dev46-ota-publish.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Bundle resilient data seeds
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          for name in riot_persisted_mirror.json team_profiles.json people.json team_archive.json; do
            if [ -f "data/lpl/$name" ]; then
              cp "data/lpl/$name" "app/src/main/assets/$name"
            fi
          done
          if [ -f "data/esports/esports_graph.json" ]; then
            cp "data/esports/esports_graph.json" "app/src/main/assets/esports_graph.json"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build fixed-signed debug APK
        run: gradle :app:assembleDebug
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - name: Publish dev-latest OTA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          test "$VERSION_NAME" = "1.0.0-dev.46"
          test "$VERSION_CODE" = "46"
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          OUT="/tmp/RiftLab-${VERSION_NAME}.apk"
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          cat > /tmp/riftlab-release.txt <<EOF
          RIFTLAB_UPDATE
          versionName=$VERSION_NAME
          versionCode=$VERSION_CODE
          sha256=$SHA
          channel=dev
          changelog=dev.46：赛事中心完成全球 LoL 赛程分区修正。Riot 各赛区赛程改为逐 League 独立拉取后统一合并，不再把多个 leagueId 错误拼接；赛事目录按“各大赛区 / 全球总决赛 / 国际赛事”分类，Worlds 独立，MSI、First Stand、EWC 等国际赛事独立；Tournament 与赛程按赛区和时间共同匹配，避免跨赛区误归类。其他赛区战队资料改为优先使用 Riot 官方 team ID 解析，补齐 LCK、LEC、LCP 等非 LPL 战队的数据入口。同时保留 dev.45 的 Tachio / Cito API Key 安全配置，并修复 dev.46 首次构建时 ScheduleCenter 辅助函数缺失导致的 Kotlin 编译失败。
          EOF

          git tag -f dev-latest "$GITHUB_SHA"
          git push -f origin refs/tags/dev-latest

          if gh release view dev-latest >/dev/null 2>&1; then
            RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/dev-latest" --jq .id)
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RID/assets" --paginate \
              --jq '.[] | select(.name | endswith(".apk")) | .id' | \
              while read -r AID; do
                [ -n "$AID" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
              done
            gh release upload dev-latest "$OUT"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$RID" \
              -f name="RiftLab $VERSION_NAME · DEV" \
              -f body="$(cat /tmp/riftlab-release.txt)" \
              -F prerelease=true \
              -f target_commitish="$GITHUB_SHA" >/dev/null
          else
            gh release create dev-latest "$OUT" \
              --verify-tag \
              --title "RiftLab $VERSION_NAME · DEV" \
              --notes-file /tmp/riftlab-release.txt \
              --prerelease
          fi
