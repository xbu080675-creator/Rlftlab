name: Apply Roster Runtime Patch
on:
  push:
    paths:
      - '.github/workflows/apply-roster-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch runtime sources
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          replace_once(
              'app/src/main/java/com/riftlab/app/data/LolEsportsApiClient.kt',
              '''                        role = normalizeRole(player.optString("role")),\n                        imageUrl = playerImage\n''',
              '''                        role = normalizeRole(player.optString("role")),\n                        imageUrl = playerImage,\n                        firstName = player.optString("firstName"),\n                        lastName = player.optString("lastName")\n'''
          )

          path='app/src/main/java/com/riftlab/app/data/OpggMatchSupplementProvider.kt'
          p=Path(path); s=p.read_text()
          marker='''    private fun findMatch(target: ScheduledEsportsMatch): JSONObject? {\n'''
          method='''    /** Latest actually-played five for one team. Used only to distinguish current starters from active substitutes. */\n    suspend fun fetchLatestLineup(match: ScheduledEsportsMatch, team: EsportsTeamRef): Set<String> =\n        withContext(Dispatchers.IO) {\n            val opggMatch = findMatch(match) ?: return@withContext emptySet()\n            val matchId = opggMatch.opt("id")?.toString().orEmpty()\n            if (matchId.isBlank()) return@withContext emptySet()\n            val maxSets = match.bestOf.takeIf { it > 0 } ?: 5\n            for (set in maxSets downTo 1) {\n                val game = runCatching { fetchGame(matchId, set) }.getOrNull() ?: continue\n                if (game.length() == 0) continue\n                val players = game.optJSONArray("players") ?: continue\n                val names = linkedSetOf<String>()\n                for (i in 0 until players.length()) {\n                    val row = players.optJSONObject(i) ?: continue\n                    val rowTeam = row.optJSONObject("team") ?: JSONObject()\n                    if (!teamMatches(rowTeam, team)) continue\n                    val player = row.optJSONObject("player") ?: JSONObject()\n                    val name = player.optString("nickName").ifBlank { row.optString("nickName") }\n                    if (name.isNotBlank()) names += name\n                }\n                if (names.size >= 5) return@withContext names\n            }\n            emptySet()\n        }\n\n'''
          if marker not in s: raise SystemExit('OPGG marker not found')
          p.write_text(s.replace(marker,method+marker,1))

          path='app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt'
          p=Path(path); s=p.read_text()
          old='''.map { variants -> variants.maxByOrNull { if (it.imageUrl.isNotBlank()) 1 else 0 } ?: variants.first() }'''
          new='''.map { variants ->\n                variants.maxByOrNull { team ->\n                    (if (team.id.isNotBlank()) 8 else 0) +\n                        (if (team.slug.isNotBlank()) 4 else 0) +\n                        (if (team.imageUrl.isNotBlank()) 2 else 0) +\n                        (if (team.code.isNotBlank()) 1 else 0)\n                } ?: variants.first()\n            }'''
          if old not in s: raise SystemExit('team representative pattern not found')
          s=s.replace(old,new,1)
          old2='''                                    TeamDetailRepository.open(team)\n                                    selectedTeam = team'''
          new2='''                                    TeamDetailRepository.open(team, selectedBucket.matches)\n                                    selectedTeam = team'''
          if old2 not in s: raise SystemExit('team open pattern not found')
          p.write_text(s.replace(old2,new2,1))

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java
          git commit -m "feat: preserve substitutes and derive latest starters"
          git push
