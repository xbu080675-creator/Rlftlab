name: Apply RiftLab dev50 schedule opening fix

on:
  push:
    paths:
      - '.github/workflows/dev50-opening-fix-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dev50 opening fix
        run: python3 tools/apply_dev50_opening_fix.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/ScheduleCenterUi.kt
          git commit -m "fix: keep schedule center on subscribed league and promote Worlds"
          git pull --rebase origin main
          git push origin HEAD:main
