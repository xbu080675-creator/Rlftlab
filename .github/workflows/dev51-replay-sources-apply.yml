name: Apply RiftLab dev51 replay sources

on:
  push:
    paths:
      - '.github/workflows/dev51-replay-sources-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dev51 replay source patch
        run: python3 tools/apply_dev51_replay_sources.py
      - name: Commit dev51
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/GlobalReplayContent.kt \
                  app/src/main/java/com/riftlab/app/ui/MatchReplayContent.kt \
                  app/src/main/java/com/riftlab/app/data/RiotVodRepository.kt \
                  app/build.gradle.kts
          git commit -m "feat: prefer domestic official VOD for major international events dev51"
          git pull --rebase origin main
          git push origin HEAD:main
