name: dev68 comprehensive build

on:
  push:
    branches:
      - dev68-comprehensive-data
    paths:
      - '.github/workflows/dev68-comprehensive-build.yml'
      - 'tools/apply_dev68_comprehensive.py'
      - 'app/src/main/java/com/riftlab/app/data/ComprehensiveData.kt'
      - 'app/src/main/java/com/riftlab/app/data/ComprehensiveDataCenter.kt'
      - 'app/src/main/java/com/riftlab/app/ui/ComprehensiveDataCoverageUi.kt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev68-comprehensive-data
          fetch-depth: 0
      - name: Apply dev68 version, UI hook and docs
        run: python3 tools/apply_dev68_comprehensive.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile dev68
        run: gradle :app:assembleDebug
      - name: Commit validated dev68
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dev68-comprehensive-build.yml
          rm -f tools/apply_dev68_comprehensive.py
          git add -A
          git commit -m "dev68: begin comprehensive esports data graph"
          git push origin HEAD:dev68-comprehensive-data
