name: Patch dev8 compile fixes

on:
  push:
    paths:
      - 'tools/patch_dev8_compile_fix.py'
      - '.github/workflows/patch-dev8-compile-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compile fix
        run: python3 tools/patch_dev8_compile_fix.py
      - name: Commit fix
        run: |
          git config user.name "RiftLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/LplHistoricalPostMatchResolver.kt app/src/main/java/com/riftlab/app/update/AppUpdateManager.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: compile dev8 match detail and updater"
            git push
          fi
