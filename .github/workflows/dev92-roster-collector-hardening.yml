                        'def norm(s):\n    return "".join(ch for ch in (s or "").upper() if ch.isalnum())')

          infer = r'''def infer_date(text, published, timezone_name):
    m = re.search(r"(?<!\d)(\d{1,2})\s*[月/.-]\s*(\d{1,2})\s*日?", text or "")
    base = published or utc_now()
    try:
        zone = ZoneInfo(timezone_name or "UTC")
    except Exception:
        zone = timezone.utc
    local_base = base.astimezone(zone)
    if m:
        month, day = int(m.group(1)), int(m.group(2))
        return f"{local_base.year:04d}-{month:02d}-{day:02d}"
    if any(word in (text or "") for word in ("明日", "明天", "내일", "翌日")):
        local_base += timedelta(days=1)
    return local_base.date().isoformat()


'''
          s = replace_between(s, 'def infer_date(text, published, timezone_name):\n', 'def evidence_key(e):\n', infer + 'def evidence_key(e):\n')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/starting_roster_global_collector.py')
          s = p.read_text(encoding='utf-8')
          if 'import time\n' not in s:
              s = s.replace('import re\n', 'import re\nimport time\n')

          x_fetch = r'''def _fetch_x_reader(handle: str, limit: int = 20):
    handle = handle.lstrip("@")
    errors = []
    for host in ("x.com", "twitter.com"):
        try:
            url = f"https://r.jina.ai/http://{host}/{handle}"
            r = SESSION.get(url, timeout=25, headers={"Accept": "text/plain"})
            r.raise_for_status()
            body = r.text
            rx = re.compile(rf"https?://(?:x\\.com|twitter\\.com)/{re.escape(handle)}/status/(\\d+)", re.I)
            matches = list(rx.finditer(body))
            posts = []
            for i, m in enumerate(matches[:limit]):
                start = max(0, m.start() - 1000)
                end = matches[i + 1].start() if i + 1 < len(matches) else min(len(body), m.end() + 1600)
                chunk = body[start:end]
                imgs = re.findall(r"https?://pbs\\.twimg\\.com/media/[^\\s)]+", chunk)
                posts.append(_post(m.group(1), f"https://x.com/{handle}/status/{m.group(1)}", chunk, imgs, None))
            if posts:
                return posts
            errors.append(f"{host}:empty")
        except Exception as e:
            errors.append(f"{host}:{type(e).__name__}")
    raise RuntimeError("x_reader_failed:" + ",".join(errors))


def fetch_x_syndication(handle: str, limit: int = 20):
    handle = handle.lstrip("@")
    url = f"https://syndication.twitter.com/srv/timeline-profile/screen-name/{handle}"
    errors = []
    for attempt in range(3):
        try:
            r = SESSION.get(url, timeout=20)
            if r.status_code == 429:
                retry_after = r.headers.get("retry-after")
                try:
                    wait = min(5.0, max(1.0, float(retry_after))) if retry_after else 1.5 * (attempt + 1)
                except Exception:
                    wait = 1.5 * (attempt + 1)
                errors.append(f"syndication:429:{wait:.1f}s")
                time.sleep(wait)
                continue
            r.raise_for_status()
            soup = BeautifulSoup(r.text, "html.parser")
            posts = []
            nodes = soup.select("article, .timeline-Tweet, [data-tweet-id]")
            for node in nodes[:limit]:
                text = node.get_text(" ", strip=True)
                link = node.find("a", href=re.compile(r"/status/\d+"))
                href = urljoin("https://x.com", link.get("href")) if link else f"https://x.com/{handle}"
                pidm = re.search(r"/status/(\d+)", href)
                imgs = []
                for img in node.find_all("img"):
                    src = img.get("src") or img.get("data-src")
                    if src and ("pbs.twimg.com" in src or "twimg.com" in src):
                        imgs.append(src)
                t = node.find("time")
                posts.append(_post(pidm.group(1) if pidm else href, href, text, imgs, parse_time(t.get("datetime") if t else None)))
            if posts:
                return posts
            errors.append("syndication:empty")
            break
        except Exception as e:
            errors.append(f"syndication:{type(e).__name__}:{e}")
            break
    try:
        return _fetch_x_reader(handle, limit)
    except Exception as e:
        errors.append(str(e))
    raise RuntimeError("x_all_routes_failed[" + " | ".join(errors) + "]")


'''
          s = replace_between(s, 'def fetch_x_syndication(handle: str, limit: int = 20):\n', 'def fetch_youtube_atom(channel_id: str, limit: int = 20):\n', x_fetch + 'def fetch_youtube_atom(channel_id: str, limit: int = 20):\n')
          p.write_text(s, encoding='utf-8')
