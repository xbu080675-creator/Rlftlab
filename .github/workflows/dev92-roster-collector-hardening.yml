name: Apply dev92 roster collector hardening

on:
  push:
    paths:
      - '.github/workflows/dev92-roster-collector-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden global social collection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          p = Path('scripts/starting_roster_collector.py')
          s = p.read_text(encoding='utf-8')
