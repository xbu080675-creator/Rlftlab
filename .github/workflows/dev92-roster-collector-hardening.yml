          if 'from zoneinfo import ZoneInfo\n' not in s:
              s = s.replace('from urllib.parse import urljoin\n', 'from urllib.parse import urljoin\nfrom zoneinfo import ZoneInfo\n')

          s = s.replace('    "TOP": ["TOP", "上单"],', '    "TOP": ["TOP", "上单", "탑", "トップ"],')
          s = s.replace('    "JUG": ["JUG", "JUNGLE", "JGL", "打野"],', '    "JUG": ["JUG", "JUNGLE", "JGL", "打野", "정글", "ジャングル"],')
          s = s.replace('    "MID": ["MID", "中单"],', '    "MID": ["MID", "中单", "미드", "ミッド"],')
          s = s.replace('    "BOT": ["BOT", "ADC", "BOTTOM", "AD", "下路"],', '    "BOT": ["BOT", "ADC", "BOTTOM", "AD", "下路", "원딜", "ボット"],')
          s = s.replace('    "SUP": ["SUP", "SUPPORT", "辅助"],', '    "SUP": ["SUP", "SUPPORT", "辅助", "서폿", "サポート"],')

          weibo = r'''def _weibo_post(uid, mblog):
    pics = []
    for item in mblog.get("pics") or []:
        large = (item.get("large") or {}).get("url")
        if large:
            pics.append(large)
    infos = mblog.get("pic_infos") or {}
    for pid in mblog.get("pic_ids") or []:
        info = infos.get(str(pid)) or infos.get(pid) or {}
        large = (info.get("large") or {}).get("url") or (info.get("largest") or {}).get("url")
        if large:
            pics.append(large)
    bid = mblog.get("bid") or mblog.get("mblogid") or mblog.get("id")
    return {
        "id": str(mblog.get("id") or bid or ""),
        "url": f"https://weibo.com/{uid}/{bid}" if bid else f"https://weibo.com/u/{uid}",
        "published": parse_weibo_time(mblog.get("created_at")),
        "text": clean_html(mblog.get("text_raw") or mblog.get("text") or ""),
        "images": list(dict.fromkeys(pics)),
    }


def _weibo_reader_fallback(uid, limit=20):
    errors = []
    for target in (f"https://weibo.com/u/{uid}", f"https://m.weibo.cn/u/{uid}"):
        try:
            url = "https://r.jina.ai/http://" + target.removeprefix("https://")
            r = SESSION.get(url, timeout=20, headers={"Accept": "text/plain"})
            r.raise_for_status()
            body = r.text
            status_re = re.compile(rf"https?://(?:www\\.)?weibo\\.com/(?:u/)?{re.escape(str(uid))}/([A-Za-z0-9]+)")
            matches = list(status_re.finditer(body))
            out = []
            for i, m in enumerate(matches[:limit]):
                start = max(0, m.start() - 900)
                end = matches[i + 1].start() if i + 1 < len(matches) else min(len(body), m.end() + 1400)
                chunk = body[start:end]
                imgs = re.findall(r"https?://[^\\s)]+(?:sinaimg\\.cn|sinaimg\\.com)[^\\s)]*", chunk)
                out.append({
                    "id": m.group(1),
                    "url": m.group(0),
                    "published": None,
                    "text": chunk,
                    "images": list(dict.fromkeys(imgs)),
                })
            if out:
                return out
            errors.append("reader_empty")
        except Exception as e:
            errors.append(f"reader:{type(e).__name__}")
    raise RuntimeError("weibo_reader_failed:" + ",".join(errors))


def fetch_weibo_posts(uid, limit=20):
    errors = []
    try:
        SESSION.get(
            f"https://m.weibo.cn/u/{uid}",
            timeout=10,
            headers={"Referer": f"https://m.weibo.cn/u/{uid}"},
        )
    except Exception:
        pass

    routes = [
        (
            "mobile",
            f"https://m.weibo.cn/api/container/getIndex?type=uid&value={uid}&containerid=107603{uid}",
            {"Referer": f"https://m.weibo.cn/u/{uid}", "X-Requested-With": "XMLHttpRequest"},
        ),
        (
            "desktop",
            f"https://weibo.com/ajax/statuses/mymblog?uid={uid}&page=1&feature=0",
            {"Referer": f"https://weibo.com/u/{uid}", "X-Requested-With": "XMLHttpRequest"},
        ),
    ]
    for label, url, headers in routes:
        try:
            r = SESSION.get(url, timeout=15, headers=headers)
            r.raise_for_status()
            ctype = (r.headers.get("content-type") or "").lower()
            if "json" not in ctype and not r.text.lstrip().startswith(("{", "[")):
                errors.append(f"{label}:non_json:{r.status_code}:{ctype[:30]}")
                continue
            data = r.json()
            if label == "mobile":
                rows = []
                for card in ((data.get("data") or {}).get("cards") or []):
                    mb = card.get("mblog") or {}
                    if mb:
                        rows.append(mb)
            else:
                rows = ((data.get("data") or {}).get("list") or [])
            out = [_weibo_post(uid, row) for row in rows[:limit] if row]
            if out:
                return out
            errors.append(f"{label}:empty")
        except Exception as e:
            errors.append(f"{label}:{type(e).__name__}:{e}")

    try:
        return _weibo_reader_fallback(uid, limit)
    except Exception as e:
        errors.append(str(e))
    raise RuntimeError("weibo_all_routes_failed[" + " | ".join(errors) + "]")


'''
          s = replace_between(s, 'def fetch_weibo_posts(uid, limit=20):\n', 'def download_image(url):\n', weibo + 'def download_image(url):\n')

          s = s.replace('def ocr_image(img):\n    # psm 6 works better for poster-style blocks; multilingual packs are installed in CI.\n    configs = "--psm 6"\n    text = pytesseract.image_to_string(img, lang="chi_sim+eng", config=configs)\n    data = pytesseract.image_to_data(img, lang="chi_sim+eng", config=configs, output_type=pytesseract.Output.DICT)',
                        'def ocr_image(img):\n    # One OCR pass covers the official poster languages we support globally.\n    configs = "--psm 6"\n    langs = os.environ.get("RIFTLAB_OCR_LANGS", "chi_sim+eng+kor+jpn")\n    text = pytesseract.image_to_string(img, lang=langs, config=configs)\n    data = pytesseract.image_to_data(img, lang=langs, config=configs, output_type=pytesseract.Output.DICT)')

