name: RiftLab dev23 scope fix

on:
  push:
    paths:
      - 'tools/dev23_scope_fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/dev23_scope_fix.py
      - run: rm -f tools/dev23_scope_fix.py .github/workflows/dev23-scope-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: scope championship points to 2026 season"
          git push
