name: dev80-release-gate-fix

on:
  push:
    branches:
      - dev80-cito-websocket-fabric

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev80-cito-websocket-fabric
          fetch-depth: 0
      - name: Apply release-gate fixes
        run: python .github/dev80_release_gate_fix.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/data/CitoRealtimeLiveDataSource.kt \
                  app/src/main/java/com/riftlab/app/data/MatchTimelineStore.kt \
                  app/src/main/java/com/riftlab/app/data/MatchLifecycleArchive.kt \
                  DEV_CURRENT_CHANGELOG.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(dev.80): isolate realtime games and persist combat context"
            git push origin HEAD:dev80-cito-websocket-fabric
          fi
