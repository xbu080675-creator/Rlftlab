name: Run RiftLab dev.47 patch safely

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-dev47-fixed.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute dev47 patch body without mutating workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/dev47-global-nav-apply.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == 'run: |') + 1
          body = []
          for line in src[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          text = '\n'.join(body) + '\n'
          text = text.replace('git rm .github/workflows/dev47-global-nav-apply.yml\n', ': # keep workflow file out of bot commit\n')
          text = text.replace('git add app DEV_CHANGELOG.txt .github/workflows/dev47-global-nav-apply.yml\n', 'git add app DEV_CHANGELOG.txt\n')
          Path('/tmp/dev47.sh').write_text(text, encoding='utf-8')
          PY
          bash /tmp/dev47.sh
