name: RiftLab dev27 restore BLG You

on:
  push:
    paths:
      - 'tools/dev27_restore_you.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/dev27_restore_you.py
      - run: rm -f tools/dev27_restore_you.py .github/workflows/dev27-you-restore.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep BLG You as current manager"
          git push
