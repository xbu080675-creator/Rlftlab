name: Asset Probe

on:
  push:
    paths:
      - '.github/workflows/asset-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OP.GG LGD vs IG artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.request

          endpoint = 'https://esports.op.gg/matches/graphql'
          query = '''query GetGameByMatch($matchId: ID!, $set: Int) {
            gameByMatch(matchId: $matchId, set: $set) {
              teams { team { id name acronym imageUrl imageUrlDarkMode imageUrlLightMode } }
              players { team { acronym } player { id nickName imageUrl } }
            }
          }'''
          payload = json.dumps({
              'operationName': 'GetGameByMatch',
              'query': query,
              'variables': {'matchId': '32663', 'set': 1}
          }).encode()
          req = urllib.request.Request(endpoint, data=payload, headers={
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'Origin': 'https://esports.op.gg',
              'Referer': 'https://esports.op.gg/',
              'User-Agent': 'Mozilla/5.0 RiftLab-Asset-Probe'
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              root = json.load(r)
          game = root.get('data', {}).get('gameByMatch') or {}
          print('GRAPHQL_OK', bool(game))

          assets = []
          for row in game.get('teams') or []:
              team = row.get('team') or {}
              for key in ('imageUrlDarkMode','imageUrl','imageUrlLightMode'):
                  u = team.get(key)
                  if u:
                      assets.append((f"TEAM {team.get('acronym') or team.get('name')} {key}", u))
          for row in game.get('players') or []:
              p = row.get('player') or {}
              u = p.get('imageUrl')
              if u:
                  assets.append((f"PLAYER {p.get('nickName')} {row.get('team',{}).get('acronym','')}", u))

          seen = set()
          for label, url in assets:
              if url in seen: continue
              seen.add(url)
              print('ASSET', label, url)
              cmd = ['curl','-L','-sS','--connect-timeout','8','--max-time','15','-o','/dev/null','-w','HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} FINAL=%{url_effective}', url]
              try:
                  out = subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT)
              except subprocess.CalledProcessError as e:
                  out = f'curl_exit={e.returncode} {e.output.strip()}'
              print('CHECK', out)
          PY
