name: dev78 side alignment fix

on:
  push:
    branches: [ dev78-side-alignment-fix ]

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev78-side-alignment-fix
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Apply side-alignment fix
        run: python3 tools/dev78_side_alignment_fix.py
      - name: Verify side identity contracts
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="app/src/main/java/com/riftlab/app/data/MatchLifecycleArchive.kt"
          RIOT="app/src/main/java/com/riftlab/app/data/RiotLiveStatsHistoryResolver.kt"
          OPS="app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt"
          grep -q 'val terminal = finalGames\[game\]' "$ARCHIVE"
          grep -q 'snapshot.copy(blue = canonicalBlue, red = canonicalRed)' "$ARCHIVE"
          grep -q 'canonicalSideTruth = MatchLifecycleArchive.find(match)?.finalGames?.get(gameNumber)' "$RIOT"
          grep -q 'canonicalSideTruth?.blue.orEmpty()' "$RIOT"
          grep -q 'canonicalSideTruth?.red.orEmpty()' "$RIOT"
          ! grep -q 'teamCode(match, blueId, 0, "BLUE")' "$RIOT"
          ! grep -q 'teamCode(match, redId, 1, "RED")' "$RIOT"
          grep -q 'associateBy { it.elapsedSeconds }' "$OPS"
          grep -q 'versionCode = 78' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-dev.78"' app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev78-side-fix
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-side-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/main/java/com/riftlab/app/data/MatchLifecycleArchive.kt \
            app/src/main/java/com/riftlab/app/data/RiotLiveStatsHistoryResolver.kt \
            app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt \
            app/build.gradle.kts \
            DEV_CURRENT_CHANGELOG.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "fix(dev78): align historical telemetry with game sides"
            git push origin HEAD:dev78-side-alignment-fix
          fi
