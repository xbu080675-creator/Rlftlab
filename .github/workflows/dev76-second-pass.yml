name: dev76 visual second pass

on:
  push:
    branches: [ dev76-visual-system-v2 ]
    paths:
      - '.github/workflows/dev76-second-pass.yml'
      - 'tools/dev76_visual_system_second_pass.py'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev76-visual-system-v2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Apply visual second pass
        run: python3 tools/dev76_visual_system_second_pass.py
      - name: Verify global visual contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RiftHudPanel(accent = true)' app/src/main/java/com/riftlab/app/ui/TeamDetailUi.kt
          grep -q 'RiftSectionLabel(value)' app/src/main/java/com/riftlab/app/ui/TeamDetailUi.kt
          grep -q 'RiftHudPanel(onClick = { onOpen(platform) })' app/src/main/java/com/riftlab/app/ui/LiveBroadcastHub.kt
          grep -q 'RiftSectionLabel(title)' app/src/main/java/com/riftlab/app/ui/LiveBroadcastHub.kt
          grep -q 'RiftHudPanel(accent = selected != null)' app/src/main/java/com/riftlab/app/ui/TournamentEditionArchiveUi.kt
          grep -q 'ECONOMY SWING' app/src/main/java/com/riftlab/app/ui/MatchOperationsContent.kt
          grep -q 'versionCode = 76' app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Clean Android build
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon
      - name: Verify fixed dev signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED="769d9be3aa3af3fd4bb647bed8ffe4a8f7cfe2e7a9ad4489b260395b13575a24"
          echo "RiftLab dev signing SHA-256: $DIGEST"
          test "$DIGEST" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLab-dev76-second-pass-candidate
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit verified second pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "riftlab-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riftlab/app/ui/TeamDetailUi.kt app/src/main/java/com/riftlab/app/ui/LiveBroadcastHub.kt app/src/main/java/com/riftlab/app/ui/TournamentEditionArchiveUi.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(dev76): extend visual system v2 across primary surfaces"
          git push origin HEAD:dev76-visual-system-v2
